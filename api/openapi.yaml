    delete:
      tags: [Grants]
      operationId: removeGrant
      summary: Remove a grant
      security: [{ bearer: [] }, { session: [] }]
      responses:
        "204": { description: Removed. }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{acc}/users/{usr}/grants:
    parameters:
      - $ref: "#/components/parameters/acc"
      - $ref: "#/components/parameters/usr"
    get:
      tags: [Grants]
      operationId: listUserGrants
      summary: List the folders shared with a user
      security: [{ bearer: [] }, { session: [] }]
      responses:
        "200":
          description: The grants of the user, oldest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GrantList" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{acc}/groups:
    parameters:
      - $ref: "#/components/parameters/acc"
    post:
      tags: [Groups]
      operationId: createGroup
      summary: Create a group
      description: |
        With `external_id`, repeating the request with the same name returns the existing group
        (200), so a retry is safe. A name another group has is a conflict.
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "200":
          description: The group with this external_id already exists with the same name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        default: { $ref: "#/components/responses/Error" }
    get:
      tags: [Groups]
      operationId: listGroups
      summary: List the groups of the account
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: The groups, oldest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupList" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{acc}/groups/{grp}:
    parameters:
      - $ref: "#/components/parameters/acc"
      - $ref: "#/components/parameters/grp"
    get:
      tags: [Groups]
      operationId: getGroup
      summary: Get a group
      security: [{ bearer: [] }, { session: [] }]
      responses:
        "200":
          description: The group.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [Groups]
      operationId: updateGroup
      summary: Rename a group or change its external ID
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupUpdate" }
      responses:
        "200":
          description: The group.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [Groups]
      operationId: deleteGroup
      summary: Delete a group
      description: Removes the group, its members, and every permission it holds, in one transaction.
      security: [{ bearer: [] }, { session: [] }]
      responses:
        "204": { description: Deleted. }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{acc}/groups/{grp}/members:
    parameters:
      - $ref: "#/components/parameters/acc"
      - $ref: "#/components/parameters/grp"
    get:
      tags: [Groups]
      operationId: listGroupMembers
      summary: List the members of a group
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: The members, earliest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupMemberList" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{acc}/groups/{grp}/members/{usr}:
    parameters:
      - $ref: "#/components/parameters/acc"
      - $ref: "#/components/parameters/grp"
      - $ref: "#/components/parameters/usr"
    put:
      tags: [Groups]
      operationId: addGroupMember
      summary: Add a user to a group
      description: A user already in the group is left as it is. An installation admin cannot be a member.
      security: [{ bearer: [] }, { session: [] }]
      responses:
        "204": { description: The user is in the group. }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [Groups]
      operationId: removeGroupMember
      summary: Remove a user from a group
      description: The user's permissions through the group stop at once.
      security: [{ bearer: [] }, { session: [] }]
      responses:
        "204": { description: Removed. }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/admins:
    post:
      tags: [Admins]
      operationId: createAdmin
      summary: Create an installation admin
      description: |
        Admin key or admin session. Makes a pending admin user, who completes the link with
        `POST /api/v1/auth/verify`. Verification is `email`, or `link` for an admin key. An admin
        session gets email only, except for a link to a pending owner.
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCreate" }
      responses:
        "201":
          description: Created, with the verification made for it.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserWithVerification" }
        default: { $ref: "#/components/responses/Error" }
    get:
      tags: [Admins]
      operationId: listAdmins
      summary: List installation admins
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: The admins, oldest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminList" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/admins/{usr}:
    parameters:
      - $ref: "#/components/parameters/usr"
    delete:
      tags: [Admins]
      operationId: deleteAdmin
      summary: Delete an installation admin
      description: |
        Refused with `409 conflict` (`details.reason` `last_admin`) when this is the last active admin and no admin key without
        an expiry is active. A key with an expiry does not count.
      security: [{ bearer: [] }, { session: [] }]
      responses:
        "204": { description: Deleted. }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{acc}/users:
    parameters:
      - $ref: "#/components/parameters/acc"
    post:
      tags: [Users]
      operationId: createUser
      summary: Add a user to an account
      description: |
        Mail (`email` verification and resets) is limited to 30 messages an hour per account and
        3 an hour per address; past that the answer is `429 rate_limited`, and nothing is created.
        Account key, admin key, or an owner session. The `verification` method decides how the
        user proves the address:

        - `email`: Selfcloud mails a link. If mail is not configured, or the mail fails to send,
          the user is still created and `verification.sent` says whether the mail went out.
        - `link`: Selfcloud returns the link and token in `verification`, for the client to
          deliver.
        - `none`: the user is verified at once. Only an account or admin key may do this.

        With an `external_id`, repeating the request with the same email, display name, locale
        and role returns the existing user with status 200 and no new verification. Different
        fields get `409 conflict`, with the existing user's ID in `details.id`.
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreate" }
      responses:
        "201":
          description: Created. `verification` is present unless the method is `none`.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserWithVerification" }
        "200":
          description: A user with this external_id and these fields already existed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Error" }
    get:
      tags: [Users]
      operationId: listUsers
      summary: List an account's users
      description: Oldest first. Filter by `external_id` or `email` (case-insensitive).
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - name: external_id
          in: query
          description: Only the user with this external ID.
          schema: { type: string }
        - name: email
          in: query
          description: Only the user with this email address.
          schema: { type: string, format: email }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: One page of users.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserList" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/accounts/{acc}/users/{usr}:
    parameters:
      - $ref: "#/components/parameters/acc"
      - $ref: "#/components/parameters/usr"
    get:
      tags: [Users]
      operationId: getUser
      summary: Get a user
      security: [{ bearer: [] }, { session: [] }]
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDetail" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [Users]
      operationId: updateUser
      summary: Change a user
      description: |
        Only the fields given change. The email address cannot change; sending it is refused.
        Setting `status` to `active` needs a verified user (`409 conflict` otherwise). Setting
        `disabled` ends the user's sessions at once. An account always keeps an active owner,
        whoever the caller, the account key included: demoting or disabling the last active owner
        is refused with `409 conflict` and `details.reason` `last_owner`.
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdate" }
      responses:
        "200":
          description: The changed user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDetail" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [Users]
      operationId: deleteUser
      summary: Delete a user
      description: |
        Removes the user with its sessions, tokens, group memberships and permissions. The user's
        personal folder goes with it. If that folder holds any file or directory, the delete is
        refused with `conflict` unless `delete_files=true`, since the files are then gone for good.
        Instead, `transfer_to=usr_...` moves the files into a new directory in that user's My files,
        named after the deleted user, "<display name or email> (files)". It is a different answer:
        the two parameters cannot be given together. An owner session may name only an active member
        as the recipient, never itself and never another owner, and gets `forbidden` otherwise. The
        account key is not limited this way.

        Removing the last active owner is refused for every caller, the account key included, with
        `409 conflict` and `details.reason` `last_owner`; add the new owner first. A pending owner may
        be removed. A user session that deletes its own user gets `409 conflict` with
        `details.reason` `self`.
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - name: delete_files
          in: query
          required: false
          description: Delete the files of the user's personal folder too.
          schema: { type: boolean, default: false }
        - name: transfer_to
          in: query
          required: false
          description: An active user of the account whose My files take the files of this user.
          schema: { type: string, example: usr_5m2k8x1v0c3d9q7r4t6w8y0z2a }
      responses:
        "204":
          description: Deleted.
        default: { $ref: "#/components/responses/Error" }

  /api/v1/accounts/{acc}/users/{usr}/verification:
    parameters:
      - $ref: "#/components/parameters/acc"
      - $ref: "#/components/parameters/usr"
    post:
      tags: [Users]
      operationId: sendVerification
      summary: Verify a pending user again, or verify them outright
      description: |
        Only for a pending user (`409 conflict` otherwise). Sends a fresh link, or creates one
        for the client to deliver, and voids earlier ones. Method `none` verifies the user at
        once and needs an account or admin key.
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerificationRequest" }
      responses:
        "200":
          description: The user, with the verification made for it when there was one.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserWithVerification" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/accounts/{acc}/users/{usr}/sign-in-links:
    parameters:
      - $ref: "#/components/parameters/acc"
      - $ref: "#/components/parameters/usr"
    post:
      tags: [Users]
      operationId: createSignInLink
      summary: Make a sign-in link for a user
      description: |
        For an application that holds the account's own key and has signed its user in itself. The
        answer is a single-use link that starts a normal session for the user, with no password and
        no TOTP: the client vouches for the user (decided 2026-10-29). The link works once and for
        `users.sign_in_link_ttl` (60 seconds by default, at most 10 minutes). The token is only in
        the URL's fragment, so it never reaches a server log, a proxy or a Referer. Only the account's
        own key may call this: an admin key, a session and a delegated token are refused. The audit
        entry (`user.sign_in_link`) names the user and never holds the token, the URL or the path.
        Rate-limited per account, 60 a minute.
      security: [{ bearer: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignInLinkRequest" }
      responses:
        "201":
          description: The link. Give it to the browser; it opens it once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignInLink" }
        "400":
          description: |
            `invalid_request`: `next` is not a path on this site. It must start with exactly one
            `/`, have no backslash, scheme, host, control character or space, no percent-encoded dot,
            slash or backslash (`%2e`, `%2f`, `%5c`, which a browser can turn into another host), and
            be at most 2048 bytes. Encode a space as `%20`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: |
            `forbidden`: the caller is not the account's own key. `user_not_verified`: the user is
            pending. `user_disabled`: the user is disabled. `account_suspended`: the account is
            suspended. A key of an account being deleted is refused earlier, at
            authentication, with `unauthenticated`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: |
            `not_found`: no such user in this account. An installation admin is not in any account,
            so it is not found here either.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: "`rate_limited`, with `Retry-After`."
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/accounts/{acc}/users/{usr}/password-reset:
    parameters:
      - $ref: "#/components/parameters/acc"
      - $ref: "#/components/parameters/usr"
    post:
      tags: [Users]
      operationId: sendPasswordReset
      summary: Send or create a password-reset link for an active user
      description: The link works once and for the reset TTL (`users.reset_ttl`). Earlier reset links stop working.
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetRequest" }
      responses:
        "200":
          description: How the link was delivered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Verification" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/auth/verify:
    post:
      tags: [Auth]
      operationId: verifyUser
      summary: Complete a verification link
      description: |
        Sets the password if the user has none, makes the user active, and signs them in. The
        link works once. An unknown, used or expired link gets `invalid_request`, whatever its
        history. Rate-limited per client address.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyRequest" }
      responses:
        "200":
          description: Signed in. The session cookie is set.
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignedIn" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/auth/sign-in-link:
    post:
      tags: [Auth]
      operationId: redeemSignInLink
      summary: Complete a sign-in link
      description: |
        Consumes the link and signs the browser in as its user, with a normal session: the same
        cookie, the CSRF token in the answer, and the same limits as a password sign-in. Any session
        this browser already had is ended first. An unknown, used, expired or malformed link gets
        `invalid_request`, whatever its history. A user or account that may no longer sign in gets
        `user_not_verified`, `user_disabled` or `account_suspended`, and that refusal also uses the
        link up. Rate-limited per client address.

        A browser whose live session belongs to another user than the link's is not switched by a
        request without `confirm`: it gets `409 conflict` with `details.reason` `signed_in_as_other`,
        `details.current` and `details.target` (each `{name, email}`), and nothing is consumed,
        deleted or audited. Send the request again with `confirm` true to switch, or do not send it
        to stay; the link keeps its life either way.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignInLinkRedeemRequest" }
      responses:
        "200":
          description: Signed in. The session cookie is set. `next` is the path the page opens.
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignInLinkSignedIn" }
        "409":
          description: |
            This browser is signed in as another user and `confirm` is not true. `details.reason` is
            `signed_in_as_other`; `details.current` is the signed-in user and `details.target` the link's
            user, each `{name, email}` with the display name, or the email when it is empty. Nothing changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in
      description: |
        Checks the password against every user with this email. One match is signed in, unless
        the user is pending (`user_not_verified`), disabled (`user_disabled`) or the account is
        suspended (`account_suspended`). Several matches, all with this password, give `409
        conflict` with `details.accounts` listing them; send the same request again with
        `account` set. No match gives `unauthenticated`. Rate-limited per client address and
        per email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Signed in. The session cookie is set.
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignedIn" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Sign out
      description: Ends the session and clears the cookie. Needs the session cookie and the CSRF token.
      security: [{ session: [] }]
      responses:
        "204":
          description: Signed out.
        default: { $ref: "#/components/responses/Error" }

  /api/v1/auth/password/forgot:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Ask for a password-reset link
      description: |
        Always answers 202. If an active user has this email, a reset link is mailed in the
        background. Rate-limited per client address and per email. Past the forgot budget
        (3 an hour per address, 20 an hour per client address) no mail is sent, and the answer is
        still 202. Each address gets one reset an hour that no account cap counts. Any further
        reset for that address within the hour also counts against its account (30 an hour, where
        an installation admin counts as one account). So a caller cannot stop a user's first
        reset by using up the account's budget. Its buckets are separate from the ones invitations
        and resends use.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForgotRequest" }
      responses:
        "202":
          description: Accepted. Says nothing about whether the email is known.
        default: { $ref: "#/components/responses/Error" }

  /api/v1/auth/password/reset:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Set a new password with a reset link
      description: |
        The link works once. Every session of the user ends, and the answer starts a new
        session. Rate-limited per client address.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetRequest" }
      responses:
        "200":
          description: Signed in with the new password. The session cookie is set.
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignedIn" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: The signed-in user
      description: The user, their account and the CSRF token for unsafe requests.
      security: [{ session: [] }]
      responses:
        "200":
          description: The user and account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [Auth]
      operationId: updateMe
      summary: Change the signed-in user's display name or language
      description: |
        Session only, so the request needs the `Origin` header and the `X-CSRF-Token` header, as
        `POST /me/password` does. Only `display_name` and `locale` can change here. The answer is
        the same as `GET /me`.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MeUpdate" }
      responses:
        "200":
          description: The user, their account and the CSRF token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/me/storage/largest:
    get:
      tags: [Auth]
      operationId: getMyLargestFiles
      summary: The largest files in the signed-in user's My files
      description: Session only. Each file carries `in_trash` and `versions_bytes`.
      security: [{ session: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: A page of files, largest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LargeFiles" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/me/password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Change your own password
      description: |
        Checks the current password, then ends every session of the user and starts a new one
        in the cookie. The answer has no body: call `GET /me` for the new CSRF token.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChange" }
      responses:
        "204":
          description: Changed. Sessions were replaced.
        default: { $ref: "#/components/responses/Error" }

  /api/v1/folders/{fld}/children:
    parameters:
      - $ref: "#/components/parameters/fld"
    get:
      tags: [Files]
      operationId: listChildrenByPath
      summary: List a directory of a folder by its path
      description: |
        `path` is relative to the folder's root: `/a/b`, or empty or `/` for the root. Names are
        checked as in `Node`; an empty segment, `.` or `..` is `invalid_path`. A missing
        directory is `not_found`; a file on the way is `invalid_path`. Children come in name order.
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - name: path
          in: query
          schema: { type: string, maxLength: 4096 }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: The children of the directory.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeList" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/folders/{fld}/directories:
    parameters:
      - $ref: "#/components/parameters/fld"
    post:
      tags: [Files]
      operationId: createDirectory
      summary: Make a directory, optionally with the directories above it
      description: |
        With `parents: true`, missing directories on the path are made, and a directory that
        already exists is answered `200` (like `mkdir -p`). Otherwise a missing parent is
        `not_found` and an existing name is `conflict`. A file where a directory is needed is
        `invalid_path`.
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DirectoryCreate" }
      responses:
        "201":
          description: Created.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        "200":
          description: The directory already existed (only with parents).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/folders/{fld}/files:
    parameters:
      - $ref: "#/components/parameters/fld"
    post:
      tags: [Files]
      operationId: createFile
      summary: Write a new small file in one request
      description: |
        The body is the file's contents, sent as is. `Content-Type` becomes the file's media
        type; without it, the type comes from the name's extension. `path` names the new file
        (`/a/b.txt`); `parents=true` makes missing directories. A body over
        `upload.max_small_file_size` is `too_large` with `details.limit_bytes`; larger files
        use resumable uploads. A name that exists is `conflict`, or with `If-None-Match: *`,
        `precondition_failed`.
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string, maxLength: 4096 }
        - name: parents
          in: query
          schema: { type: boolean, default: false }
        - name: If-None-Match
          in: header
          description: "Only *: the file must not exist yet."
          schema: { type: string, enum: ["*"] }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Created.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/uploads:
    parameters:
      - $ref: "#/components/parameters/tusResumable"
    options:
      tags: [Uploads]
      operationId: uploadOptions
      summary: What the upload protocol supports and the limits
      description: |
        No credential is needed. `Tus-Max-Size` is the largest file, and
        `Selfcloud-Max-Chunk-Size` the largest piece. Clients behind a proxy with a request cap
        should choose a piece size at or under that cap.
      responses:
        "204":
          description: Advertised.
          headers:
            Tus-Version: { $ref: "#/components/headers/Tus-Version" }
            Tus-Extension: { $ref: "#/components/headers/Tus-Extension" }
            Tus-Max-Size: { $ref: "#/components/headers/Tus-Max-Size" }
            Tus-Checksum-Algorithm: { $ref: "#/components/headers/Tus-Checksum-Algorithm" }
            Selfcloud-Max-Chunk-Size: { $ref: "#/components/headers/Selfcloud-Max-Chunk-Size" }
    post:
      tags: [Uploads]
      operationId: createUpload
      summary: Start a resumable upload (tus creation)
      description: |
        `Upload-Length` is required and the length must be declared. `Upload-Metadata` names the
        target: `folder` (required, a folder ID), then either `parent` (a directory's ID) or `path`
        (a directory path under the folder's root, e.g. `/a/b`), `name` (the file name; `filename`
        is accepted as well), and optionally `on_conflict` (`fail`, the default; `rename`;
        `replace`), `parents` (`true` makes missing directories), `mime_type`, and `sha256`: the
        64 hex digits (lowercase or not) of the whole file, which is checked when the last piece
        arrives. A mismatch is `checksum_mismatch` (460) and the upload is dropped. Other keys are
        ignored. Under `fail`, a name already taken is `conflict` now.

        Limits: a caller may hold `upload.max_open_per_principal` unfinished uploads (default 100),
        and an account `upload.max_open_per_account` (default 1000); above either, creation is
        `too_many_uploads` (429) with `details.scope` (`caller`, `account` or `link`). Creation is also
        rate limited per caller, at 60 a minute, and answers `rate_limited` (429).

        Drop links: a drop link's visitor (its `scl_` credential, `upload_only`) may create uploads
        too. The visitor's `folder`, `parent`, `path`, `parents`, `on_conflict` and `mime_type` are
        ignored, not refused: the file lands in the link's directory, and a name clash is renamed.
        `name` is the file name. `uploader_name` and `uploader_email` are optional unless the link asks
        for them. A drop upload reserves nothing up front except that `upload.max_file_size` caps the
        declared length; it holds only the bytes it has received, and each piece is checked against the
        quota and the disk for the bytes it brings (owner's decision, 2026-10-29). When the account cannot
        take a drop visitor's bytes, the answer is one generic `quota_exceeded` (507) with the message
        "this link cannot take the file now" and no `details`: no numbers and no scope, whatever the
        refusal was. A drop link that is paused (its switch off, a members-only space, or a trashed node)
        answers `not_found`, and keeps the visitor's upload until its normal expiry, so the visitor can
        resume when the link is back. A link that is deleted, expired or reset ends the upload.

        Quota: creation reserves the declared length against the account. The account's used
        bytes, its reserved bytes and this length must fit in `quota_bytes`, or the answer is
        `quota_exceeded` (507) with `details.scope` `quota`. An account with no quota may hold at
        most `upload.max_reserved_per_account` in reservations (`details.scope`
        `account_reservations`). The reservation is held until the upload completes, is
        terminated, or expires; completion never refuses for quota. Writes to the file tree are
        checked against the same quota: a write that grows usage past it is refused, and one
        that shrinks it always passes.

        Disk: the unwritten bytes of every open upload must fit in the free space of the server
        less `storage.min_free`, or the answer is `storage_full` (507) with `details.scope`
        `server`. When creating, one account's unwritten bytes may not exceed
        `upload.max_disk_share_percent` of that space, or the answer is `storage_full` with
        `details.scope` `account`. Both refusals carry `required_bytes` and `available_bytes`.

        Lifetime: an upload expires `upload.max_lifetime` after its creation (default 7 days),
        however often it is written to, and `upload.expiry` (default 24 h) after its last write.
        A request for an upload past either time is `upload_expired`.

        A creation whose first piece fails is removed, since the reply carries no `Location`. A
        completion that meets a name taken under `fail` answers `conflict` with
        `details.state: awaiting_commit`; the reply carries `Location` and `Selfcloud-Upload-State`,
        and the upload waits for `POST .../commit`.

        The request may carry the first piece (creation-with-upload), with
        `Content-Type: application/offset+octet-stream`. The reply's `Location` is the upload's
        URL. A file that the last piece completes is created before the reply; its ID comes back in
        `Selfcloud-Node-ID`.
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - $ref: "#/components/parameters/tusResumable"
        - $ref: "#/components/parameters/uploadLength"
        - $ref: "#/components/parameters/uploadMetadata"
        - $ref: "#/components/parameters/uploadChecksum"
      requestBody:
        required: false
        content:
          application/offset+octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Created. `Upload-Offset` says how much arrived with the request.
          headers:
            Location: { schema: { type: string, format: uri } }
            Tus-Resumable: { $ref: "#/components/headers/Tus-Resumable" }
            Upload-Offset: { $ref: "#/components/headers/Upload-Offset" }
            Upload-Expires: { $ref: "#/components/headers/Upload-Expires" }
            Selfcloud-Node-ID: { $ref: "#/components/headers/Selfcloud-Node-ID" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/uploads/{upl}/commit:
    parameters:
      - $ref: "#/components/parameters/upl"
    post:
      tags: [Uploads]
      operationId: commitUpload
      summary: Commit an upload that waits for a name
      description: |
        Only the upload's creator may commit, and only while the upload is `awaiting_commit`: all
        its bytes are in, and a completion found the name taken under `fail`. The body gives the
        new target; each field left out keeps the upload's own. The file is checked for access and
        for a free name, then created. Answers `conflict` with `details.state: awaiting_commit`
        again if the name is still taken, and `conflict` with `details.state: uploading` if the
        upload is not yet complete.
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadCommit" }
      responses:
        "201":
          description: The file, created under the new target.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/uploads/{upl}:
    parameters:
      - $ref: "#/components/parameters/upl"
      - $ref: "#/components/parameters/tusResumable"
    head:
      tags: [Uploads]
      operationId: headUpload
      summary: How far an upload got, for resuming
      description: Only the creator may ask. A deleted or completed upload is `not_found`.
      security: [{ bearer: [] }, { session: [] }]
      responses:
        "200":
          description: The durable offset and the length.
          headers:
            Tus-Resumable: { $ref: "#/components/headers/Tus-Resumable" }
            Upload-Offset: { $ref: "#/components/headers/Upload-Offset" }
            Upload-Length: { $ref: "#/components/headers/Upload-Length" }
            Upload-Expires: { $ref: "#/components/headers/Upload-Expires" }
            Selfcloud-Upload-State: { $ref: "#/components/headers/Selfcloud-Upload-State" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [Uploads]
      operationId: patchUpload
      summary: Send a piece at the durable offset (tus PATCH)
      description: |
        `Upload-Offset` must equal the server's offset, or the answer is `upload_offset_mismatch`
        with `details.offset`. The body goes at that offset and is synced before the offset moves.
        A piece over `Selfcloud-Max-Chunk-Size` is `chunk_too_large`; one that would pass the
        declared length is `too_large`. For a drop link's visitor, a piece that the account's quota or
        the disk cannot take is the generic `quota_exceeded` of creation, and the bytes already received
        are kept, so the visitor can resume. A visitor's completing piece does not carry
        `Selfcloud-Node-ID`. With `Upload-Checksum`, a piece that does not match is
        `checksum_mismatch` (460) and nothing is kept. When the body stops early the bytes that
        arrived are kept and the request fails, so HEAD gives the resume point.

        Each piece checks access again: a revoked grant or a disabled user stops the upload. Only
        one piece runs at a time. A new request from the same creator stops the one holding the
        slot (a half-open connection, say) and waits up to 5 seconds for it to finish; if it does
        not, the new request is `locked` (409). A piece with no bytes, sent at the full length,
        retries completing the file.

        A piece whose body is cut short with `Upload-Checksum` set cannot be verified, so it is
        dropped and the offset stays. A piece completing an upload whose name is taken under `fail`
        answers `conflict` with `details.state: awaiting_commit`, as in creation.
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - $ref: "#/components/parameters/tusResumable"
        - name: Upload-Offset
          in: header
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
        - $ref: "#/components/parameters/uploadChecksum"
      requestBody:
        required: true
        content:
          application/offset+octet-stream:
            schema: { type: string, format: binary }
      responses:
        "204":
          description: The piece is kept. `Upload-Offset` is the new offset.
          headers:
            Tus-Resumable: { $ref: "#/components/headers/Tus-Resumable" }
            Upload-Offset: { $ref: "#/components/headers/Upload-Offset" }
            Upload-Expires: { $ref: "#/components/headers/Upload-Expires" }
            Selfcloud-Node-ID: { $ref: "#/components/headers/Selfcloud-Node-ID" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [Uploads]
      operationId: deleteUpload
      summary: Terminate an upload (tus termination)
      description: Removes the upload and its bytes at once. Needs write on the folder.
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - $ref: "#/components/parameters/tusResumable"
      responses:
        "204":
          description: Terminated.
          headers:
            Tus-Resumable: { $ref: "#/components/headers/Tus-Resumable" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/nodes/{nod}:
    parameters:
      - $ref: "#/components/parameters/nod"
    get:
      tags: [Files]
      operationId: statNode
      summary: Stat a file or directory
      description: |
        A visitor of a link that anyone can open may call this with its credential, for a node the
        link reaches, and gets the link's role. A visitor sees no `created_by` or `owner_id`, and no
        `parent_id` at the link's own node. A visitor's stat of a shortcut is `not_found`, the same
        answer as a stat of an item outside the link.
        For a file: its size, media type, `etag` (a strong ETag that changes with every write)
        and `sha256` of the contents. A folder's root is a directory with no `parent_id`.
      security: [{ bearer: [] }, { session: [] }]
      responses:
        "200":
          description: The node.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [Files]
      operationId: renameNode
      summary: Rename a file or directory, or change its sharing flags
      description: |
        `name` needs the editor role. `no_download` needs the editor role: it refuses viewers and
        commenters the downloads of the node and its subtree, though inline viewing still works.
        `editors_can_share` needs the manager role: it lets editors set permissions below the node,
        up to editor. A folder's root has no name. `color` (a directory only, from the palette) and
        `description` need the editor role. At least one field is required. A change of colour or
        description is audited as `node.appearance`. The audit says only that a description changed or
        was cleared, never its text.
        `If-Match` is optional. With the node's current `etag`, the change applies only if the node
        is still that version; otherwise the answer is `precondition_failed` (412) and nothing
        changes. The check runs inside the write.
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - $ref: "#/components/parameters/ifMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NodeUpdate" }
      responses:
        "200":
          description: The renamed node.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [Files]
      operationId: deleteNode
      summary: Move a file or a directory to the trash, or delete it for good
      description: |
        By default the node goes to the trash (editor): it keeps its contents, permissions and usage,
        and `POST /nodes/{nod}/restore` brings it back. The trash purges it after `trash.retention`.
        With `permanent=true` the node and everything below it are deleted at once, which needs the
        manager role. The contents of the files are removed from disk later, once nothing refers to
        them and the blob grace period (`blobs.delete_grace`) has passed; only a permanent delete takes
        usage down. A folder's root cannot be deleted; delete the folder instead.
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - name: permanent
          in: query
          required: false
          description: "`true` deletes for good, at once, and needs manager. Absent or `false` moves the node to the trash."
          schema: { type: boolean, default: false }
      responses:
        "204":
          description: Moved to the trash, or deleted.
        default: { $ref: "#/components/responses/Error" }

  /api/v1/nodes/{nod}/children:
    parameters:
      - $ref: "#/components/parameters/nod"
    get:
      tags: [Files]
      operationId: listChildren
      summary: List a directory by its ID
      description: A visitor of a link that anyone can open may call this with its credential, below the link's node.
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: The children of the directory, in name order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeList" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/nodes/{nod}/move:
    parameters:
      - $ref: "#/components/parameters/nod"
    post:
      tags: [Files]
      operationId: moveNode
      summary: Move a file or directory
      description: |
        The target is `folder` (default: the node's own folder) and a directory in it, given by
        `parent` (a directory ID) or `path` (relative to the target folder's root); by default the
        node's own directory, or the target folder's root when the folder changes. `name`
        renames it on the way. A clash with a sibling is `conflict` unless `on_conflict` is
        `rename`, which picks `name (1).ext`, or `replace`, which deletes the sibling file (only
        file over file; a folder on either side is `conflict`). The replaced file's contents are
        collected later, as for any delete. A folder cannot go into itself or below itself
        (`invalid_request`). Moving needs `write` on the node's folder and on the target folder.
        `If-Match` is optional, as on a rename: a mismatch is `precondition_failed` and nothing moves.
        A move that changes nothing returns the node without changing its `etag`. A caller who does not
        manage the item may not take a subtree that holds a restricted label value out of its folder, or
        into a place where the caller would manage it: `forbidden` with `reason` `restricted_label`.
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - $ref: "#/components/parameters/ifMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Transfer" }
      responses:
        "200":
          description: The node, where it now is.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/nodes/{nod}/copy:
    parameters:
      - $ref: "#/components/parameters/nod"
    post:
      tags: [Files]
      operationId: copyNode
      summary: Copy a file or directory
      description: |
        Takes the same target as a move. A copy of a file shares its contents with the original,
        so nothing is copied on disk, but the account is charged for the copy in full. The caller
        needs `read` on the source and `write` on the target folder. A folder of up to 10,000
        nodes is copied in this request. A larger one answers `202` with a job (`node.copy`); the
        job's `target` is the new root node, and the job checks access again when it runs. The job
        builds the copy in batches, in a staging folder that no listing, lookup or count shows, and
        publishes it in one write: until then the new root is `not_found`, and a failed job leaves
        nothing behind. A tree above `copy.max_nodes` (default 50,000; the operator may raise it, and
        a higher limit holds the writer longer in the publish) is `too_large`, with `details.max_nodes`
        and `details.nodes`.
        Copy `on_conflict` works as for a move; a value other than `fail`, `rename` or `replace` is
        `invalid_request` for either size of copy. The reservation is the bytes of the files the copy
        will make: trashed nodes and versions are not counted.
        An account has at most two chunked copies queued or running; a third is `conflict` with
        `details.reason: too_many_copies`, and nothing is staged. A job yields its turn after about
        30 seconds and goes to the back of the queue, so other jobs run; it resumes from its stored state.
        A copy never succeeds with a source tree whose structure changed after its snapshot. A node of
        the snapshot that was trashed, deleted or moved fails the job with `source_changed` (in
        `error`), and nothing becomes visible. A rename or new content is copied as it is read. A file
        created after the snapshot is not copied.
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Transfer" }
      responses:
        "201":
          description: The copy.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        "202":
          description: Queued as a job; poll GET /api/v1/jobs/{job}. The new root is the job's target.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/nodes/{nod}/shortcuts:
    parameters:
      - $ref: "#/components/parameters/nod"
    post:
      tags: [Files]
      operationId: createShortcut
      summary: Make a shortcut to a file or directory
      description: |
        Makes a node of kind `shortcut` in the directory `{nod}`, which needs the contributor role. The
        target must be a file or a directory in the same account that the caller reaches, and not a
        shortcut or a folder's root. A missing, foreign or unreachable target is one `not_found`, and
        nothing about it is shown. The name defaults to the target's name. A shortcut grants nothing:
        it takes no quota and has no content or children, and it shows as unavailable to a caller who
        cannot reach its target. Audited as `node.shortcut`, with the target's ID left out.
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [target]
              properties:
                target: { type: string, description: The ID of the file or directory the shortcut points to. }
                name: { type: string, maxLength: 255, description: "The shortcut's name, at most 255 bytes. Empty or absent takes the target's name." }
      responses:
        "201":
          description: The shortcut.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/nodes/{nod}/office:
    parameters:
      - $ref: "#/components/parameters/nod"
    post:
      tags: [Office]
      operationId: openOffice
      summary: Open a file in the office editor
      description: |
        Makes the editor's URL for a file and an access token for it. The client posts the token into
        the editor's form (the token is not put in an address), and the editor calls the `/wopi` routes
        with it. The token is bound to this file, this person and one editing session, and it ends at
        the session's end or at `office.token_minutes`, whichever is first. It never outlives the
        delegated token that made the request. A session revoked with the person's tokens, or an
        account's tokens, stops at once.

        Only a person opens the editor: a session, or a delegated token that acts as a user. `edit`
        needs the editor role and a file that is not no-download; a no-download file opens to `view`
        only. `view` needs the viewer role. A file over `office.max_file_bytes` is `too_large`; a type
        Collabora does not open is `invalid_request`. While office editing is off, the route answers
        `not_found`. With no discovery document, it answers `unavailable` and `Retry-After`.
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              additionalProperties: false
              properties:
                mode: { type: string, enum: [edit, view] }
      responses:
        "200":
          description: The editor's URL and the token. Both are shown once, and `Cache-Control` is `no-store`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, description: "Collabora's editor URL, with WOPISrc set to this file's /wopi address." }
                  token: { type: string, example: "sct_..." }
                  expires_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/nodes/{nod}/unlock:
    parameters:
      - $ref: "#/components/parameters/nod"
    post:
      tags: [Office]
      operationId: breakNodeLock
      summary: Break an editor's lock on a file
      description: |
        Ends the live office lock on a file, whoever holds it (decision 32). The editor's next refresh or
        save then answers with no lock on the file, and nothing it sends overwrites a write made after the
        break. The break is audited as `node.unlock` with `reason: broken`, the lock's holder and the caller.
        A manager of the file, an owner of the account and the account key may break a lock. A delegated
        token and a share-link visitor may not, whatever their role, and the WOPI routes do not take this
        route, so an editor's own token cannot end its lock here. The confirmation before a break belongs to
        the web interface (slice l4), not to this route.
      security: [{ bearer: [] }, { session: [] }]
      responses:
        "204": { description: The lock is ended. }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /wopi/files/{nod}:
    parameters:
      - $ref: "#/components/parameters/nod"
    get:
      tags: [Office]
      operationId: wopiCheckFileInfo
      summary: WOPI CheckFileInfo
      description: |
        Collabora's WOPI host call. The access token is the `access_token` query parameter, and the
        request must carry the proof-key headers Collabora signs it with; a request whose proof or
        timestamp does not verify answers `500`, as the WOPI specification says. `SupportsLocks` and
        `SupportsGetLock` are true: the lock operations are on `POST` below (decision 32).
      security: []
      parameters:
        - name: access_token
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The file's properties for the editor.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { description: The token is not valid, or its session has ended. }
        "404": { description: The file is not the token's, or no longer reachable by its person. }
        "500": { description: The proof does not verify, or the discovery document is not available. }
    post:
      tags: [Office]
      operationId: wopiOverride
      summary: WOPI lock operations by X-WOPI-Override
      description: |
        `LOCK`, `GET_LOCK`, `REFRESH_LOCK` and `UNLOCK` (decision 32). A lock lasts 30 minutes from its
        last refresh. `LOCK` on an unlocked file takes it, and `LOCK` with the ID already held refreshes
        it; a lock is held by its ID, not by a person. `LOCK`, `REFRESH_LOCK` and `UNLOCK` need the
        `X-WOPI-Lock` header and answer `400` without it. A mismatch answers `409` with `X-WOPI-Lock` set
        to the lock on the file, or to the empty string when the file is not locked. `LOCK` also answers
        `409` when the editor was given an earlier content of the file, so an API write made before the
        lock is not overwritten. `LOCK` with `X-WOPI-OldLock` (UnlockAndRelock) replaces the live lock with
        that ID by the new one, and otherwise answers `409` with the current lock. An account that already
        holds 1,000 live locks answers `LOCK` with `409`, an empty `X-WOPI-Lock` and a `X-WOPI-LockFailureReason`.
        `GET_LOCK` answers the lock in `X-WOPI-Lock`. `RenameFile` (slice l4) and
        the other overrides answer `501`.
      security: []
      parameters:
        - name: access_token
          in: query
          required: true
          schema: { type: string }
        - { name: X-WOPI-Override, in: header, schema: { type: string, enum: [LOCK, GET_LOCK, REFRESH_LOCK, UNLOCK] } }
        - { name: X-WOPI-Lock, in: header, schema: { type: string, maxLength: 1024 } }
        - { name: X-WOPI-OldLock, in: header, description: "With `LOCK`: the lock this request replaces (UnlockAndRelock).", schema: { type: string, maxLength: 1024 } }
      responses:
        "200":
          description: The operation is done. `GET_LOCK` gives the lock in `X-WOPI-Lock`, empty when unlocked.
          headers:
            X-WOPI-Lock: { schema: { type: string } }
        "400": { description: The lock ID is missing, longer than 1024 characters, or not printable ASCII. }
        "401": { description: The token is not valid, or its session has ended. }
        "404": { description: The file is not the token's, or the token is read-only. }
        "409":
          description: A lock mismatch, or no lock to refresh or end. `X-WOPI-Lock` is the lock on the file, or empty.
          headers:
            X-WOPI-Lock: { schema: { type: string } }
            X-WOPI-LockFailureReason: { schema: { type: string } }
        "500": { description: The proof does not verify, or the discovery document is not available. }
        "501": { description: "Not implemented: RenameFile (slice l4) and the other overrides." }
  /wopi/files/{nod}/contents:
    parameters:
      - $ref: "#/components/parameters/nod"
    get:
      tags: [Office]
      operationId: wopiGetFile
      summary: WOPI GetFile
      description: |
        The file's content, streamed. `X-WOPI-ItemVersion` is the file's ETag without its quotes.
      security: []
      parameters:
        - name: access_token
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The whole file, as application/octet-stream.
          headers:
            X-WOPI-ItemVersion: { schema: { type: string } }
        "401": { description: The token is not valid, or its session has ended. }
        "404": { description: The file is not the token's, or no longer reachable by its person. }
        "500": { description: The proof does not verify, or the discovery document is not available. }
    post:
      tags: [Office]
      operationId: wopiPutFile
      summary: WOPI PutFile
      description: |
        Replaces the file's content with the body, which is the whole file, through the same path as
        a PUT: the same quota, the old content kept as a version, and a `file.updated` event. The
        request needs `X-WOPI-Override: PUT`. A read-only token, or a no-download file, answers `404`,
        which the specification gives for an unauthorized user. A body over `office.max_file_bytes`
        answers `413`, and so does a quota refusal, since the specification has no code for quota.
        The save needs the file's lock: `X-WOPI-Lock` is the lock the editor took. A save with no lock,
        or with another lock, answers `409` with `X-WOPI-Lock` set to the lock on the file, or to the
        empty string when no editor holds it. An empty unlocked file takes a save without a lock only when
        the editor's session holds the file's current content, so an API write that emptied it after the
        editor opened it is not overwritten (decision 32). A save with no lock into a file that is not empty
        answers `409`, as does a save after a manager has broken the lock.
        The first save of a lock keeps a version; the later saves of that lock replace the content
        without one.
      security: []
      parameters:
        - name: access_token
          in: query
          required: true
          schema: { type: string }
        - { name: X-WOPI-Override, in: header, required: true, schema: { type: string, enum: [PUT] } }
        - { name: X-WOPI-Lock, in: header, schema: { type: string, maxLength: 1024 } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Saved. `X-WOPI-ItemVersion` is the new ETag without its quotes.
          headers:
            X-WOPI-ItemVersion: { schema: { type: string } }
        "401": { description: The token is not valid, or its session has ended. }
        "404": { description: The file is not the token's, the token is read-only, or the file is no-download. }
        "409": { description: "The file's lock refuses the save: no lock, or another lock. `X-WOPI-Lock` is the lock on the file, or empty." }
        "413": { description: The body is over the limit, or the quota would be passed. }
        "500": { description: The proof does not verify, or the discovery document is not available. }
  /api/v1/nodes/{nod}/thumbnail:
    parameters:
      - $ref: "#/components/parameters/nod"
    get:
      tags: [Files]
      operationId: getThumbnail
      summary: A thumbnail of an image file
      description: |
        A JPEG thumbnail of a JPEG, PNG or GIF file, at `size` pixels on its longer edge. The first
        request for a size queues the work and answers `202` with `Retry-After`; later requests answer
        `202` until the thumbnail is ready, then `200`. A thumbnail is made once per file version and
        size, and shared by every node that holds the same contents. A file whose thumbnail cannot be
        made because of the file (corrupt, over a size or pixel limit, or not an image) answers `404` on
        every later request. A failure of the server or the host (a time limit, a stopped decoder, a full
        disk) answers `404` until a retry time, then the work is queued again, up to three attempts; after
        that it answers `404`. A failure is kept for the limits it was made under, and is cleared 30 days
        after it happened.

        Reading a thumbnail is viewing, not downloading, so the no-download rule does not refuse it. A
        link visitor gets `link_route`: the route is not open to links. A thumbnail is not a view, so it
        does not appear in Recent.

        When `content_url` is set, a ready thumbnail answers `303` with a signed link on the content
        origin, where the image is fetched.

        Thumbnails are made in a child process with a memory limit, a CPU limit and a time limit. They
        do not count toward any quota: the server's `derived.max_bytes` budget limits them.
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - name: size
          in: query
          description: The longer edge in pixels; one of the server's configured sizes. The smallest by default.
          schema: { type: integer, example: 256 }
      responses:
        "200":
          description: The thumbnail.
          headers:
            ETag: { schema: { type: string, description: "The SHA-256 of the thumbnail, quoted." } }
            Content-Security-Policy: { schema: { type: string } }
            Cross-Origin-Resource-Policy: { schema: { type: string } }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "202":
          description: The thumbnail is being made. Ask again after `Retry-After` seconds.
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: { type: string, enum: [pending] }
        "303":
          description: On a server with `content_url` set, the thumbnail is at the signed link in `Location`.
          headers:
            Location: { schema: { type: string } }
        "304":
          description: "Not modified: the `If-None-Match` ETag is current."
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "429":
          description: The queue, the account's share of it, or the caller's budget of new thumbnails is full. `Retry-After` gives the wait.
          headers:
            Retry-After: { schema: { type: integer } }
        "503": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    head:
      tags: [Files]
      operationId: headThumbnail
      summary: The status and headers of a thumbnail, without the body
      description: |
        The status and headers `GET` would send, with no body, and the same access rules. A HEAD starts no
        work: it never queues a thumbnail. A thumbnail not yet made answers `404`; the `GET` that follows
        starts it. A `202` from a HEAD means a `GET` has already queued it.
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - name: size
          in: query
          schema: { type: integer }
      responses:
        "200": { description: The thumbnail is ready. }
        "202": { description: The thumbnail is being made. }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/nodes/{nod}/content:
    parameters:
      - $ref: "#/components/parameters/nod"
    get:
      tags: [Files]
      operationId: getContent
      summary: Download a file
      description: |
        A visitor of a link that anyone can open may call this with its credential. The no-download
        rules apply to a visitor as to a viewer.
        The file's contents. `Range` may name up to 16 byte ranges: one is `206` with a
        `Content-Range`, several are a `multipart/byteranges` body. A range that is malformed, lies
        outside the file, or is one of more than 16 is `range_not_satisfiable`, with
        `Content-Range: bytes */<size>`. `If-Range` decides whether a range applies: when it does not
        match the current ETag or Last-Modified, the whole file is sent. `If-None-Match` and
        `If-Modified-Since` give `304`; `If-Match` and `If-Unmodified-Since` give
        `precondition_failed` when they fail.

        `disposition=inline` is honoured only where policy allows: on the content origin for any
        type, and on the main origin, when `content_url` is not set, for images other than SVG, PDF,
        audio, video and plain text (text is sent as UTF-8). Otherwise the response is an attachment.
        Every response carries `X-Content-Type-Options: nosniff` and the sandboxing
        `Content-Security-Policy: sandbox; default-src 'none'`.
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - { name: Range, in: header, schema: { type: string, example: "bytes=0-1023" } }
        - name: If-Range
          in: header
          description: A strong ETag or an HTTP date. The range applies only when it matches.
          schema: { type: string }
        - { name: If-Match, in: header, schema: { type: string } }
        - { name: If-None-Match, in: header, schema: { type: string } }
        - { name: If-Modified-Since, in: header, schema: { type: string } }
        - { name: If-Unmodified-Since, in: header, schema: { type: string } }
        - name: disposition
          in: query
          schema: { type: string, enum: [attachment, inline], default: attachment }
      responses:
        "200":
          description: The whole file.
          headers:
            ETag: { schema: { type: string } }
            Last-Modified: { schema: { type: string } }
            Accept-Ranges: { schema: { type: string, enum: [bytes] } }
            Content-Disposition: { schema: { type: string } }
            Cross-Origin-Resource-Policy: { schema: { type: string } }
          content:
            "*/*":
              schema: { type: string, format: binary }
        "206":
          description: The requested range, or a `multipart/byteranges` body for several.
          headers:
            Content-Range: { schema: { type: string } }
            ETag: { schema: { type: string } }
          content:
            "*/*":
              schema: { type: string, format: binary }
        "304":
          description: "Not modified: the If-None-Match ETag is current, or the file is older than If-Modified-Since."
        "416":
          description: "The Range header is malformed, names more than 16 ranges, or lies outside the file. `details.size_bytes` gives the size."
          headers:
            Content-Range: { schema: { type: string, example: "bytes */1048576" } }
        default: { $ref: "#/components/responses/Error" }
    head:
      tags: [Files]
      operationId: headContent
      summary: The headers of a download, without the body
      description: The status and headers `GET` would send, with no body. Takes the same headers.
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - { name: Range, in: header, schema: { type: string } }
        - { name: If-Range, in: header, schema: { type: string } }
        - { name: If-None-Match, in: header, schema: { type: string } }
        - { name: If-Modified-Since, in: header, schema: { type: string } }
        - name: disposition
          in: query
          schema: { type: string, enum: [attachment, inline], default: attachment }
      responses:
        "200":
          description: The file's headers.
          headers:
            ETag: { schema: { type: string } }
            Content-Length: { schema: { type: integer } }
        "206":
          description: The range's headers.
        "304":
          description: Not modified.
        "416":
          description: The range is not satisfiable; see GET.
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [Files]
      operationId: replaceContent
      summary: Replace a file's contents in one request
      description: |
        `If-Match` is required and must be the ETag the editor read; a stale one is
        `precondition_failed`, and a missing one is `precondition_required` (428). The new contents are a new
        blob. The size limit is `upload.max_small_file_size`, as for a create.
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - name: If-Match
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: The file, with its new ETag.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/nodes/{nod}/links:
    parameters:
      - $ref: "#/components/parameters/nod"
    post:
      tags: [Files]
      operationId: createLink
      summary: Make a signed download link
      description: |
        A visitor of a link that anyone can open may call this with its credential. Its signed link
        lives no longer than the visitor's credential, and is not audited.
        A link to one file that needs no credential: `GET` on it serves the file. The link names the
        file's current contents, so it stops working when the file changes, and it expires. The
        caller needs read access to the file to ask for a link; the link itself is the grant for
        whoever holds it, so treat it as a secret. It is written to the audit log (`node.link`).
        The URL is on `content_url` when that is set, else on `public_url`. Creation is limited to
        120 a minute per caller (`rate_limited`, with `Retry-After`). A link made with a delegated
        token may not outlive the token: the default and the largest `ttl` are cut to what the token
        has left, and an expired token gets `token_expired`.
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ttl:
                  type: integer
                  minimum: 1
                  description: "Lifetime in seconds. Default `links.default_ttl`, 5 minutes. A value above `links.max_ttl` (24 hours by default) is `invalid_request`; `details.max_ttl_seconds` gives the cap."
                disposition:
                  type: string
                  enum: [attachment, inline]
                  default: attachment
      responses:
        "201":
          description: The link.
          headers:
            Cache-Control: { schema: { type: string, example: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignedLink" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/nodes/{nod}/share-links:
    parameters:
      - $ref: "#/components/parameters/nod"
    get:
      tags: [Sharing]
      operationId: listShareLinks
      summary: List the share links that reach a node
      description: |
        The links on the node and on its ancestors, the node's own first; `inherited_from` says
        where a link sits. A manager of the node and an account key see every live link, with
        `created_by`, `visitors` and `paused`. Anyone else with a role on the node sees the live
        links on the nodes it reaches, without those three fields. A delegated token gets `forbidden`.
        No link's secret or URL is ever listed.
      security: [{ bearer: [] }, { session: [] }]
      responses:
        "200":
          description: The links that reach the node.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareLinkList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [Sharing]
      operationId: createShareLink
      summary: Make a link to a node
      description: |
        Makes the node's organisation link: members of the account who open it get the role
        `role` on the node and everything below. The caller must share the node (a manager, or an
        editor where `editors_can_share` allows it) and may not give a role above its own. A node
        has one organisation link. The team space must allow links (`allow_links`); with
        `members_only` a link is allowed on the space's root only. A personal folder (My files)
        always allows an organisation link. `expires_at` is optional and capped at `sharing.max_expiry`
        when that is set. The secret is shown in `url`, here and on reset, and nowhere else.

        A link that anyone can open (`audience: anyone`) needs the node's manager, not an editor, even
        where `editors_can_share` allows editors to share. It gives the viewer role only, needs an end
        date (30 days by default, 365 days at most), may carry a password, and needs the account's
        `public_links` switch on, and `allow_links` on a team space. Its URL works for anyone who holds
        it, without a session.

        A drop link (`upload_only: true`, audience `anyone`, no role) lets a visitor upload files into
        the node, a directory, and nothing else. It needs the same rights and switches as an anyone
        link, and must end: `expires_at` may be left out (30 days by default), `null` is refused, and
        the longest is 365 days (or `sharing.max_expiry` when that is lower). It may carry a password,
        a title (up to 100 characters), a message (up to 1000) and two switches: `ask_name` makes the
        visitor give a name and email, and `notify` mails the creator, at most once an hour, how many
        files arrived. One drop link is allowed per node, beside its access link; a second is
        `conflict` with `reason: exists`. A drop link is never an organisation link, and a path that
        is not a directory is `invalid_request`. A delegated token gets `forbidden`.
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShareLinkCreate" }
      responses:
        "201":
          description: The link and its URL.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareLinkCreated" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/share-links/{shl}:
    parameters:
      - $ref: "#/components/parameters/shl"
    patch:
      tags: [Sharing]
      operationId: updateShareLink
      summary: Change a link's role or expiry
      description: |
        The caller must share the link's node and hold at least the link's role. A link above the
        caller's own role is `forbidden`, and so is a role above the caller's own. An absent
        `expires_at` keeps the expiry, and `null` clears it. A link whose team space pauses it
        (`allow_links` off, or members_only below the root) is `forbidden` with `reason: links_off`
        until the policy allows it again. A link that anyone can open needs the node's manager and the
        account's `public_links` switch; `forbidden` with `reason: manager_required` or
        `public_links_off` otherwise.
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShareLinkUpdate" }
      responses:
        "200":
          description: The link as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareLink" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [Sharing]
      operationId: deleteShareLink
      summary: Delete a link
      description: |
        The link's creator may always delete it, while it still reaches the node. Anyone else must
        share the node and may not remove a link above its own role. The owner's session and the
        account key may delete any link of the account, including one in a member's My files and one
        on a trashed item. An installation admin may not: it uses the bulk delete. The members who
        opened the link lose its access at once, since their visits go with it.
      security: [{ bearer: [] }, { session: [] }]
      responses:
        "204": { description: Deleted. }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/share-links/{shl}/reset:
    parameters:
      - $ref: "#/components/parameters/shl"
    post:
      tags: [Sharing]
      operationId: resetShareLink
      summary: Give a link a new secret
      description: |
        The old URL stops working. A visit made before the reset no longer counts, so members open
        the new URL to get in again. The new URL is returned here, once. Same rights as a change.
      security: [{ bearer: [] }, { session: [] }]
      responses:
        "201":
          description: The link and its new URL.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareLinkCreated" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/share/open:
    post:
      tags: [Sharing]
      operationId: openShareLink
      summary: Open a link
      description: |
        The page at `{public_url}/s` sends the secret taken from the URL fragment.

        **An organisation link** opens for a signed-in user of the link's account, which gets
        `{node_id}`; the visit is recorded, so the node and its contents are shared with it from then
        on. Every other caller gets `not_found`: no session, a session of another account, an
        installation admin, a credential in the `Authorization` header, a missing link, and a link
        that is expired, deleted, paused, reset since the visit, or trashed. The session check uses
        the cookie's `Origin` and `X-CSRF-Token` rules.

        **An anyone link** opens without a session, for whoever holds the secret. If the link has a
        password, a request without it gets `unauthenticated` with `reason: password_required`, and a
        wrong one `reason: password_wrong`. Ten wrong passwords from one address in fifteen minutes
        lock that address out of that link for fifteen minutes (`rate_limited`); thirty wrong ones in
        an hour slow every attempt on the link by two seconds, and refuse none. The answer is
        `{token, expires_at, link, node}`: the visitor's credential (`scl_`), which lives fifteen
        minutes, the link, and the node it opens. Renew the credential with `POST /share/renew`.
        Every dead link gets `not_found`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret]
              additionalProperties: false
              properties:
                secret: { type: string, description: The secret from the URL fragment. }
                password: { type: string, maxLength: 256, description: "The link's password, for an anyone link that has one." }
      responses:
        "200":
          description: "An organisation link: `node_id`. An anyone link: `token`, `expires_at`, `link` and `node`. A drop link: `token`, `expires_at` and `upload_only: true`, and no node or link."
          content:
            application/json:
              schema:
                type: object
                properties:
                  node_id: { type: string, description: "An organisation link." }
                  token: { type: string, description: "An anyone link: the visitor's credential, starting scl_." }
                  expires_at: { type: string, format: date-time, description: "An anyone link: when the credential ends." }
                  link: { $ref: "#/components/schemas/ShareLink" }
                  node: { type: string, description: "An anyone link: the node the link opens." }
                  upload_only: { type: boolean, description: "A drop link: the credential may upload into the link's directory and nothing else." }
        "401":
          description: An anyone link with a password, and no password or the wrong one. `details.reason` is `password_required` or `password_wrong`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/share/renew:
    post:
      tags: [Sharing]
      operationId: renewShareCredential
      summary: Renew a visitor's credential
      description: |
        The bearer is a visitor's credential (`scl_`) for a link that anyone can open. A live one
        is swapped for a fresh one that lives fifteen minutes. The link's state is checked again:
        a reset, deleted, paused, expired or trashed link, or a suspended account, is `not_found`,
        and a credential that has expired or is not valid is `unauthenticated`. A key or a token
        gets `forbidden`.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The new credential and when it ends.
          content:
            application/json:
              schema:
                type: object
                required: [token, expires_at]
                properties:
                  token: { type: string }
                  expires_at: { type: string, format: date-time }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/share/info:
    get:
      tags: [Sharing]
      operationId: getShareInfo
      summary: What a drop link's visitor is shown
      description: |
        The bearer is a drop link's visitor credential (`scl_`). The answer is the owner's title and
        message, whether a name and email are asked for, the link's end, and the largest file the
        account takes. A dead link is `not_found`. An access link's credential, a key or a token gets
        `forbidden` with `reason: link_route`.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The drop link's page.
          content:
            application/json:
              schema:
                type: object
                required: [title, message, ask_name, expires_at, max_file_size]
                properties:
                  title: { type: string }
                  message: { type: string }
                  ask_name: { type: boolean }
                  expires_at: { type: string, format: date-time }
                  max_file_size: { type: integer, description: The account's upload.max_file_size, in bytes. }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{acc}/sharing-policy:
    parameters:
      - $ref: "#/components/parameters/acc"
    get:
      tags: [Sharing]
      operationId: getSharingPolicy
      summary: Read the account's sharing policy
      description: The account's switch for links that anyone can open. Off by default.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharingPolicy" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [Sharing]
      operationId: updateSharingPolicy
      summary: Set the account's sharing policy
      description: |
        Turning `public_links` off pauses every link that anyone can open, at once; turning it on
        revives them. Turning `comments` off closes every comment route for the account and keeps the comments;
        turning it on shows them again. The account's owner or key may change either. Audited as
        `account.sharing_policy` and `account.comments_policy`.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SharingPolicyUpdate" }
      responses:
        "200":
          description: The policy as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharingPolicy" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{acc}/share-links:
    parameters:
      - $ref: "#/components/parameters/acc"
    get:
      tags: [Sharing]
      operationId: listAccountShareLinks
      summary: List the account's live links
      description: |
        Every live link of the account, oldest first, with its item and folder. The owner's session,
        the account key and an installation admin may call it; a member and a token get `not_found`.
        An owner sees the items of other members' My files without their name or path (`hidden` is
        true and `item_name`, `item_path` and `node_id` are null). An admin sees no item name or path
        at all. The account key sees every item. Links that have ended are left out, even while the
        sweep still keeps their row.
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - { name: audience, in: query, required: false, schema: { type: string, enum: [organisation, anyone] } }
        - { name: kind, in: query, required: false, schema: { type: string, enum: [access, drop] } }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: One page of the links.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountShareLinkList" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{acc}/share-links/delete-public:
    parameters:
      - $ref: "#/components/parameters/acc"
    post:
      tags: [Sharing]
      operationId: deletePublicShareLinks
      summary: Delete every link that anyone can open
      description: |
        Deletes every anyone link of the account, access and drop links alike, at once. Organisation
        links stay. Visitors of a deleted link lose access at once, and the open uploads of its drop
        link are released. Each link is audited as `link.delete`, and one `link.delete_public` entry
        names the count. The owner's session, the account key and an installation admin may call it;
        a member and a token get `not_found`. Clients confirm with the user before they call it.
      security: [{ bearer: [] }, { session: [] }]
      responses:
        "200":
          description: How many links were deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicLinksDeleted" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/nodes/{nod}/permissions:
    parameters:
      - $ref: "#/components/parameters/nod"
    get:
      tags: [Permissions]
      operationId: listNodePermissions
      summary: List the permissions that reach a node
      description: |
        The permissions on the node and on its ancestors. Each says whether it sits on the node
        (`inherited_from` is null) or above it. Needs a role on the node. A manager on the node and
        an account key see the full chain. A user below manager sees only the rows that name it or a
        group it is in, and inherited rows only among those. A delegated token gets `forbidden`.
      security: [{ bearer: [] }, { session: [] }]
      responses:
        "200":
          description: The permissions, the node's own first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PermissionList" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/nodes/{nod}/permissions/{subject}:
    parameters:
      - $ref: "#/components/parameters/nod"
      - $ref: "#/components/parameters/subject"
    put:
      tags: [Permissions]
      operationId: setNodePermission
      summary: Give a user or group a role on a node, or change it
      description: |
        Needs the manager role on the node, or an editor when the node or an ancestor has
        `editors_can_share` and the team space does not set `sharing_managers_only`; or an account
        key. A caller may not grant a role above its own, so an editor cannot make a manager. The
        subject must belong to the account, and an installation admin cannot hold a permission.
        `expires_at` ends the permission at that instant; it must be in the future and within
        `sharing.max_expiry` of now (0 means no cap). A team space with `members_only` refuses a
        permission below its root to anyone who holds nothing on the root, with `conflict`.
        `notify` (default true) mails the subject, in its own language: an active user, or each
        active member of a group of at most 50 members. The reply says whether mail went out and,
        if not, why. Delegated tokens never manage permissions.
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PermissionSet" }
      responses:
        "200":
          description: The permission, and whether the subject was told by mail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PermissionChange" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [Permissions]
      operationId: removeNodePermission
      summary: Remove a permission that sits on the node
      description: Needs the same right as setting one, and may not remove a permission above the caller's own role.
      security: [{ bearer: [] }, { session: [] }]
      responses:
        "204": { description: Removed. }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/shared:
    get:
      tags: [Permissions]
      operationId: listShared
      summary: List what was shared with the caller
      description: |
        The nodes the caller holds a permission on, directly or through a group, each with the
        caller's role. Nodes in the caller's own personal folder are left out, and so are nodes
        whose team space's root the caller already reaches. The caller reaches nothing above a
        shared node. A user only: an account key has no shares.
        Without `order`, the nodes come in node ID order. With `order=recent`, the newest share
        first, and each item carries `shared_at`: the later of the permission's creation and the
        caller's visit to an organisation link on the node.
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
        - name: order
          in: query
          description: "`recent` orders by `shared_at`, newest first. Left out: node ID order."
          schema: { type: string, enum: [recent] }
      responses:
        "200":
          description: The shared nodes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedList" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/nodes/{nod}/star:
    parameters:
      - $ref: "#/components/parameters/nod"
    put:
      tags: [Stars]
      operationId: starNode
      summary: Star a file or directory for the caller
      description: |
        Stars a node the caller reaches at any role. Starring again changes nothing. A user only, and a
        delegated token acting as its user: an account key and an installation admin get `forbidden`.
        A user may hold at most 5000 stars; a star past that is `conflict` with `details.reason` `limit`.
        A star on a node that is later trashed or that the caller loses is kept but not listed.
      security: [{ bearer: [] }, { session: [] }]
      responses:
        "204": { description: Starred. }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [Stars]
      operationId: unstarNode
      summary: Remove the caller's star on a file or directory
      description: |
        Removes the caller's own star. A signed-in user needs no reach for it, and any well-formed node ID
        answers 204, so a star on a trashed or unreachable node can be removed. A delegated token acting for
        the user needs write and reach. A star that is not there is not an error.
      security: [{ bearer: [] }, { session: [] }]
      responses:
        "204": { description: Unstarred. }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/starred:
    get:
      tags: [Stars]
      operationId: listStarred
      summary: List the caller's starred items, newest star first
      description: |
        The starred nodes the caller still reaches, each with its role and `starred_at`. A star on a node
        in the trash, or one the caller no longer reaches, is kept but not listed, so a page can come back
        shorter than its limit; `next_cursor` is set while the stars run on. A user only.
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: The starred items.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StarredList" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/nodes/{nod}/comments:
    parameters:
      - $ref: "#/components/parameters/nod"
    get:
      tags: [Comments]
      operationId: listComments
      summary: List the comments of a file or a folder
      description: |
        The top-level comments of the node, newest first, each with its first replies (oldest first, up to 50) and
        its reply count. `replies_more` is set when more replies exist: list them with `?parent=` on this route.
        With `?parent=cmt_...` the answer is the replies of that top-level comment, oldest first.

        A viewer or any role above it reads comments. A delegated token reads them inside its folders, as it reads
        the node, and an account key reads them too. A link that anyone can open does not reach this route.
        A shortcut has no comments and answers `404`. When the account's comments are off, every answer is `403`
        with `reason: comments_off`.

        A comment is plain text. Its body is returned as the text the author typed, with no markup, and a client
        must show it as text, never as HTML. A body is at most 2,000 characters and 50 lines. A line break is kept
        (CR and CRLF become LF); any other control character, a bidi control character and U+061C are refused when
        the comment is written.

        A name is a display name. A comment carries no user ID. `mine` is set on the caller's own comment.
        `author_gone` is set when the author's user was deleted: show "former member", translated, and no name.
        A mention names a person who reached the node when the comment was written, and the list answers with the
        name only.
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
        - name: parent
          in: query
          required: false
          description: A top-level comment of this node. Lists its replies, instead of the top-level comments.
          schema: { type: string, example: "cmt_7k2m9q..." }
      responses:
        "200":
          description: One page of comments.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommentList" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [Comments]
      operationId: createComment
      summary: Comment on a file or a folder, or reply to a comment
      description: |
        Adds a comment, or a reply when `parent_id` names a top-level comment of this node. The caller must be a
        signed-in user, or a delegated token with write, which acts as its user. An account key and a read-only
        token are refused. The caller needs the commenter role or above on the node; the role is checked again
        inside the write, so a permission removed during the request stops it.

        The body is plain text of 1 to 2,000 characters, with no control or bidi control character. The write is
        refused with `conflict` and `reason: limit` past 5,000 live comments on the node, and with `rate_limited`
        past 30 writes a minute per user.

        `mentions` are references from the people list (`/people`), at most 10, each once. A reference names the
        person only for this node. A reference that does not open for this node is `invalid_request`. A reference
        to a person who does not reach the node, is not active, or does not exist is dropped without an error:
        the comment is saved and the answer is the same as for any other reference. A reply to a reply is
        `invalid_request`. Nothing is sent to anyone for a comment in this release.

        Audited as `comment.create`, with the comment's ID, whether it is a reply, and the number of references
        sent. No text and no name is audited.
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommentCreate" }
      responses:
        "201":
          description: The comment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/comments/{cmt}:
    parameters:
      - name: cmt
        in: path
        required: true
        schema: { type: string, example: "cmt_7k2m9q..." }
    patch:
      tags: [Comments]
      operationId: editComment
      summary: Edit the caller's own comment
      description: |
        Changes the body of a comment the signed-in user wrote, and sets `edited_at`. Only the author may edit, and
        only as a commenter or above on the node. A token and an account key are refused. An edit does not notify
        anyone, and it does not change who is named. Audited as `comment.edit`.
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommentEdit" }
      responses:
        "200":
          description: The comment as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [Comments]
      operationId: deleteComment
      summary: Delete a comment
      description: |
        The author, or a manager of the node, deletes a comment. A signed-in user does it; a token and an account key
        are refused. A comment with replies stays as a tombstone, with no text and no author, so the replies keep their
        thread; the tombstone goes when its last reply is deleted. Any other comment is removed. Audited as
        `comment.delete`, with whether a tombstone was left.
      security: [{ bearer: [] }, { session: [] }]
      responses:
        "204": { description: The comment is deleted. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/comments/{cmt}/resolve:
    parameters:
      - name: cmt
        in: path
        required: true
        schema: { type: string, example: "cmt_7k2m9q..." }
    post:
      tags: [Comments]
      operationId: resolveComment
      summary: Resolve or reopen a top-level comment
      description: |
        Any commenter or above on the node may resolve a top-level comment, or reopen it. A reply cannot be resolved.
        A signed-in user does it; a token and an account key are refused. The resolver is recorded. Audited as
        `comment.resolve`.
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommentResolve" }
      responses:
        "200":
          description: The comment as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/nodes/{nod}/people:
    parameters:
      - $ref: "#/components/parameters/nod"
    get:
      tags: [Comments]
      operationId: listPeopleToMention
      summary: Suggest people to name in a comment on a node
      description: |
        Up to five active users of the caller's account whose display name contains `q`, and who reach the node,
        each with a reference to name them in a comment on this node (`mentions` of the comment). `q` is 2 to 100
        characters. The list is rate limited to 60 a minute per user. Only a signed-in user may ask: a token and an
        account key are refused. A caller who does not reach the node gets `404`; a viewer, who reaches it but may not
        comment, gets `403`. A user who does not reach the node is never listed, whatever the name.

        The answer carries references, not user IDs. A reference is good for this node only. The list checks at most
        50 matching users for reach, so a name that many users share may show fewer than five suggestions.
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 100 }
      responses:
        "200":
          description: The suggestions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonList" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/recent:
    get:
      tags: [Stars]
      operationId: listRecent
      summary: List the caller's recent items, latest first
      description: |
        The nodes the caller viewed (a signed-in user opening a file, not a delegated token and not a
        HEAD request) or edited (any user who created, wrote or copied the file, a token acting as its user
        included), each with `viewed_at`, `edited_at` and `last_at`. Entries older than 30 days are
        removed, and at most 500 are kept per user. An item the caller no longer reaches, or one in the
        trash, is kept but not listed, so a page can come back shorter than its limit. A user only.
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: The recent items.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecentList" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [Stars]
      operationId: clearRecent
      summary: Clear the caller's recent list
      description: A signed-in user only. A delegated token is refused, whatever its scope.
      security: [{ bearer: [] }, { session: [] }]
      responses:
        "204": { description: Cleared. }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/recent/{nod}:
    parameters:
      - $ref: "#/components/parameters/nod"
    delete:
      tags: [Stars]
      operationId: removeRecent
      summary: Remove one item from the caller's recent list
      description: |
        Removes the caller's entry for the node. It answers 204 whether or not the entry was there, and
        it does not check reach: the entry is the caller's own. A signed-in user only; a delegated token
        is refused, whatever its scope.
      security: [{ bearer: [] }, { session: [] }]
      responses:
        "204": { description: Removed. }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/directory:
    get:
      tags: [Permissions]
      operationId: searchDirectory
      summary: Find people and groups of the caller's account, for sharing
      description: |
        Used by the share dialog. Any user of the account may search by session, and so may the
        account key. An installation admin gets `forbidden`, and so does every delegated token,
        whether or not it names a user: a token is narrowed to its folders.

        `q` is matched case-insensitively. A user matches when its email local part starts with `q`,
        or its display name contains `q`. A group matches when its name contains `q`. `%` and `_` are
        taken literally. Only active users are listed: a pending or disabled user is never found, and
        no other account is searched. The answer holds at most 20 entries, users and groups together,
        sorted by name. Each caller is rate limited.
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - name: q
          in: query
          required: true
          description: The text to find, 2 to 100 characters after trimming.
          schema: { type: string, minLength: 2, maxLength: 100 }
        - name: kind
          in: query
          description: Which kinds to find. Defaults to all.
          schema: { type: string, enum: [user, group, all], default: all }
      responses:
        "200":
          description: The matches. An empty list means none.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 20
                    items: { $ref: "#/components/schemas/DirectoryEntry" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/folders/{fld}/settings:
    parameters:
      - $ref: "#/components/parameters/fld"
    patch:
      tags: [Permissions]
      operationId: updateFolderSettings
      summary: Change a team space's restrictions
      description: |
        Sets `members_only`, `sharing_managers_only`, `no_download_for_viewers` and `allow_links`.
        Needs the manager role on the space's root, which the account's owners and an account key
        hold. A personal folder has no such settings and is refused with `invalid_request`. A caller
        who cannot reach the folder gets `not_found`.
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FolderSettingsUpdate" }
      responses:
        "200":
          description: The folder, with its settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Folder" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/folders/{fld}/hidden:
    parameters:
      - $ref: "#/components/parameters/fld"
    put:
      tags: [Permissions]
      operationId: hideFolder
      summary: Hide a team space from the caller's own list
      description: |
        Per user. The caller must reach the space. Hiding changes nothing about access: the space is
        still reached, and it is listed with `GET /folders?hidden=true`. A personal folder cannot be hidden.
      security: [{ bearer: [] }, { session: [] }]
      responses:
        "204": { description: Hidden. }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [Permissions]
      operationId: showFolder
      summary: Show a hidden team space again
      security: [{ bearer: [] }, { session: [] }]
      responses:
        "204": { description: Shown again. }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/nodes/{nod}/transfer-ownership:
    parameters:
      - $ref: "#/components/parameters/nod"
    post:
      tags: [Permissions]
      operationId: transferOwnership
      summary: Give a file or folder to another user of the account
      description: |
        Only the item's owner (`owner_id`), or an account key, may transfer it, and the caller needs
        the editor role on it. The new owner must be an active user of the same account.
        In a personal folder the item moves, with its subtree and direct permissions, into the new
        owner's My files, renamed if the name is taken; the previous owner keeps editor on it. In a
        team space the item stays where it is, and only the owners of it and its subtree change.
        Usage does not change, since both users belong to the same account.
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              additionalProperties: false
              properties:
                to: { type: string, example: usr_5m2k8x1v0c3d9q7r4t6w8y0z2a }
      responses:
        "200":
          description: The node, now owned by the new owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/nodes/{nod}/access-requests:
    parameters:
      - $ref: "#/components/parameters/nod"
    post:
      tags: [Permissions]
      operationId: requestAccess
      summary: Ask for a role on a node
      description: |
        A user asks for a role it lacks. The answer is always `202` with no body, whether or not the
        node exists or the caller can reach it, so the answer reveals nothing about the node. A
        request is recorded only when the node exists in the caller's account and its role is below
        the one asked for, and a user with no role counts as below. A pending request from the same
        user on the same node collapses into the first, which keeps its role and message. Managers are
        mailed when a request is new, and not again within 24 hours of the user's previous request on
        that node. Rate limited per user. An account key and a delegated token get the same silent
        `202`, and nothing is recorded.
        A request on a shortcut is filed on the shortcut's target and names the shortcut: the target's
        managers receive it, and approving it grants the target. The caller must reach the shortcut
        itself. A shortcut with no live target, one the caller cannot see, and a target that is already
        reachable all get the same silent `202` as a missing node. The requester is mailed the decision.
        An approval names the shortcut and links to it only while the requester still reaches it; otherwise
        the mail is generic and has no link. A denial is always generic, with no name and no link. No
        response shows the shortcut or the target to the requester.
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccessRequestCreate" }
      responses:
        "202": { description: Accepted. No body. }
        default: { $ref: "#/components/responses/Error" }
    get:
      tags: [Permissions]
      operationId: listNodeAccessRequests
      summary: List the access requests on a node
      description: Needs the manager role on the node, or editor where editors may share there. A delegated token gets `forbidden`.
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: The requests, oldest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessRequestList" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/access-requests:
    get:
      tags: [Permissions]
      operationId: listPendingAccessRequests
      summary: List the pending requests the caller may decide
      description: |
        Reads the oldest pending requests of the account, up to 5,000, and answers those on nodes the
        caller may share, up to the page limit. Rate limited per caller (limiter `access.list`, 60 a
        minute). A delegated token gets `forbidden`.
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: The pending requests the caller may decide.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessRequestList" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/access-requests/{arq}/approve:
    parameters:
      - $ref: "#/components/parameters/arq"
    post:
      tags: [Permissions]
      operationId: approveAccessRequest
      summary: Approve an access request
      description: |
        Grants the role asked for, or the role named, which may not be above the caller's own. A grant
        only raises: a requester who already holds that role or more keeps it. The requester is
        mailed the decision. A grant respects `members_only`: approving a requester who holds nothing on
        the root of a members-only space gets `conflict`. The decided role is stored, so a listing shows
        what was granted. A request already decided gets `conflict`.
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccessRequestDecision" }
      responses:
        "200":
          description: The decided request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessRequest" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/access-requests/{arq}/deny:
    parameters:
      - $ref: "#/components/parameters/arq"
    post:
      tags: [Permissions]
      operationId: denyAccessRequest
      summary: Deny an access request
      description: Closes the request without granting anything, and mails the requester. The mail says that an item was involved, without naming it. A request already decided gets `conflict`.
      security: [{ bearer: [] }, { session: [] }]
      responses:
        "200":
          description: The decided request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessRequest" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/nodes/{nod}/restore:
    parameters:
      - $ref: "#/components/parameters/nod"
    post:
      tags: [Trash]
      operationId: restoreNode
      summary: Restore a trashed file or directory
      description: |
        Puts the node back where it was. The caller must be the one that trashed it, or hold the manager
        role on it. The caller must also hold editor on the original parent. If that parent is gone or is
        in the trash, the node goes to the root of its folder, which needs editor too; otherwise the answer
        is `conflict`. A name the destination now has is renamed to "name (1).ext", as a copy is. The node
        is answered with its new parent and name. Audited as `node.restore`.
      security: [{ bearer: [] }, { session: [] }]
      responses:
        "200":
          description: The restored node.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/trash:
    get:
      tags: [Trash]
      operationId: listTrash
      summary: List the trash the caller may see, newest first
      description: |
        The explicit trash roots the caller may restore: those it trashed, and those it manages. An account
        key sees all of them. A delegated token sees only items inside its folders and node scope. An owner
        does not see another user's personal-folder trash. Each item is the node, with `trashed_at`,
        `trashed_by`, `original_parent_id` and `purge_at`. A page is filled from batches and filtered, so it
        can come back short; it carries a `next_cursor` whenever there may be more.
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
        - name: folder
          in: query
          required: false
          description: Only the items in this folder.
          schema: { type: string, example: fld_5m2k8x1v0c3d9q7r4t6w8y0z2a }
      responses:
        "200":
          description: A page of trash items.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrashList" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/trash/empty:
    post:
      tags: [Trash]
      operationId: emptyTrash
      summary: Purge every trashed item the caller may delete for good
      description: |
        Purges the explicit trash roots the caller holds the manager role on (an account key: all of them),
        at most 1000 per call, and it examines at most 5000 trash roots, the ones it cannot purge included.
        `more` is true when the call stopped early, and the client calls again until it is false. An optional
        `folder` query limits it to one folder. Each purge is audited as `node.purge`.
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - name: folder
          in: query
          required: false
          schema: { type: string, example: fld_5m2k8x1v0c3d9q7r4t6w8y0z2a }
      responses:
        "200":
          description: How many items were purged, and whether more remain.
          content:
            application/json:
              schema:
                type: object
                required: [purged, more]
                properties:
                  purged: { type: integer, minimum: 0 }
                  more: { type: boolean }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/trash/{nod}:
    parameters:
      - $ref: "#/components/parameters/nod"
    delete:
      tags: [Trash]
      operationId: purgeTrashedNode
      summary: Delete one trashed item for good
      description: |
        Purges an item that is in the trash, before its retention ends. Needs the manager role on it, or an
        account key. A node that is not in the trash is `not_found`; delete a live node with
        `DELETE /nodes/{nod}?permanent=true`.
      security: [{ bearer: [] }, { session: [] }]
      responses:
        "204":
          description: Purged.
        default: { $ref: "#/components/responses/Error" }

  /api/v1/nodes/{nod}/versions:
    parameters:
      - $ref: "#/components/parameters/nod"
    get:
      tags: [Versions]
      operationId: listVersions
      summary: List the versions of a file
      description: |
        The current content first, with `current: true` and the id `current`, then the earlier versions,
        newest replaced first. Any role that reads the file lists them. A folder has no versions.
      security: [{ bearer: [] }, { session: [] }]
      responses:
        "200":
          description: The versions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionList" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/nodes/{nod}/versions/{ver}:
    parameters:
      - $ref: "#/components/parameters/nod"
      - $ref: "#/components/parameters/ver"
    patch:
      tags: [Versions]
      operationId: updateVersion
      summary: Name a version, or keep it forever
      description: |
        Sets `label` (at most 100 characters; empty removes it) and `keep_forever`. Needs the editor role.
        A kept version is never pruned and does not count toward `versions.max_count`. Marking a version kept
        forever when the file already has `versions.max_kept` (default 200) of them is `conflict`, with the
        limit in `details`.
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VersionUpdate" }
      responses:
        "200":
          description: The version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Version" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [Versions]
      operationId: deleteVersion
      summary: Delete an earlier version for good
      description: |
        Needs the editor role. Its bytes come off the usage. The current content is not a version and
        cannot be deleted this way: `current` is answered `conflict`. Delete the file, or restore an older
        version first.
      security: [{ bearer: [] }, { session: [] }]
      responses:
        "204":
          description: Deleted.
        default: { $ref: "#/components/responses/Error" }

  /api/v1/nodes/{nod}/versions/{ver}/content:
    parameters:
      - $ref: "#/components/parameters/nod"
      - $ref: "#/components/parameters/ver"
    get:
      tags: [Versions]
      operationId: getVersionContent
      summary: Download an earlier version of a file
      description: |
        The same as the content route: ranges, `If-Range`, the ETag of the version, and `disposition`. The
        no-download rule applies, since a version is the file's own content. Needs the viewer role.
      security: [{ bearer: [] }, { session: [] }]
      responses:
        "200":
          description: The version's contents.
        "206":
          description: A range of the version's contents.
        default: { $ref: "#/components/responses/Error" }
    head:
      tags: [Versions]
      operationId: headVersionContent
      summary: The headers of an earlier version of a file
      security: [{ bearer: [] }, { session: [] }]
      responses:
        "200":
          description: The headers of the version.
        default: { $ref: "#/components/responses/Error" }

  /api/v1/nodes/{nod}/versions/{ver}/restore:
    parameters:
      - $ref: "#/components/parameters/nod"
      - $ref: "#/components/parameters/ver"
    post:
      tags: [Versions]
      operationId: restoreVersion
      summary: Make an earlier version the current content
      description: |
        The current content becomes a version, so the restore can be undone the same way. The chosen version
        stays in the history with its row, label and `keep_forever`. Its bytes then count as the file's content
        as well, so usage grows by its size and the quota is checked for it (`quota_exceeded` if it does not
        fit). Needs the contributor role, since it replaces the content, and `If-Match` with the current ETag,
        as a content replace does: a stale ETag is `precondition_failed`, a missing one `precondition_required`.
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - name: If-Match
          in: header
          required: true
          description: The ETag of the current content, from the last read.
          schema: { type: string }
      responses:
        "200":
          description: The file, with its new ETag.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/links/{token}:
    parameters:
      - name: token
        in: path
        required: true
        description: The token from `POST /nodes/{nod}/links`. It is a credential, so the access log records the route, not the path.
        schema: { type: string, maxLength: 512 }
    get:
      tags: [Files]
      operationId: getSignedLink
      summary: Download the file a signed link names
      description: |
        No credential is needed, and no cookie is read. The token must match the file's current
        ETag. A link past its time is `link_expired` (410). A link that is malformed, forged, for a
        file that has changed or been deleted, or for another node is `not_found`, so a probe learns
        nothing from the difference. A suspended account is `account_suspended`. The user's grants
        are not consulted. Requests are limited to 600 a minute per client address, charged before
        the token is read (`rate_limited`). Range, conditional headers and the safety headers work as for
        `GET /nodes/{nod}/content`. On the content origin this is the only path that is served.
      security: []
      parameters:
        - { name: Range, in: header, schema: { type: string } }
        - { name: If-Range, in: header, schema: { type: string } }
        - { name: If-None-Match, in: header, schema: { type: string } }
        - { name: If-Modified-Since, in: header, schema: { type: string } }
      responses:
        "200":
          description: The whole file.
          headers:
            ETag: { schema: { type: string } }
            Last-Modified: { schema: { type: string } }
            Accept-Ranges: { schema: { type: string, enum: [bytes] } }
            Content-Disposition: { schema: { type: string } }
            Cross-Origin-Resource-Policy: { schema: { type: string, example: cross-origin } }
          content:
            "*/*":
              schema: { type: string, format: binary }
        "206":
          description: The requested range, or a `multipart/byteranges` body.
          headers:
            Content-Range: { schema: { type: string } }
          content:
            "*/*":
              schema: { type: string, format: binary }
        "304":
          description: Not modified.
        "416":
          description: The range is not satisfiable.
          headers:
            Content-Range: { schema: { type: string, example: "bytes */1048576" } }
        default: { $ref: "#/components/responses/Error" }
    head:
      tags: [Files]
      operationId: headSignedLink
      summary: The headers of a signed link's file, without the body
      description: As `GET`, with no body.
      security: []
      parameters:
        - { name: Range, in: header, schema: { type: string } }
        - { name: If-Range, in: header, schema: { type: string } }
      responses:
        "200":
          description: The file's headers.
        "206":
          description: The range's headers.
        "416":
          description: The range is not satisfiable.
        default: { $ref: "#/components/responses/Error" }

webhooks:
  file.created:
    post:
      tags: [Webhooks]
      operationId: fileCreatedEvent
      summary: A file or a shortcut was created
      description: |
        Sent to each active endpoint of the account that subscribes to file.created. The body is WebhookEvent,
        whose data is WebhookFileData. A shortcut has kind shortcut and no target. Events of a user's My files go
        only to endpoints made by the account key. A copy of a folder reports each file it makes, unless the copy is too large to
        report file by file (see WebhookFolderData); then it sends one event for the new folder.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookEvent" }
      responses:
        "2XX": { description: Any 2xx answer marks the delivery as delivered. }
  file.updated:
    post:
      tags: [Webhooks]
      operationId: fileUpdatedEvent
      summary: A file's contents or name changed
      description: |
        Sent for a content write (PUT, an upload that replaces a file, a version restore) and for a rename. The
        data is WebhookFileData, as the file is after the change.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookEvent" }
      responses:
        "2XX": { description: Any 2xx answer marks the delivery as delivered. }
  file.moved:
    post:
      tags: [Webhooks]
      operationId: fileMovedEvent
      summary: A file moved to another place, into another folder or into another user's My files
      description: |
        Sent for a move, for an ownership transfer into My files, for each file below a moved folder, and for each
        file moved when a deleted user's files go to another user. The data is WebhookFileData, as the file is
        after the move. A change too large to report file by file sends one event for the folder instead, with kind dir and
        subtree true, and no event for its files (see WebhookFolderData). A change is too large when it
        touches more than 1,000 files, when its files times the endpoints subscribed to the type exceed 5,000,
        or when its tree holds more than 10,000 nodes.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookEvent" }
      responses:
        "2XX": { description: Any 2xx answer marks the delivery as delivered. }
  file.deleted:
    post:
      tags: [Webhooks]
      operationId: fileDeletedEvent
      summary: A file was moved to the trash
      description: |
        Sent when a file, or a file below a trashed folder, goes to the trash. A purge sends nothing.
        The data is WebhookFileData. A change too large to report file by file sends one event for the folder instead, with kind dir and
        subtree true, and no event for its files (see WebhookFolderData). A change is too large when it
        touches more than 1,000 files, when its files times the endpoints subscribed to the type exceed 5,000,
        or when its tree holds more than 10,000 nodes.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookEvent" }
      responses:
        "2XX": { description: Any 2xx answer marks the delivery as delivered. }
  file.restored:
    post:
      tags: [Webhooks]
      operationId: fileRestoredEvent
      summary: A file was restored from the trash
      description: |
        Sent for each file that a restore brings back, and for a restored folder's files. The data is
        WebhookFileData, as the file is after the restore. A change too large to report file by file sends one event for the folder instead, with kind dir and
        subtree true, and no event for its files (see WebhookFolderData). A change is too large when it
        touches more than 1,000 files, when its files times the endpoints subscribed to the type exceed 5,000,
        or when its tree holds more than 10,000 nodes.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookEvent" }
      responses:
        "2XX": { description: Any 2xx answer marks the delivery as delivered. }
  upload.completed:
    post:
      tags: [Webhooks]
      operationId: uploadCompletedEvent
      summary: A resumable upload was completed
      description: |
        Sent after the file event of the same upload. The data is WebhookUploadCompletedData: the file, and the
        upload's ID.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookEvent" }
      responses:
        "2XX": { description: Any 2xx answer marks the delivery as delivered. }
  user.created:
    post:
      tags: [Webhooks]
      operationId: userCreatedEvent
      summary: A user was created in the account
      description: |
        The data is WebhookUserData: the user's ID and external ID, and no email address or name.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookEvent" }
      responses:
        "2XX": { description: Any 2xx answer marks the delivery as delivered. }
  user.verified:
    post:
      tags: [Webhooks]
      operationId: userVerifiedEvent
      summary: A user was verified
      description: |
        Sent when a user is verified at creation, or when a verification link is used. The data is WebhookUserData.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookEvent" }
      responses:
        "2XX": { description: Any 2xx answer marks the delivery as delivered. }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer <credential>`. Installation admin keys start with `sc_admin_`;
        account keys start with `sc_acct_`; delegated tokens start with `sct_` and are refused
        once they expire (`token_expired`) or are revoked (`unauthenticated`). A visitor of a link
        that anyone can open holds a credential that starts with `scl_`; it is accepted only on the
        routes that say so, and refused elsewhere with `forbidden`, `reason: link_route`. A cookie
        session is never accepted for a request from another origin.
    session:
      type: apiKey
      in: cookie
      name: __Host-selfcloud_session
      description: |
        The session cookie set by sign-in (named `selfcloud_session` when `public_url` is
        http). Requests that change state also need the `Origin` header of this site and the
        `X-CSRF-Token` header with the `csrf_token` from sign-in.

  parameters:
    acc:
      name: acc
      in: path
      required: true
      schema: { type: string, example: acc_5m2k8x1v0c3d9q7r4t6w8y0z2a }
    usr:
      name: usr
      in: path
      required: true
      schema: { type: string, example: usr_5m2k8x1v0c3d9q7r4t6w8y0z2a }
    fld:
      name: fld
      in: path
      required: true
      schema: { type: string, example: fld_5m2k8x1v0c3d9q7r4t6w8y0z2a }
    shl:
      name: shl
      in: path
      required: true
      schema: { type: string, example: shl_5m2k8x1v0c3d9q7r4t6w8y0z2a }
    nod:
      name: nod
      in: path
      required: true
      schema: { type: string, example: nod_5m2k8x1v0c3d9q7r4t6w8y0z2a }
    lbf:
      name: lbf
      in: path
      required: true
      schema: { type: string, example: lbf_5m2k8x1v0c3d9q7r4t6w8y0z2a }
    ver:
      name: ver
      in: path
      required: true
      description: A version's ID (`ver_...`). The current content is not a version, so it has no ID here.
      schema: { type: string, example: ver_5m2k8x1v0c3d9q7r4t6w8y0z2a }
    upl:
      name: upl
      in: path
      required: true
      schema: { type: string, example: upl_5m2k8x1v0c3d9q7r4t6w8y0z2a }
    grp:
      name: grp
      in: path
    dlv:
      name: dlv
      in: path
      required: true
      schema: { type: string, example: dlv_5m2k8x1v0c3d9q7r4t6w8y0z2a }
    hook:
      name: hook
      in: path
      required: true
      schema: { type: string, example: whk_5m2k8x1v0c3d9q7r4t6w8y0z2a }
    subject:
      name: subject
      in: path
      required: true
      description: A user (`usr_...`) or a group (`grp_...`) of the same account.
      schema: { type: string, example: usr_5m2k8x1v0c3d9q7r4t6w8y0z2a }
    arq:
      name: arq
      in: path
      required: true
      schema: { type: string, example: arq_5m2k8x1v0c3d9q7r4t6w8y0z2a }
    tusResumable:
      name: Tus-Resumable
      in: header
      required: true
      description: "Must be 1.0.0 (except on OPTIONS). Otherwise 412 precondition_failed."
      schema: { type: string, enum: ["1.0.0"] }
    uploadLength:
      name: Upload-Length
      in: header
      required: true
      description: The file's length in bytes. Deferred lengths are not supported.
      schema: { type: integer, format: int64, minimum: 0 }
    uploadMetadata:
      name: Upload-Metadata
      in: header
      required: true
      description: |
        Comma-separated `key base64value` pairs; see the operation for the keys. The value is
        base64 of the text (`folder` takes a folder ID, `path` a directory path).
      schema: { type: string, maxLength: 8192 }
    uploadChecksum:
      name: Upload-Checksum
      in: header
      description: |
        `<algorithm> <base64 digest>` of the piece, with algorithm `sha256` or `sha1`. A piece
        that does not match is refused and nothing is kept.
      schema: { type: string }
    ifMatch:
      name: If-Match
      in: header
      required: false
      description: "The node's current `etag`. Optional; a mismatch on a rename or move is precondition_failed."
      schema: { type: string }
    limit:
      name: limit
      in: query
      description: Page size.
      schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
    cursor:
      name: cursor
      in: query
      description: The `next_cursor` of the previous page.
      schema: { type: string }

  headers:
    Tus-Resumable:
      description: The tus version the server speaks, 1.0.0.
      schema: { type: string, enum: ["1.0.0"] }
    Tus-Version:
      description: The tus versions the server supports, on a 412.
      schema: { type: string, example: "1.0.0" }
    Tus-Extension:
      description: The tus extensions the server has.
      schema: { type: string, example: "creation,creation-with-upload,expiration,checksum,termination" }
    Tus-Max-Size:
      description: The largest file in bytes.
      schema: { type: integer, format: int64 }
    Tus-Checksum-Algorithm:
      description: The checksum algorithms a piece may use.
      schema: { type: string, example: "sha1,sha256" }
    Upload-Offset:
      description: "The durable offset: bytes that are on disk and synced."
      schema: { type: integer, format: int64, minimum: 0 }
    Upload-Length:
      description: The declared length of the file.
      schema: { type: integer, format: int64, minimum: 0 }
    Upload-Expires:
      description: When the upload expires unless a piece refreshes it (HTTP date). Never later than upload.max_lifetime after creation.
      schema: { type: string }
    Selfcloud-Max-Chunk-Size:
      description: The largest piece in bytes (upload.max_chunk_size).
      schema: { type: integer, format: int64 }
    Selfcloud-Node-ID:
      description: The ID of the file that the request completed.
      schema: { type: string, example: nod_5m2k8x1v0c3d9q7r4t6w8y0z2a }
    Selfcloud-Upload-State:
      description: "`awaiting_commit`: all bytes are in and the upload waits for a name (see the commit route)."
      schema: { type: string, enum: [awaiting_commit] }
    X-Request-Id:
      description: The request's ID, also logged by the server.
      schema: { type: string, example: req_5m2k8x1v0c3d9q7r4t6w8y0z2a }

  responses:
    Error:
      description: An error. Act on `error.code`.
      headers:
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
        Retry-After:
          description: Seconds to wait, on `rate_limited` and `unavailable`.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    LabelChoice:
      type: object
      required: [id, name, archived]
      properties:
        id: { type: string }
        name: { type: string }
        archived: { type: boolean }
    LabelField:
      type: object
      required: [id, name, type, restricted, choices]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, enum: [text, number, date, user, choice] }
        restricted: { type: boolean }
        choices: { type: array, items: { $ref: "#/components/schemas/LabelChoice" } }
        values: { type: integer, description: "Nodes holding a value. Shown to the account owner and the account key only." }
    LabelFieldList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/LabelField" } }
    LabelFieldInput:
      type: object
      required: [name, type]
      additionalProperties: false
      properties:
        name: { type: string }
        type: { type: string, enum: [text, number, date, user, choice] }
        restricted: { type: boolean, default: false }
        choices:
          type: array
          maxItems: 100
          items:
            type: object
            required: [name]
            additionalProperties: false
            properties:
              name: { type: string }
              archived: { type: boolean, default: false }
    LabelFieldPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        type: { type: string, enum: [text, number, date, user, choice] }
        restricted: { type: boolean }
        choices:
          type: array
          maxItems: 100
          items:
            type: object
            required: [name]
            additionalProperties: false
            properties:
              id: { type: string, description: "Names an existing choice; absent adds a choice." }
              name: { type: string }
              archived: { type: boolean }
    NodeLabelValue:
      type: object
      required: [value]
      properties:
        value:
          description: "Text, date or choice ID as a string; a number; a member's ID for a user field."
    NodeLabel:
      type: object
      required: [field_id, name, type, restricted, value]
      properties:
        field_id: { type: string }
        name: { type: string }
        type: { type: string, enum: [text, number, date, user, choice] }
        restricted: { type: boolean }
        value:
          description: "null when unset; a string, a number, {id, name} for a user, or {id, name, archived} for a choice."
    NodeLabelList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/NodeLabel" } }
    WebhookEvent:
      description: |
        The body of every event. Selfcloud writes the bytes it will send, so the signature (slice j3) covers exactly
        what the receiver reads. The event ID is the same on every attempt; receivers de-duplicate on it.
        The data of quota.warning and quota.exceeded is QuotaEventData. The test route sends webhook.test, whose data is
        an empty object. A quota event is sent once when its level is crossed, and again only after usage drops below it.
      type: object
      required: [id, type, time, account, data]
      properties:
        id: { type: string, example: evt_5m2k8x1v0c3d9q7r4t6w8y0z2a }
        type:
          type: string
          enum: [file.created, file.updated, file.moved, file.deleted, file.restored, upload.completed, user.created, user.verified, quota.warning, quota.exceeded, webhook.test]
        time: { type: string, format: date-time }
        account:
          type: object
          required: [id, external_id]
          properties:
            id: { type: string, example: acc_5m2k8x1v0c3d9q7r4t6w8y0z2a }
            external_id: { type: [string, "null"] }
        data:
          oneOf:
            - $ref: "#/components/schemas/WebhookFileData"
            - $ref: "#/components/schemas/WebhookFolderData"
            - $ref: "#/components/schemas/WebhookUserData"
            - $ref: "#/components/schemas/WebhookUploadCompletedData"
    WebhookFileData:
      description: The file or shortcut as the change left it. Never its contents, a link, or a shortcut's target.
      type: object
      required: [id, folder_id, kind, size, name, parent_id]
      properties:
        id: { type: string, example: nod_5m2k8x1v0c3d9q7r4t6w8y0z2a }
        folder_id: { type: string, example: fld_5m2k8x1v0c3d9q7r4t6w8y0z2a }
        kind: { type: string, enum: [file, shortcut] }
        size: { type: integer, format: int64 }
        name: { type: string, description: The name in Unicode NFC. }
        parent_id: { type: string, example: nod_5m2k8x1v0c3d9q7r4t6w8y0z2b }
    WebhookFolderData:
      description: |
        The folder a change touched when the change was too large to report file by file: more than 1,000 files, more
        than 5,000 deliveries (files times subscribed endpoints), or more than 10,000 nodes. It names no file: the
        receiver lists the folder through the API to see what changed. subtree is always true, and kind is always
        dir. A smaller change reports each file instead (WebhookFileData), and a change to no file reports nothing.
      type: object
      required: [id, folder_id, kind, parent_id, subtree]
      properties:
        id: { type: string, example: nod_5m2k8x1v0c3d9q7r4t6w8y0z2a }
        folder_id: { type: string, example: fld_5m2k8x1v0c3d9q7r4t6w8y0z2a }
        kind: { type: string, enum: [dir] }
        parent_id: { type: string, example: nod_5m2k8x1v0c3d9q7r4t6w8y0z2b }
        subtree: { type: boolean, enum: [true] }
    WebhookUserData:
      description: The user by ID and external ID. No email address and no name.
      type: object
      required: [id, external_id]
      properties:
        id: { type: string, example: usr_5m2k8x1v0c3d9q7r4t6w8y0z2a }
        external_id: { type: [string, "null"] }
    WebhookUploadCompletedData:
      description: The file the upload made or replaced, and the upload's ID.
      allOf:
        - $ref: "#/components/schemas/WebhookFileData"
        - type: object
          required: [upload_id]
          properties:
            upload_id: { type: string, example: upl_5m2k8x1v0c3d9q7r4t6w8y0z2a }
    Folder:
      type: object
      required: [id, external_id, name, created_at, updated_at]
      properties:
        id: { type: string, example: fld_5m2k8x1v0c3d9q7r4t6w8y0z2a }
        external_id:
          type: [string, "null"]
          description: The client's own reference; unique within the account.
        name: { type: string, description: The name in Unicode NFC. }
        kind: { type: string, enum: [team, personal], description: "A team space, or a user's personal folder." }
        owner_user_id: { type: string, description: The user of a personal folder. Absent for a team space. }
        root_node_id: { type: string, description: "The folder's root node, the node its permissions are set on (the share dialog opens on it). Set in every answer that returns a folder." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        members_only: { type: boolean, description: A team space only. Always false on a personal folder. }
        sharing_managers_only: { type: boolean, description: A team space only. Only managers may share in the space. }
        no_download_for_viewers: { type: boolean, description: A team space only. The no-download rule applies to every node. }
        allow_links: { type: boolean, description: A team space only. Stored now; public and organisation links (slice o) enforce it. It does nothing yet. }

    FolderSettingsUpdate:
      type: object
      additionalProperties: false
      description: At least one field is required. Team spaces only; the caller must manage the space's root.
      properties:
        members_only: { type: boolean }
        sharing_managers_only: { type: boolean }
        no_download_for_viewers: { type: boolean }
        allow_links: { type: boolean, description: Stored now; it does nothing until slice o. }

    AccessRequestCreate:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role: { type: string, enum: [viewer, commenter, editor] }
        message: { type: string, maxLength: 500, description: A note for the managers, shown verbatim as plain text. }

    AccessRequestDecision:
      type: object
      additionalProperties: false
      properties:
        role:
          type: string
          enum: [viewer, commenter, contributor, editor, manager]
          description: On approval, the role to grant. It defaults to the role asked for and may not be above the caller's own.

    AccessRequest:
      type: object
      required: [id, node_id, user_id, role, message, status, created_at, decided_by]
      properties:
        id: { type: string, example: arq_5m2k8x1v0c3d9q7r4t6w8y0z2a }
        node_id: { type: string }
        user_id: { type: string, description: The requester. }
        user_name: { type: string, description: The requester's display name or email. Shown to those who may decide. }
        role: { type: string, enum: [viewer, commenter, editor] }
        message: { type: string }
        status: { type: string, enum: [pending, approved, denied] }
        created_at: { type: string, format: date-time }
        decided_at: { type: [string, "null"], format: date-time }
        decided_by: { type: string, description: The caller who decided, empty while pending. }

    AccessRequestList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AccessRequest" }
        next_cursor: { type: string }

    FolderCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        external_id: { type: string, maxLength: 255 }

    FolderUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        external_id: { type: string, maxLength: 255, description: Empty clears it. }

    UploadCommit:
      type: object
      additionalProperties: false
      description: The new target of an upload that waits for a name. Missing fields keep the upload's own.
      properties:
        parent: { type: string, description: A directory's ID, in the upload's folder. }
        path: { type: string, maxLength: 4096, description: "A directory path under the folder's root, e.g. /a/b." }
        name: { type: string, minLength: 1, maxLength: 255 }
        on_conflict: { type: string, enum: [fail, rename, replace] }

    Node:
      type: object
      description: |
        A file or a directory. A folder's root is a directory with no `parent_id`, and its name
        is empty. Names are NFC, 1 to 255 bytes, may not hold `/`, `\`, control or invisible
        characters, may not start or end with a space, and may not be `.` or `..`. Within one
        directory names are unique without regard to case.
      required: [id, folder_id, parent_id, name, kind, size, created_at, modified_at]
      properties:
        id: { type: string, example: nod_5m2k8x1v0c3d9q7r4t6w8y0z2a }
        folder_id: { type: string, example: fld_5m2k8x1v0c3d9q7r4t6w8y0z2a }
        parent_id: { type: [string, "null"] }
        name: { type: string }
        kind: { type: string, enum: [dir, file, shortcut], description: "A shortcut points to another node; see target." }
        size: { type: integer, minimum: 0, description: Bytes, for a file. }
        mime_type: { type: string, description: Files only. }
        etag: { type: string, description: "A strong ETag. A file's changes with every write to it, its contents and its record (a rename, a move, a flag). A directory's changes with every write to its record. Send it as If-Match to make a rename or move conditional." }
        sha256: { type: string, description: Files only. Hex SHA-256 of the contents. }
        created_at: { type: string, format: date-time }
        modified_at: { type: string, format: date-time }
        role:
          type: string
          enum: [viewer, commenter, contributor, editor, manager]
          description: The caller's effective role on the node. Set by stat, listings and the shared list; an account key gets manager.
        no_download: { type: boolean, description: The node's own no-download setting. It also reaches the subtree. }
        editors_can_share: { type: boolean, description: The node's own setting letting editors share. It also reaches the subtree. }
        created_by: { type: string, description: "The ID of the user, or of the key, that made the node." }
        created_by_name: { type: string, description: "The maker's display name, for a caller of the account who reaches the node. Absent for a link visitor, an installation admin, a deleted user or a user with no display name." }
        owner_name: { type: string, description: "The owner's display name, under the same rule as created_by_name. Absent when there is no owner." }
        owner_id: { type: string, description: "The ID of the user that owns the node." }
        has_link: { type: boolean, description: "Set in a listing of children, and omitted when false: the item carries a link the caller may know of. A visitor never gets it." }
        has_thumbnail: { type: boolean, description: "On an image file (JPEG, PNG or GIF): true when its smallest thumbnail is ready, false when not. Absent for other kinds, and absent for a link visitor." }
        starred: { type: boolean, description: "The caller's own star on the node. Set for a signed-in user and for a token acting as its user, on stat, listings and the shared list, false when not starred. Absent for keys, admins and link visitors." }
        color: { type: string, description: "A directory's palette colour; absent when none, and absent for a link visitor." }
        description: { type: string, description: "The item's plain-text description; absent when none, and absent for a link visitor." }
        target:
          type: object
          description: "A shortcut's target, for a caller who reaches it. Absent otherwise, and never shown to a caller who does not. A link visitor gets no target."
          properties:
            id: { type: string }
            kind: { type: string, enum: [file, dir] }
        unavailable: { type: boolean, description: "Set on a shortcut whose target the caller cannot reach or that was purged. It says nothing about why, and the target's ID is never shown." }

    StarredItem:
      description: A starred node, with when the caller starred it.
      allOf:
        - $ref: "#/components/schemas/Node"
        - type: object
          required: [starred_at]
          properties:
            starred_at: { type: string, format: date-time }

    StarredList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/StarredItem" }
        next_cursor: { type: string }

    RecentItem:
      description: A node in the caller's recent list. `viewed_at` and `edited_at` are null when that did not happen.
      allOf:
        - $ref: "#/components/schemas/Node"
        - type: object
          required: [last_at, viewed_at, edited_at]
          properties:
            viewed_at: { type: [string, "null"], format: date-time }
            edited_at: { type: [string, "null"], format: date-time }
            last_at: { type: string, format: date-time, description: The later of the view and the edit. }

    RecentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RecentItem" }
        next_cursor: { type: string }

    SharedItem:
      description: A node shared with the caller. `shared_at` is set with `order=recent`.
      allOf:
        - $ref: "#/components/schemas/Node"
        - type: object
          properties:
            shared_at: { type: string, format: date-time }

    SharedList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SharedItem" }
        next_cursor: { type: string }

    NodeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Node" }
        next_cursor: { type: string }

    DirectoryCreate:
      type: object
      required: [path]
      additionalProperties: false
      properties:
        path: { type: string, maxLength: 4096, description: "Relative to the folder's root, e.g. /a/b." }
        parents: { type: boolean, default: false }

    TrashItem:
      description: A node in the trash, with what the trash keeps about it.
      allOf:
        - $ref: "#/components/schemas/Node"
        - type: object
          required: [trashed_at, trashed_by, original_parent_id, purge_at]
          properties:
            trashed_at: { type: string, format: date-time }
            trashed_by: { type: string, description: "The ID of the user, or of the key, that trashed it." }
            original_parent_id: { type: string, description: "The directory the item was in. It may itself be in the trash." }
            purge_at: { type: string, format: date-time, description: "When the retention sweep purges it: `trashed_at` plus `trash.retention`." }

    TrashList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TrashItem" }
        next_cursor: { type: string }

    Version:
      type: object
      description: |
        An earlier content of a file. `current` is true only for the current content in a listing, which
        is then listed with the id `current`, and has no `replaced_at`, `replaced_by`, `label` or `keep_forever`.
      required: [id, current, size, etag, created_at, label, keep_forever]
      properties:
        id: { type: string, description: "`ver_...`, or `current` for the current content." }
        current: { type: boolean }
        size: { type: integer, minimum: 0 }
        mime_type: { type: string }
        etag: { type: string }
        sha256: { type: string }
        created_at: { type: string, format: date-time, description: When this content was first written. }
        created_by: { type: string }
        replaced_at: { type: string, format: date-time, description: When it stopped being the current content. }
        replaced_by: { type: string }
        label: { type: [string, "null"], maxLength: 100 }
        keep_forever: { type: boolean }

    VersionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Version" }
        next_cursor: { type: string }

    VersionUpdate:
      type: object
      description: At least one field is required.
      properties:
        label: { type: [string, "null"], maxLength: 100, description: Empty or null removes the label. }
        keep_forever: { type: boolean }

    NodeUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        no_download: { type: boolean }
        editors_can_share: { type: boolean }
        color:
          type: [string, "null"]
          description: A palette name for a directory, or null or "" to clear it. Needs the editor role.
          enum: [red, orange, yellow, green, teal, blue, indigo, purple, pink, brown, slate, grey, null]
        description:
          type: [string, "null"]
          description: Plain text, at most 1000 characters; control characters other than line breaks are removed. Empty or null clears it. Needs the editor role.

    Transfer:
      type: object
      additionalProperties: false
      properties:
        folder: { type: string, description: The target folder; default the node's own. }
        parent: { type: string, description: A directory of the target folder. Not with path. }
        path: { type: string, description: "A directory of the target folder, e.g. /a. Not with parent." }
        name: { type: string, minLength: 1, maxLength: 255, description: A new name. }
        on_conflict:
          type: string
          enum: [fail, rename, replace]
          default: fail

    FolderList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Folder" }
        next_cursor: { type: string }

    FolderDetail:
      allOf:
        - $ref: "#/components/schemas/Folder"
        - type: object
          required: [files, bytes]
          properties:
            files: { type: integer, format: int64, description: The files in the folder's tree, versions aside. }
            bytes: { type: integer, format: int64, description: The bytes of those files and of their earlier versions. }

    FolderAccess:
      allOf:
        - $ref: "#/components/schemas/Folder"
        - type: object
          required: [access, role]
          properties:
            hidden:
              type: boolean
              description: True when the caller has hidden this team space from its own list. Hiding changes nothing about access.
            access:
              type: string
              enum: [read, write]
              description: The grants-route level of the caller on the folder. Viewer and commenter read; the others write.
            role:
              type: string
              enum: [viewer, commenter, contributor, editor, manager]
              description: The caller's role on the folder's root.

    FolderAccessList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FolderAccess" }
        next_cursor: { type: string }

    Group:
      type: object
      required: [id, external_id, name, created_at, updated_at]
      properties:
        id: { type: string, example: grp_5m2k8x1v0c3d9q7r4t6w8y0z2a }
        external_id:
          type: [string, "null"]
          description: The client's own reference; unique within the account.
        name: { type: string, description: The name in Unicode NFC. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    GroupCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        external_id: { type: string, maxLength: 255 }

    GroupUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        external_id: { type: string, maxLength: 255, description: Empty clears it. }

    GroupList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Group" }
        next_cursor: { type: string }

    GroupMember:
      type: object
      required: [user_id, created_at]
      properties:
        user_id: { type: string, example: usr_5m2k8x1v0c3d9q7r4t6w8y0z2a }
        created_at: { type: string, format: date-time }

    GroupMemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GroupMember" }
        next_cursor: { type: string }

    Permission:
      type: object
      required: [subject_kind, subject_id, role, inherited_from, created_at, created_by]
      properties:
        subject_kind: { type: string, enum: [user, group] }
        subject_id: { type: string, description: A user (usr_...) or a group (grp_...). }
        role: { type: string, enum: [viewer, commenter, contributor, editor, manager] }
        inherited_from:
          type: [string, "null"]
          description: The ancestor node the permission sits on. Null when it sits on the node itself.
        expires_at:
          type: [string, "null"]
          format: date-time
          description: When the permission ends, or null for one that never ends. Expired ones grant nothing.
        created_at: { type: string, format: date-time }
        created_by: { type: string, description: The ID of the caller who made or last changed it. }
        subject_name:
          type: string
          description: The user's display name or email, or the group's name. Shown to a manager or an account key only.
        subject_status:
          type: string
          enum: [pending, active, disabled]
          description: A user subject's status. Shown to a manager or an account key only.

    ShareLink:
      type: object
      required: [id, node_id, audience, role, created_at, inherited_from]
      properties:
        id: { type: string, description: A shl_ ID. }
        node_id: { type: string }
        audience: { type: string, enum: [organisation, anyone] }
        role: { type: string, description: "The role a visitor holds on the node and below: viewer, commenter, contributor or editor. Empty for a drop link." }
        upload_only: { type: boolean, description: "A drop link: its visitors upload into the node and reach nothing else." }
        title: { type: string, description: "A drop link's title, shown to its visitors." }
        message: { type: string, description: "A drop link's message, shown to its visitors." }
        ask_name: { type: boolean, description: "A drop link asks its visitors for a name and an email." }
        notify: { type: boolean, description: "Sharers only, on a drop link: the creator is mailed when files arrive." }
        expires_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        inherited_from:
          type: [string, "null"]
          description: The node the link sits on, when that is not the node asked about. Null on the node itself.
        created_by: { type: string, description: "Sharers only: the user or account key that made the link." }
        visitors: { type: integer, description: "Sharers only: members who hold a live visit to the link." }
        paused: { type: boolean, description: "Sharers only: true while policy pauses the link, so it grants nothing." }
        password_set: { type: boolean, description: "Sharers only: an anyone link has a password. The password itself is never shown." }

    ShareLinkList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ShareLink" }

    AccountShareLink:
      type: object
      description: "A live link of the account, with its item and folder. Item fields are null, and hidden is true, where the caller may not see the item."
      required: [id, node_id, audience, role, upload_only, created_at, paused, password_set, created_by, created_by_kind, folder_id, folder_kind, hidden]
      properties:
        id: { type: string, description: A shl_ ID. }
        node_id: { type: string, description: "The item's node ID; empty when hidden." }
        audience: { type: string, enum: [organisation, anyone] }
        role: { type: string, description: "viewer, commenter, contributor or editor; empty for a drop link." }
        upload_only: { type: boolean }
        expires_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        paused: { type: boolean, description: "True while policy pauses the link, or its item or an ancestor is in the trash." }
        password_set: { type: boolean }
        created_by: { type: string, description: "The user or account key that made the link." }
        created_by_kind: { type: string, enum: [user, account_key] }
        created_by_name: { type: string, description: "The creating user's name, or its email when it has no name; empty for an account key." }
        visitors: { type: integer, description: "Organisation links only: members who hold a live visit." }
        folder_id: { type: string }
        folder_kind: { type: string, enum: [team, personal] }
        folder_name: { type: string, description: "A team space's name; empty for a personal folder." }
        folder_owner_id: { type: string, description: "A personal folder's owner; empty for a team space." }
        folder_owner_name: { type: string, description: "A personal folder's owner's name, or email when it has no name." }
        item_name: { type: [string, "null"] }
        item_path: { type: [string, "null"], description: "The item's path from the folder's root, such as /a/b." }
        hidden: { type: boolean, description: "True where the caller may not see the item: an owner, for an item in another member's My files, or an admin, for every item." }

    AccountShareLinkList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AccountShareLink" }
        next_cursor: { type: string }

    PublicLinksDeleted:
      type: object
      required: [deleted]
      additionalProperties: false
      properties:
        deleted: { type: integer, minimum: 0, description: "How many anyone links were deleted." }

    ShareLinkCreate:
      type: object
      required: [audience]
      additionalProperties: false
      properties:
        audience: { type: string, enum: [organisation, anyone] }
        role: { type: string, enum: [viewer, commenter, contributor, editor], description: "Defaults to viewer. An anyone link gives viewer only." }
        upload_only: { type: boolean, description: "A drop link: uploads into a directory only. Needs audience anyone and no role." }
        title: { type: string, maxLength: 100, description: "Drop links only. One line; line breaks are removed." }
        message: { type: string, maxLength: 1000, description: "Drop links only. One line; line breaks are removed." }
        ask_name: { type: boolean, description: "Drop links only. The visitor must give a name and an email." }
        notify: { type: boolean, description: "Drop links only. Mail the creator, at most once an hour, when files arrive." }
        expires_at:
          type: [string, "null"]
          format: date-time
          description: "An anyone link ends: the default is 30 days from now, and the longest is 365 days (and sharing.max_expiry when that is set). An organisation link may have no end. A drop link must end: null is refused."
        password:
          type: string
          minLength: 8
          maxLength: 256
          description: "Anyone links only. Empty or absent means no password. Stored as an argon2id hash and never shown back."

    ShareLinkUpdate:
      type: object
      additionalProperties: false
      properties:
        audience: { type: string, enum: [organisation, anyone], description: "Switching to anyone gives the viewer role and, when the link has no end, the default end. Switching to organisation clears the password and ends the anyone visitors." }
        role: { type: string, enum: [viewer, commenter, contributor, editor] }
        upload_only: { type: boolean, description: "Must match the link: a link does not change into a drop link or back." }
        title: { type: string, maxLength: 100, description: "Drop links only." }
        message: { type: string, maxLength: 1000, description: "Drop links only." }
        ask_name: { type: boolean, description: "Drop links only." }
        notify: { type: boolean, description: "Drop links only." }
        expires_at: { type: [string, "null"], format: date-time, description: "Absent keeps the expiry; null clears it, which an anyone or a drop link refuses." }
        password:
          type: string
          maxLength: 256
          description: "Anyone links only. A new password, or empty to remove it. Visitors' credentials issued before the change stop working."

    ShareLinkCreated:
      type: object
      required: [link, url]
      properties:
        link: { $ref: "#/components/schemas/ShareLink" }
        url:
          type: string
          description: The address that opens the link, with the secret in its fragment. Shown here only.

    Comment:
      type: object
      description: |
        One comment. Its body is plain text: a client shows it as text, never as HTML. A tombstone (`deleted: true`) has
        no body, author or mentions.
      required: [id, created_at, mentions, resolved]
      properties:
        id: { type: string, example: "cmt_7k2m9q..." }
        parent_id: { type: string, description: The top-level comment this replies to. Absent on a top-level comment. }
        deleted: { type: boolean }
        body: { type: string, minLength: 1, maxLength: 2000 }
        mine: { type: boolean, description: Set on the caller's own comment. }
        author_name: { type: string, description: The author's display name. Absent when the user has none. }
        author_gone: { type: boolean, description: "The author's user was deleted: show \"former member\", translated." }
        created_at: { type: string, format: date-time }
        edited_at: { type: string, format: date-time }
        mentions:
          type: array
          description: The people the comment names, who reached the node when it was written. Names only.
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
        resolved: { type: boolean, description: "Set on a top-level comment. Always false on a reply." }
        resolved_at: { type: string, format: date-time }
        resolved_by_name: { type: string }
        resolved_by_gone: { type: boolean }
        reply_count: { type: integer, minimum: 0 }
        replies:
          type: array
          description: The first replies of a top-level comment, oldest first. Absent on a reply.
          items: { $ref: "#/components/schemas/Comment" }
        replies_more: { type: boolean, description: "More replies exist; list them with ?parent= on the comments route." }

    CommentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Comment" }
        next_cursor: { type: string }

    CommentCreate:
      type: object
      required: [body]
      additionalProperties: false
      properties:
        body: { type: string, minLength: 1, maxLength: 2000, description: Plain text. No control or bidi control character. }
        parent_id: { type: string, description: A top-level comment of the node, to reply to. }
        mentions:
          type: array
          maxItems: 10
          items: { type: string, description: A reference from the people list for this node. }

    CommentEdit:
      type: object
      required: [body]
      additionalProperties: false
      properties:
        body: { type: string, minLength: 1, maxLength: 2000, description: Plain text. No control or bidi control character. }

    CommentResolve:
      type: object
      required: [resolved]
      additionalProperties: false
      properties:
        resolved: { type: boolean }

    Person:
      type: object
      required: [ref, name]
      properties:
        ref: { type: string, description: "Names this person in a comment on this node only. Not a user ID." }
        name: { type: string }

    PersonList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/Person" }

    SharingPolicy:
      type: object
      required: [public_links, anyone_links, comments]
      additionalProperties: false
      properties:
        public_links: { type: boolean, description: Links that anyone can open are allowed in the account. }
        anyone_links:
          type: integer
          minimum: 0
          description: How many of the account's links that anyone can open have not ended, live or paused by public_links.
        comments: { type: boolean, description: "Comments are on in the account. Off refuses every comment route and keeps the comments (decision 39). Default on." }

    SharingPolicyUpdate:
      type: object
      description: Either switch may be given alone.
      additionalProperties: false
      properties:
        public_links: { type: boolean, description: Links that anyone can open are allowed in the account. }
        comments: { type: boolean, description: Comments are on in the account. }

    PermissionSet:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role: { type: string, enum: [viewer, commenter, contributor, editor, manager] }
        expires_at:
          type: [string, "null"]
          format: date-time
          description: Optional end of the permission. Must be in the future and within sharing.max_expiry.
        notify:
          type: boolean
          default: true
          description: Whether the subject is mailed about the change.
        message:
          type: string
          maxLength: 500
          description: A note for the mail, shown verbatim as plain text.

    PermissionChange:
      allOf:
        - $ref: "#/components/schemas/Permission"
        - type: object
          required: [notified]
          properties:
            notified:
              type: boolean
              description: True when every subject that should be told was mailed.
            reason:
              type: string
              description: Why a subject was not mailed, when it was not. One of not_requested, no_recipients, recipient_not_active, too_many_recipients, mail_budget, mail_failed, mail_not_configured.

    PermissionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
        next_cursor: { type: string }

    Grant:
      type: object
      required: [level, created_at, created_by]
      properties:
        folder_id: { type: string, description: Set in a user's grant list. }
        user_id: { type: string, description: Set in a folder's grant list. }
        level: { type: string, enum: [read, write] }
        created_at: { type: string, format: date-time }
        created_by: { type: string, description: The ID of the caller who made or last changed the grant. }

    GrantSet:
      type: object
      required: [level]
      additionalProperties: false
      properties:
        level: { type: string, enum: [read, write] }

    GrantList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Grant" }

    Status:
      type: object
      required: [status]
      properties:
        status: { type: string, example: ok }

    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          description: One entry per check (database, data_dir, disk_free).
          additionalProperties:
            type: string
            enum: [ok, failed, unknown]

    Info:
      type: object
      required: [name, version, public_url, web_interface, brand, password_min_length, limits, sharing_max_expiry_days, features]
      properties:
        name: { type: string, example: Selfcloud }
        version: { type: string, example: 0.1.0 }
        public_url:
          type: string
          format: uri
          description: The address clients reach the server at.
          example: https://drive.example.com
        web_interface:
          type: boolean
          description: Whether this server also serves its web interface.
        brand: { $ref: "#/components/schemas/Brand" }
        password_min_length:
          type: integer
          minimum: 1
          description: The shortest password the server accepts, in characters. Clients check new passwords against it.
          example: 8
        limits: { $ref: "#/components/schemas/Limits" }
        sharing_max_expiry_days:
          type: integer
          minimum: 0
          description: The longest a share may run, in whole days (rounded up). Zero means no cap. Set by `sharing.max_expiry`. A share's `expires_at` may be at most this far ahead.
          example: 365
        features:
          type: array
          description: Optional features this server has enabled.
          items: { type: string }

    DirectoryEntry:
      type: object
      description: A person or a group found by `GET /directory`. Nothing else about it is returned.
      required: [id, kind, name]
      properties:
        id: { type: string, example: usr_k3j9xq2w7d1m }
        kind: { type: string, enum: [user, group] }
        name: { type: string, description: The user's display name, or its email when it has none; the group's name. }
        email: { type: string, format: email, description: Set for a user only. }

    Brand:
      type: object
      description: The installation's look. The same for every user.
      required: [name, accent, logo_url]
      properties:
        name:
          type: string
          description: The product name, shown in the web interface's header and title.
          example: Selfcloud
        accent:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
          description: The primary colour, as #rrggbb. The web interface derives the accent family from it, unless a token below is set.
          example: "#053D8E"
        logo_url:
          type: [string, "null"]
          description: The logo's URL (`/brand/logo`), or null when the installation has none. The file's path is never sent.
        palette:
          type: object
          description: The colour tokens the installation overrides, one set per theme. Absent when it overrides none; a theme with no override is absent too. Each token is #rrggbb.
          properties:
            light: { $ref: "#/components/schemas/BrandTokens" }
            dark: { $ref: "#/components/schemas/BrandTokens" }
        sidebar:
          type: object
          description: The sidebar's colours that the installation overrides, as #rrggbb. Absent when it overrides none.
          properties:
            bg: { $ref: "#/components/schemas/Hex" }
            text: { $ref: "#/components/schemas/Hex" }
            caption: { $ref: "#/components/schemas/Hex" }
            active: { $ref: "#/components/schemas/Hex" }
            on_active: { $ref: "#/components/schemas/Hex" }

    Hex:
      type: string
      pattern: "^#[0-9a-fA-F]{6}$"

    BrandTokens:
      type: object
      description: The accent tokens one theme overrides, each as #rrggbb.
      properties:
        accent: { $ref: "#/components/schemas/Hex" }
        accent_fill: { $ref: "#/components/schemas/Hex" }
        accent_fill_hover: { $ref: "#/components/schemas/Hex" }
        accent_fill_active: { $ref: "#/components/schemas/Hex" }
        accent_text: { $ref: "#/components/schemas/Hex" }
        accent_soft: { $ref: "#/components/schemas/Hex" }
        accent_border: { $ref: "#/components/schemas/Hex" }

    QuotaWarning:
      type: object
      description: The share of the account's quota, and of each user's limit, at which quota.warning is sent.
      required: [percent]
      properties:
        percent: { type: integer, minimum: 1, maximum: 99, example: 80 }

    QuotaEventData:
      description: |
        The data of quota.warning and quota.exceeded (decision 30). `scope` is `account`, or `user` for a user's limit on
        its personal folder, and then `id` is the user's ID. `used_bytes` is what the quota counts: used plus reserved.
        `percent` is the level: the account's setting for quota.warning, and 100 for quota.exceeded. No file or folder
        name is in the event.
      type: object
      required: [scope, id, percent, used_bytes, limit_bytes]
      properties:
        scope: { type: string, enum: [account, user] }
        id: { type: string, example: usr_5m2k8x1v0c3d9q7r4t6w8y0z2a }
        percent: { type: integer, example: 80 }
        used_bytes: { type: integer, format: int64 }
        limit_bytes: { type: integer, format: int64 }

    Limits:
      type: object
      required: [max_file_size, max_chunk_size]
      properties:
        max_file_size:
          type: integer
          format: int64
          description: Largest file accepted, in bytes.
        max_chunk_size:
          type: integer
          format: int64
          description: Largest upload request body accepted, in bytes.

    Webhook:
      type: object
      required: [id, url, events, state, consecutive_failures, created_at, updated_at]
      description: An endpoint. Never carries its secret.
      properties:
        id: { type: string, example: whk_5m2k8x1v0c3d9q7r4t6w8y0z2a }
        url: { type: string, description: "The full URL for the account key. An owner gets only the scheme, host and port." }
        description: { type: [string, "null"], maxLength: 200 }
        events:
          type: array
          items: { type: string, enum: [user.created, user.verified, file.created, file.updated, file.deleted, file.moved, file.restored, upload.completed, quota.warning, quota.exceeded, webhook.test] }
        state: { type: string, enum: [active, paused, disabled] }
        disabled_reason: { type: [string, "null"], enum: [failing, overflow, secret_unreadable, null] }
        consecutive_failures: { type: integer }
        last_success_at: { type: [string, "null"], format: date-time }
        last_failure_at: { type: [string, "null"], format: date-time }
        previous_secret_until: { type: [string, "null"], format: date-time, description: "When the secret a rotation replaced stops signing. Null once that time has passed, and when no rotation is in its grace period." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WebhookShown:
      type: object
      required: [secret]
      description: An endpoint with its secret. Shown once, at creation and at rotation.
      allOf:
        - $ref: "#/components/schemas/Webhook"
      properties:
        secret: { type: string, description: "The signing secret, shown once: whsec_ and 43 base64url characters." }

    WebhookCreate:
      type: object
      required: [url, events]
      additionalProperties: false
      properties:
        url: { type: string, maxLength: 2048 }
        events:
          type: array
          minItems: 1
          uniqueItems: false
          items: { type: string, enum: [user.created, user.verified, file.created, file.updated, file.deleted, file.moved, file.restored, upload.completed, quota.warning, quota.exceeded, webhook.test] }
        description: { type: string, maxLength: 200 }

    WebhookUpdate:
      type: object
      additionalProperties: false
      properties:
        url: { type: string, maxLength: 2048 }
        events:
          type: array
          minItems: 1
          items: { type: string, enum: [user.created, user.verified, file.created, file.updated, file.deleted, file.moved, file.restored, upload.completed, quota.warning, quota.exceeded, webhook.test] }
        description: { type: string, maxLength: 200, description: Empty clears it. }
        state: { type: string, enum: [active, paused], description: A disabled endpoint cannot be set to active alone. }

    WebhookList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Webhook" }
        next_cursor: { type: string }

    WebhookDetail:
      type: object
      description: An endpoint with its newest five deliveries. Never carries its secret.
      allOf:
        - $ref: "#/components/schemas/Webhook"
      required: [recent_deliveries]
      properties:
        recent_deliveries:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/WebhookDelivery" }

    WebhookDelivery:
      type: object
      required: [id, event_id, type, state, attempts, next_attempt_at, created_at]
      properties:
        id: { type: string, example: dlv_5m2k8x1v0c3d9q7r4t6w8y0z2a }
        event_id: { type: string, example: evt_5m2k8x1v0c3d9q7r4t6w8y0z2a }
        type: { type: string }
        state: { type: string, enum: [pending, delivered, failed] }
        attempts: { type: integer }
        last_code: { type: [integer, "null"], description: "The HTTP status of the last answer, when there was one." }
        last_error: { type: [string, "null"], description: "A fixed token, never a URL or a body. At most 200 characters." }
        next_attempt_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }

    WebhookDeliveryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/WebhookDelivery" }
        next_cursor: { type: string }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message:
              type: string
              description: English text for logs and developers; clients translate by code.
            details:
              type: object
              description: |
                Numbers for the client's message: `limit_bytes` (too_large),
                `max_chunk_size` (chunk_too_large), `required_bytes` and `available_bytes`
                (quota_exceeded, storage_full). `scope` says which limit refused the write:
                for quota_exceeded `quota` or `account_reservations` (the account's) or `user`
                (a member's own limit on its My files); for storage_full `server` or `account`;
                for too_many_uploads `caller`, `account` or `link`. The numbers of a quota_exceeded
                refusal are sent only where the operation says who learns them. `reason` says why a
                conflict, forbidden or other refusal was made, and each operation names its reasons:
                for example `limit`, `name_taken`, `type_locked`, `restricted_label`, `last_owner`,
                `last_admin`, `self`, `signed_in_as_other`, `too_many_copies`.
              additionalProperties: true
            request_id: { type: string }

    ErrorCode:
      type: string
      description: |
        | Code | Status | Meaning |
        |---|---|---|
        | invalid_request, invalid_path, invalid_name | 400 | Malformed request, path or name. |
        | unauthenticated | 401 | No valid credential; sign in again. |
        | token_expired | 401 | Delegated token expired; refresh it and retry. |
        | forbidden | 403 | The caller may not do this. |
        | download_restricted | 403 | The no-download rule forbids this download, signed link or copy. Inline viewing, where the type allows it, still works. |
        | account_suspended, user_not_verified, user_disabled | 403 | Account or user state blocks access. |
        | not_found | 404 | No such resource, or the caller may not know it exists. |
        | conflict | 409 | Name taken, duplicate external_id, or a concurrent upload. |
        | upload_offset_mismatch | 409 | Upload-Offset differs from the server's. |
        | locked | 409 | Locked by an office editor. |
        | upload_expired | 410 | The upload expired; start again. |
        | link_expired | 410 | The signed link's time has run out; ask for a new one. |
        | unsupported_media_type | 415 | A tus piece must be application/offset+octet-stream. |
        | too_many_uploads | 429 | The caller, the account or the drop link holds the most unfinished uploads it may; `details.scope` (`caller`, `account`, `link`) says which. |
        | precondition_required | 428 | A write that needs If-Match sent none. |
        | precondition_failed | 412 | Stale ETag in If-Match. |
        | too_large | 413 | File over the size limit. |
        | chunk_too_large | 413 | Upload request over the size limit. |
        | range_not_satisfiable | 416 | Range outside the file. |
        | rate_limited | 429 | Slow down; see Retry-After. |
        | checksum_mismatch | 460 | Piece failed its Upload-Checksum. |
        | internal | 500 | Server fault; quote request_id. |
        | unavailable | 503 | Shutting down or in maintenance; see Retry-After. |
        | quota_exceeded | 507 | The write would take the account past its quota, past its reservation cap when it has no quota, or a member's My files past its own limit. `required_bytes`, `available_bytes`, `scope` (`quota`, `account_reservations`, `user`). The numbers go only where the operation says who learns them (design section 8, "Who learns the numbers"). For a drop link's visitor: the same code with the message "this link cannot take the file now" and no details. |
        | storage_full | 507 | The disk cannot hold the open uploads, or this account's share of them. `required_bytes`, `available_bytes`, `scope` (`server`, `account`). For a drop link's visitor: `quota_exceeded` with the generic message, as above. |
      enum:
        - invalid_request
        - invalid_path
        - invalid_name
        - unauthenticated
        - token_expired
        - forbidden
        - download_restricted
        - account_suspended
        - user_not_verified
        - user_disabled
        - not_found
        - conflict
        - upload_offset_mismatch
        - locked
        - upload_expired
        - link_expired
        - unsupported_media_type
        - too_many_uploads
        - precondition_failed
        - precondition_required
        - too_large
        - chunk_too_large
        - range_not_satisfiable
        - rate_limited
        - checksum_mismatch
        - internal
        - unavailable
        - quota_exceeded
        - storage_full

    SignedLink:
      type: object
      required: [url, disposition, expires_at]
      properties:
        url:
          type: string
          description: The absolute link. It is a credential; do not log it.
        disposition: { type: string, enum: [attachment, inline] }
        expires_at: { type: string, format: date-time }

    Account:
      type: object
      required: [id, external_id, name, status, quota_bytes, used_bytes, used_files, created_at, updated_at]
      properties:
        id: { type: string, example: acc_5m2k8x1v0c3d9q7r4t6w8y0z2a }
        external_id:
          type: [string, "null"]
          description: The client's own reference; unique among accounts.
        name: { type: string }
        status:
          type: string
          enum: [active, suspended, deleting]
        quota_bytes:
          type: integer
          format: int64
          description: Storage quota; 0 means unlimited.
        used_bytes: { type: integer, format: int64 }
        used_files: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AccountCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        external_id: { type: string, maxLength: 255 }
        quota_bytes: { type: integer, format: int64, minimum: 0, default: 0 }
        owner: { $ref: "#/components/schemas/OwnerCreate" }

    OwnerCreate:
      type: object
      required: [email, verification]
      additionalProperties: false
      description: The account's first owner, created with it. Verification is `email`, `link` or `none`. A session cannot use `none`. A session may use `link` only for an owner, and only an admin session may do that.
      properties:
        email: { type: string, format: email, maxLength: 254 }
        display_name: { type: string, maxLength: 200 }
        locale:
          type: string
          maxLength: 35
          default: en
          description: |
            A BCP 47-style tag, stored as given. Rendering resolves it: the exact tag if it is one of the
            seven languages, then its base language (`pt-BR` is `pt`), then English. The seven are `en`,
            `es`, `fr`, `pt` (European Portuguese), `ru`, `ar` and `he`.
        verification: { type: string, enum: [email, link, none] }

    AccountCreated:
      allOf:
        - $ref: "#/components/schemas/Account"
        - type: object
          properties:
            owner: { $ref: "#/components/schemas/UserWithVerification" }

    AdminCreate:
      type: object
      required: [email, verification]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        display_name: { type: string, maxLength: 200 }
        verification: { type: string, enum: [email, link], description: A session may use only email. }

    AdminList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/User" }
        next_cursor: { type: string }

    AccountUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        external_id: { type: string, maxLength: 255, description: An empty string clears it. }
        quota_bytes: { type: integer, format: int64, minimum: 0 }
        status: { type: string, enum: [active, suspended] }

    AccountList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Account" }
        next_cursor: { type: string, description: Absent on the last page. }

    StoragePolicy:
      type: object
      required: [user_quota_bytes]
      properties:
        user_quota_bytes: { type: integer, format: int64, minimum: 0, description: The default limit for each user; 0 is none. }
    AccountStorage:
      type: object
      required: [account, folders]
      properties:
        account:
          type: object
          required: [used_bytes, reserved_bytes, quota_bytes, available_bytes, user_quota_bytes]
          properties:
            used_bytes: { type: integer, format: int64 }
            reserved_bytes: { type: integer, format: int64 }
            quota_bytes: { type: [integer, "null"], format: int64 }
            available_bytes: { type: [integer, "null"], format: int64 }
            user_quota_bytes: { type: integer, format: int64, description: The default limit for each user; 0 is none. }
        folders:
          type: array
          items:
            type: object
            required: [id, kind, used_bytes, used_files, reserved_bytes]
            properties:
              id: { type: string }
              name: { type: string, description: Absent for an admin. }
              kind: { type: string, enum: [team, personal] }
              used_bytes: { type: integer, format: int64 }
              used_files: { type: integer, format: int64 }
              reserved_bytes: { type: integer, format: int64 }
        users:
          type: array
          description: Owner and key only, heaviest first. A member's file names are never sent.
          items:
            type: object
            required: [id, display_name, email, status, used_bytes, reserved_bytes, quota_bytes, effective_quota_bytes]
            properties:
              id: { type: string }
              display_name: { type: string }
              email: { type: string }
              status: { type: string }
              used_bytes: { type: integer, format: int64 }
              reserved_bytes: { type: integer, format: int64 }
              quota_bytes: { type: [integer, "null"], format: int64 }
              effective_quota_bytes: { type: [integer, "null"], format: int64 }
        users_next_cursor: { type: string, description: Present when another page follows. }
    LargeFiles:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, name, size, versions_bytes, in_trash, modified_at]
            properties:
              id: { type: string }
              folder_id: { type: string, description: Account listing only. }
              folder_name: { type: string, description: Account listing only. }
              name: { type: string }
              size: { type: integer, format: int64 }
              versions_bytes: { type: integer, format: int64 }
              in_trash: { type: boolean }
              modified_at: { type: string, format: date-time }
        next_cursor: { type: string, description: Present when another page follows. }
    Usage:
      type: object
      required: [quota_bytes, used_bytes, reserved_bytes, available_bytes, files, folders, used_files, users_active, users_pending]
      properties:
        quota_bytes:
          type: [integer, "null"]
          format: int64
          description: The account's quota in bytes; null when the account is unlimited.
        used_bytes:
          type: integer
          format: int64
          description: The sizes of its files. A copy counts in full.
        reserved_bytes:
          type: integer
          format: int64
          description: The declared lengths of its unfinished uploads, held until each completes or ends.
        available_bytes:
          type: [integer, "null"]
          format: int64
          description: Quota less used and reserved bytes, never below zero; null when the quota is unlimited.
        files:
          type: integer
          format: int64
          description: How many files the account holds.
        folders:
          type: integer
          format: int64
          description: How many top-level folders it has.
        users_active:
          type: integer
          format: int64
          description: How many of its users may sign in (active).
        users_pending:
          type: integer
          format: int64
          description: How many of its users have not verified yet.
        used_files:
          type: integer
          format: int64
          description: The same as files. Kept for clients that already read it.

    Key:
      type: object
      required: [id, name, prefix, created_at, expires_at, revoked_at, last_used_at]
      properties:
        id: { type: string, example: key_5m2k8x1v0c3d9q7r4t6w8y0z2a }
        name: { type: string }
        prefix:
          type: string
          description: The start of the key, to tell keys apart.
          example: sc_acct_Xq3v9T
        created_at: { type: string, format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        last_used_at:
          type: [string, "null"]
          format: date-time
          description: Updated at most once a minute.

    KeyCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        expires_at: { type: string, format: date-time, description: Must be in the future. }

    KeyCreated:
      allOf:
        - $ref: "#/components/schemas/Key"
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: The secret. Shown only in this response.

    KeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Key" }

    TokenCreate:
      type: object
      additionalProperties: false
      description: |
        `folders` is required, unless `all` is true. `all: true` needs `user` and no `folders`: the
        token is all-reachable, reaching every folder the user reaches (team spaces the user holds,
        the user's My files), each capped at `permissions` and never above editor. All-reachable is
        never inferred from an empty list; a user with neither folders nor `all` is refused.
      properties:
        user:
          type: string
          description: A user of the account to act as. Must exist and be active.
        all:
          type: boolean
          default: false
          description: |
            Reach every folder `user` reaches. Needs `user`; refused with `folders`.
        folders:
          type: array
          minItems: 1
          maxItems: 32
          items: { type: string, example: fld_5m2k8x1v0c3d9q7r4t6w8y0z2a }
          description: |
            Folders of the account the token reaches. Duplicates are dropped. Required unless `all`
            is true; not allowed with `all`.
        path:
          type: string
          maxLength: 4096
          description: |
            A directory under the root of the one folder given, e.g. `/a/b`. The token is then
            confined to that directory and everything below it. Needs exactly one folder; not
            with `node`.
        node:
          type: string
          description: |
            A directory ID in one of the folders. The token is confined to it and everything below
            it. Not with `path`. A move or copy that carries an item into or out of the directory is refused.
        permissions:
          type: string
          enum: [read, write]
          default: read
          description: Write implies read.
        ttl:
          type: integer
          minimum: 60
          default: 900
          description: Seconds. A value above `tokens.max_ttl` is refused with its limit in `details.max_ttl_seconds`.
        audience:
          type: string
          enum: [api]
          default: api
          description: Only `api` is accepted; `wopi` is not available yet.

    TokenCreated:
      type: object
      required: [token, expires_at]
      properties:
        token:
          type: string
          description: The token. Shown only in this response.
        expires_at: { type: string, format: date-time }

    TokensRevoked:
      type: object
      required: [tokens_not_before]
      properties:
        tokens_not_before:
          type: string
          format: date-time
          description: Tokens issued at or before this time no longer work.

    AuditEntry:
      type: object
      required: [id, time, actor, action, target, ip, user_agent, outcome]
      properties:
        id: { type: string }
        time: { type: string, format: date-time }
        actor:
          type: object
          required: [kind, id]
          properties:
            kind:
              type: string
              description: admin_key, account_key, user, anonymous (a failed sign-in with no known user) or system.
            id: { type: string }
        action: { type: string, example: account.create }
        target: { type: string, description: The ID acted on. }
        ip: { type: string }
        user_agent: { type: string }
        outcome: { type: string, example: ok }
        details: { type: object, additionalProperties: true }

    AuditList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEntry" }
        next_cursor: { type: string }

    Job:
      type: object
      required: [id, kind, target, status, created_at, updated_at, finished_at]
      properties:
        id: { type: string, example: job_5m2k8x1v0c3d9q7r4t6w8y0z2a }
        kind: { type: string, example: account.delete }
        target: { type: string, description: "What the job acts on: an account, or for node.copy the new root node." }
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        error: { type: string, description: Why the job failed. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }

    User:
      type: object
      required: [id, external_id, email, display_name, locale, role, status, verified_at, quota_bytes, created_at, updated_at]
      properties:
        id: { type: string, example: usr_5m2k8x1v0c3d9q7r4t6w8y0z2a }
        external_id:
          type: [string, "null"]
          description: The client's own reference; unique within the account.
        email: { type: string, format: email }
        display_name: { type: string }
        locale: { type: string, example: en }
        role:
          type: string
          enum: [admin, owner, member]
        status:
          type: string
          enum: [pending, active, disabled]
        verified_at: { type: [string, "null"], format: date-time }
        quota_bytes:
          type: [integer, "null"]
          format: int64
          description: The user's own limit on its My files. Null follows the account's default; 0 is no limit.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    UserDetail:
      description: A user as one user route shows it, with the limit that applies to its My files.
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [effective_quota_bytes]
          properties:
            effective_quota_bytes:
              type: [integer, "null"]
              format: int64
              description: The limit that applies, its own or the account's default. Null means no limit.

    UserCreate:
      type: object
      required: [email, verification]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        display_name: { type: string, maxLength: 200 }
        locale:
          type: string
          maxLength: 35
          default: en
          description: |
            A BCP 47-style tag, stored as given. Rendering resolves it: the exact tag if it is one of the
            seven languages, then its base language (`pt-BR` is `pt`), then English. The seven are `en`,
            `es`, `fr`, `pt` (European Portuguese), `ru`, `ar` and `he`.
        role: { type: string, enum: [owner, member], default: member }
        external_id: { type: string, maxLength: 255 }
        verification:
          type: string
          enum: [email, link, none]
          description: See the operation. `none` is for account and admin keys only.

    UserUpdate:
      type: object
      additionalProperties: false
      properties:
        display_name: { type: string, maxLength: 200 }
        locale:
          type: string
          maxLength: 35
          description: |
            A BCP 47-style tag, stored as given. Rendering resolves it: the exact tag if it is one of the
            seven languages, then its base language (`pt-BR` is `pt`), then English. The seven are `en`,
            `es`, `fr`, `pt` (European Portuguese), `ru`, `ar` and `he`.
        role: { type: string, enum: [owner, member] }
        external_id: { type: string, maxLength: 255, description: An empty string clears it. }
        status: { type: string, enum: [active, disabled] }
        quota_bytes:
          type: [integer, "null"]
          minimum: 0
          description: |
            The user's own limit on its My files. null follows the account's default; 0 is no limit. An absent field
            is left as it is.

    UserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/User" }
        next_cursor: { type: string, description: Absent on the last page. }

    Verification:
      type: object
      required: [method]
      properties:
        method:
          type: string
          enum: [email, link]
        url:
          type: string
          format: uri
          description: For `link` only. The link to deliver; its token is in the fragment.
        token:
          type: string
          description: For `link` only. The token itself, shown once.
        expires_at:
          type: string
          format: date-time
          description: For `link` only.
        sent:
          type: boolean
          description: For `email` only. False when the mail could not be sent.

    UserWithVerification:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            verification: { $ref: "#/components/schemas/Verification" }

    VerificationRequest:
      type: object
      required: [method]
      additionalProperties: false
      properties:
        method: { type: string, enum: [email, link, none] }

    PasswordResetRequest:
      type: object
      required: [method]
      additionalProperties: false
      properties:
        method: { type: string, enum: [email, link] }

    VerifyRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token: { type: string, description: The token from the link's fragment. }
        password:
          type: string
          minLength: 8
          maxLength: 256
          description: Required when the user has no password yet.

    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email }
        password: { type: string }
        account:
          type: string
          description: The account to sign in to, when the email is in several.

    ForgotRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email: { type: string, format: email }
        account: { type: string, description: The account, when the email is in several. }

    ResetRequest:
      type: object
      required: [token, password]
      additionalProperties: false
      properties:
        token: { type: string }
        password: { type: string, minLength: 8, maxLength: 256 }

    SignInLinkRequest:
      type: object
      additionalProperties: false
      properties:
        next:
          type: string
          maxLength: 2048
          description: |
            The path to open after sign-in, such as `/files/x`. Optional; empty or absent means
            `/files`. Checked on the server: it must start with exactly one `/`, not be `//`, and
            have no backslash, scheme, host, control character or space.

    SignInLink:
      type: object
      required: [url, expires_at]
      properties:
        url:
          type: string
          description: |
            Absolute, from `users.sign_in_url_template` (default `{public_url}/sign-in#token={token}`).
            Carries only the token, in its fragment.
        expires_at: { type: string, format: date-time }

    SignInLinkRedeemRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token: { type: string, description: The token from the link's fragment. }
        confirm:
          type: boolean
          default: false
          description: |
            True to sign the browser in as the link's user although it is signed in as another user. Sent
            after the `409 signed_in_as_other` answer, once the person chooses to switch.

    SignInLinkSignedIn:
      allOf:
        - $ref: "#/components/schemas/SignedIn"
        - type: object
          required: [next]
          properties:
            next:
              type: string
              description: The path to open, from the link. Validated again by the page.

    PasswordChange:
      type: object
      required: [current_password, new_password]
      additionalProperties: false
      properties:
        current_password: { type: string }
        new_password: { type: string, minLength: 8, maxLength: 256 }

    SignedIn:
      type: object
      required: [user, csrf_token]
      properties:
        user: { $ref: "#/components/schemas/User" }
        csrf_token:
          type: string
          description: Send it as `X-CSRF-Token` on every request that changes state.

    MeUpdate:
      type: object
      additionalProperties: false
      properties:
        display_name: { type: string, maxLength: 200, description: Empty clears it. }
        locale:
          type: string
          maxLength: 35
          description: |
            A BCP 47-style tag, stored as given. Rendering resolves it: the exact tag if it is one of the
            seven languages, then its base language (`pt-BR` is `pt`), then English. The seven are `en`,
            `es`, `fr`, `pt` (European Portuguese), `ru`, `ar` and `he`.

    Me:
      type: object
      required: [user, account, csrf_token]
      properties:
        user: { $ref: "#/components/schemas/User" }
        account:
          description: The account of a tenant user; null for an installation admin.
          type: [object, "null"]
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        csrf_token: { type: string }
        storage:
          description: The caller's own My files against its limit. Absent for an installation admin.
          type: object
          required: [used_bytes, reserved_bytes, quota_bytes, available_bytes]
          properties:
            used_bytes: { type: integer, format: int64 }
            reserved_bytes: { type: integer, format: int64 }
            quota_bytes: { type: [integer, "null"], format: int64, description: The user's limit; null when there is none. }
            available_bytes: { type: [integer, "null"], format: int64, description: The limit less used and reserved, not below 0; null when there is none. }
        personal_folder_id:
          type: [string, "null"]
          description: The caller's "My files" folder. Null for an installation admin.
        public_links:
          type: boolean
          description: The account's switch for links that anyone can open. False for an installation admin.
