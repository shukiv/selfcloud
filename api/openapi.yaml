openapi: 3.1.0
info:
  title: Selfcloud API
  version: 0.1.0
  summary: The HTTP API of Selfcloud, a self-hosted drive.
  description: |
    The design behind this API is in docs/design.md.

    **Errors.** Every error is JSON with a stable `code` (see the `ErrorCode` schema). Clients
    act on the code, not on the HTTP status. `details` carries the numbers a client needs to
    word its own message.

    **Request IDs.** Every response carries an `X-Request-Id` header; error bodies repeat it
    as `request_id`.

    This document grows with each slice of the build. Only what it lists is implemented.
servers:
  - url: /
tags:
  - name: System
    description: Health, readiness, metrics and server facts.
  - name: Accounts
    description: |
      Accounts are tenants. Installation admin keys manage them; an account key manages one
      account's contents. Account IDs a caller may not manage are reported as `not_found`.
  - name: Jobs
    description: Background work started by a request that answered 202.

paths:
  /healthz:
    get:
      tags: [System]
      operationId: getHealthz
      summary: Liveness check
      description: Answers while the process runs, including during shutdown.
      responses:
        "200":
          description: The process is alive.
          headers:
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }

  /readyz:
    get:
      tags: [System]
      operationId: getReadyz
      summary: Readiness check
      description: |
        Checks that the database answers, that the data directory is writable, and that free
        disk is at least `storage.min_free`. During shutdown it answers 503 with an `Error`
        whose code is `unavailable`.
      responses:
        "200":
          description: Ready to serve.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "503":
          description: Not ready, or shutting down.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Readiness"
                  - $ref: "#/components/schemas/Error"

  /metrics:
    get:
      tags: [System]
      operationId: getMetrics
      summary: Prometheus metrics
      description: |
        Served here only when `metrics_listen` is not set; otherwise it is served on that
        address instead.
      responses:
        "200":
          description: Metrics in the Prometheus text format.
          content:
            text/plain:
              schema: { type: string }

  /api/v1/info:
    get:
      tags: [System]
      operationId: getInfo
      summary: Server facts and limits
      description: Clients read the upload limits here before uploading.
      responses:
        "200":
          description: Server facts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Info" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/openapi.yaml:
    get:
      tags: [System]
      operationId: getOpenAPI
      summary: This document
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/yaml:
              schema: { type: string }

  /api/v1/accounts:
    post:
      tags: [Accounts]
      operationId: createAccount
      summary: Create an account
      description: |
        Admin key only. With an `external_id`, repeating the request with the same fields
        returns the existing account with status 200 instead of creating another, so a retry
        after a timeout is safe. Different fields get `409 conflict`, with the existing
        account's ID in `details.id`.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountCreate" }
      responses:
        "201":
          description: Created.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "200":
          description: An account with this external_id and these fields already existed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        default: { $ref: "#/components/responses/Error" }
    get:
      tags: [Accounts]
      operationId: listAccounts
      summary: List accounts
      description: Admin key only. Oldest first.
      security: [{ bearer: [] }]
      parameters:
        - name: external_id
          in: query
          description: Only the account with this external ID.
          schema: { type: string }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: One page of accounts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountList" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/accounts/{acc}:
    parameters:
      - $ref: "#/components/parameters/acc"
    get:
      tags: [Accounts]
      operationId: getAccount
      summary: Get an account
      description: Admin key, or the account's own key.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [Accounts]
      operationId: updateAccount
      summary: Change an account
      description: |
        Admin key only. Only the fields given change. A quota below current usage is allowed:
        stored files stay, and new writes get `quota_exceeded` until usage drops. Suspending
        blocks all access to the account but keeps its data.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountUpdate" }
      responses:
        "200":
          description: The changed account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [Accounts]
      operationId: deleteAccount
      summary: Delete an account
      description: |
        Admin key only. Access ends at once; the account and everything in it are removed by a
        background job. Repeating the call returns the same job.
      security: [{ bearer: [] }]
      responses:
        "202":
          description: Deletion has started.
          headers:
            Location: { schema: { type: string }, description: The job's URL. }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/accounts/{acc}/usage:
    parameters:
      - $ref: "#/components/parameters/acc"
    get:
      tags: [Accounts]
      operationId: getUsage
      summary: Storage usage
      description: Admin key, or the account's own key.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Usage and quota.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usage" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/accounts/{acc}/keys:
    parameters:
      - $ref: "#/components/parameters/acc"
    post:
      tags: [Accounts]
      operationId: createKey
      summary: Create an account key
      description: Admin key only. The key is in this response and nowhere else.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeyCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeyCreated" }
        default: { $ref: "#/components/responses/Error" }
    get:
      tags: [Accounts]
      operationId: listKeys
      summary: List an account's keys
      description: Admin key only. Revoked keys are listed too.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The keys, oldest first. Secrets are never shown.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeyList" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/accounts/{acc}/keys/{key}:
    parameters:
      - $ref: "#/components/parameters/acc"
      - name: key
        in: path
        required: true
        schema: { type: string, example: key_5m2k8x1v0c3d9q7r4t6w8y0z2a }
    delete:
      tags: [Accounts]
      operationId: revokeKey
      summary: Revoke an account key
      description: Admin key only. The key stops working at once.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Revoked. }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/accounts/{acc}/audit:
    parameters:
      - $ref: "#/components/parameters/acc"
    get:
      tags: [Accounts]
      operationId: getAuditLog
      summary: The account's audit log
      description: Admin key, or the account's own key. Newest first.
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: One page of entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditList" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/jobs/{job}:
    parameters:
      - name: job
        in: path
        required: true
        schema: { type: string, example: job_5m2k8x1v0c3d9q7r4t6w8y0z2a }
    get:
      tags: [Jobs]
      operationId: getJob
      summary: Get a job
      description: Admin key, or the key of the account the job belongs to.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer <credential>`. Installation admin keys start with `sc_admin_`;
        account keys start with `sc_acct_`.

  parameters:
    acc:
      name: acc
      in: path
      required: true
      schema: { type: string, example: acc_5m2k8x1v0c3d9q7r4t6w8y0z2a }
    limit:
      name: limit
      in: query
      description: Page size.
      schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
    cursor:
      name: cursor
      in: query
      description: The `next_cursor` of the previous page.
      schema: { type: string }

  headers:
    X-Request-Id:
      description: The request's ID, also logged by the server.
      schema: { type: string, example: req_5m2k8x1v0c3d9q7r4t6w8y0z2a }

  responses:
    Error:
      description: An error. Act on `error.code`.
      headers:
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
        Retry-After:
          description: Seconds to wait, on `rate_limited` and `unavailable`.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Status:
      type: object
      required: [status]
      properties:
        status: { type: string, example: ok }

    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          description: One entry per check (database, data_dir, disk_free).
          additionalProperties:
            type: string
            enum: [ok, failed, unknown]

    Info:
      type: object
      required: [name, version, public_url, web_interface, limits, features]
      properties:
        name: { type: string, example: Selfcloud }
        version: { type: string, example: 0.1.0 }
        public_url:
          type: string
          format: uri
          description: The address clients reach the server at.
          example: https://drive.example.com
        web_interface:
          type: boolean
          description: Whether this server also serves its web interface.
        limits: { $ref: "#/components/schemas/Limits" }
        features:
          type: array
          description: Optional features this server has enabled.
          items: { type: string }

    Limits:
      type: object
      required: [max_file_size, max_chunk_size]
      properties:
        max_file_size:
          type: integer
          format: int64
          description: Largest file accepted, in bytes.
        max_chunk_size:
          type: integer
          format: int64
          description: Largest upload request body accepted, in bytes.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message:
              type: string
              description: English text for logs and developers; clients translate by code.
            details:
              type: object
              description: |
                Numbers for the client's message: `limit_bytes` (too_large),
                `max_chunk_size` (chunk_too_large), `required_bytes` and `available_bytes`
                (quota_exceeded).
              additionalProperties: true
            request_id: { type: string }

    ErrorCode:
      type: string
      description: |
        | Code | Status | Meaning |
        |---|---|---|
        | invalid_request, invalid_path, invalid_name | 400 | Malformed request, path or name. |
        | unauthenticated | 401 | No valid credential; sign in again. |
        | token_expired | 401 | Delegated token expired; refresh it and retry. |
        | forbidden | 403 | The caller may not do this. |
        | account_suspended, user_not_verified, user_disabled | 403 | Account or user state blocks access. |
        | not_found | 404 | No such resource, or the caller may not know it exists. |
        | conflict | 409 | Name taken, duplicate external_id, or a concurrent upload. |
        | upload_offset_mismatch | 409 | Upload-Offset differs from the server's. |
        | locked | 409 | Locked by an office editor. |
        | upload_expired | 410 | The upload expired; start again. |
        | precondition_failed | 412 | Stale ETag in If-Match. |
        | too_large | 413 | File over the size limit. |
        | chunk_too_large | 413 | Upload request over the size limit. |
        | range_not_satisfiable | 416 | Range outside the file. |
        | rate_limited | 429 | Slow down; see Retry-After. |
        | checksum_mismatch | 460 | Piece failed its Upload-Checksum. |
        | internal | 500 | Server fault; quote request_id. |
        | unavailable | 503 | Shutting down or in maintenance; see Retry-After. |
        | quota_exceeded | 507 | Account quota reached. |
        | storage_full | 507 | The server's disk is full. |
      enum:
        - invalid_request
        - invalid_path
        - invalid_name
        - unauthenticated
        - token_expired
        - forbidden
        - account_suspended
        - user_not_verified
        - user_disabled
        - not_found
        - conflict
        - upload_offset_mismatch
        - locked
        - upload_expired
        - precondition_failed
        - too_large
        - chunk_too_large
        - range_not_satisfiable
        - rate_limited
        - checksum_mismatch
        - internal
        - unavailable
        - quota_exceeded
        - storage_full

    Account:
      type: object
      required: [id, external_id, name, status, quota_bytes, used_bytes, used_files, created_at, updated_at]
      properties:
        id: { type: string, example: acc_5m2k8x1v0c3d9q7r4t6w8y0z2a }
        external_id:
          type: [string, "null"]
          description: The client's own reference; unique among accounts.
        name: { type: string }
        status:
          type: string
          enum: [active, suspended, deleting]
        quota_bytes:
          type: integer
          format: int64
          description: Storage quota; 0 means unlimited.
        used_bytes: { type: integer, format: int64 }
        used_files: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AccountCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        external_id: { type: string, maxLength: 255 }
        quota_bytes: { type: integer, format: int64, minimum: 0, default: 0 }

    AccountUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        external_id: { type: string, maxLength: 255, description: An empty string clears it. }
        quota_bytes: { type: integer, format: int64, minimum: 0 }
        status: { type: string, enum: [active, suspended] }

    AccountList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Account" }
        next_cursor: { type: string, description: Absent on the last page. }

    Usage:
      type: object
      required: [quota_bytes, used_bytes, used_files, reserved_bytes, available_bytes]
      properties:
        quota_bytes: { type: integer, format: int64, description: 0 means unlimited. }
        used_bytes: { type: integer, format: int64 }
        used_files: { type: integer, format: int64 }
        reserved_bytes:
          type: integer
          format: int64
          description: Held by uploads in progress.
        available_bytes:
          type: [integer, "null"]
          format: int64
          description: What new uploads may still use; null when the quota is unlimited.

    Key:
      type: object
      required: [id, name, prefix, created_at, expires_at, revoked_at, last_used_at]
      properties:
        id: { type: string, example: key_5m2k8x1v0c3d9q7r4t6w8y0z2a }
        name: { type: string }
        prefix:
          type: string
          description: The start of the key, to tell keys apart.
          example: sc_acct_Xq3v9T
        created_at: { type: string, format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        last_used_at:
          type: [string, "null"]
          format: date-time
          description: Updated at most once a minute.

    KeyCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        expires_at: { type: string, format: date-time, description: Must be in the future. }

    KeyCreated:
      allOf:
        - $ref: "#/components/schemas/Key"
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: The secret. Shown only in this response.

    KeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Key" }

    AuditEntry:
      type: object
      required: [id, time, actor, action, target, ip, user_agent, outcome]
      properties:
        id: { type: string }
        time: { type: string, format: date-time }
        actor:
          type: object
          required: [kind, id]
          properties:
            kind:
              type: string
              description: admin_key, account_key or system (more kinds come with users and tokens).
            id: { type: string }
        action: { type: string, example: account.create }
        target: { type: string, description: The ID acted on. }
        ip: { type: string }
        user_agent: { type: string }
        outcome: { type: string, example: ok }
        details: { type: object, additionalProperties: true }

    AuditList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEntry" }
        next_cursor: { type: string }

    Job:
      type: object
      required: [id, kind, status, created_at, updated_at, finished_at]
      properties:
        id: { type: string, example: job_5m2k8x1v0c3d9q7r4t6w8y0z2a }
        kind: { type: string, example: account.delete }
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        error: { type: string, description: Why the job failed. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
