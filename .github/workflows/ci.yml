name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node 22 for the web interface
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: web install
        run: npm ci
        working-directory: web
      - name: web check
        run: npm run check
        working-directory: web
      - name: web build
        run: npm run build
        working-directory: web
      - name: React web interface install
        run: npm ci
        working-directory: webui
      - name: React web interface check
        run: npm run check
        working-directory: webui
      - name: React web interface build
        run: npm run build
        working-directory: webui
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        # The race detector slows the API package's tests to several minutes; the default 10m is too tight.
        run: go test -race -timeout 20m ./...
      - name: build
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/selfcloud
      - name: vet, test and build with the React interface
        # The reactui build embeds webui/dist, which the steps above have built.
        run: |
          go vet -tags reactui ./...
          go test -tags reactui ./internal/web/ ./internal/api/
          CGO_ENABLED=0 go build -tags reactui -o /dev/null ./cmd/selfcloud
