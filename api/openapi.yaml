openapi: 3.1.0
info:
  title: Selfcloud API
  version: 0.1.0
  summary: The HTTP API of Selfcloud, a self-hosted drive.
  description: |
    The design behind this API is in docs/design.md.

    **Errors.** Every error is JSON with a stable `code` (see the `ErrorCode` schema). Clients
    act on the code, not on the HTTP status. `details` carries the numbers a client needs to
    word its own message.

    **Request IDs.** Every response carries an `X-Request-Id` header; error bodies repeat it
    as `request_id`.

    **Browsers on other origins.** `cors.allowed_origins` lists the origins whose pages may call
    the API. Such a page sends a delegated token in `Authorization`, never a cookie. Preflights
    from allowed origins are answered before routing and authentication. The headers a page may
    read are listed in `docs/design.md` section 7.

    This document grows with each slice of the build. Only what it lists is implemented.
servers:
  - url: /
tags:
  - name: System
    description: Health, readiness, metrics and server facts.
  - name: Folders
    description: |
      Team spaces and personal folders, and who can reach them. A team space is shared by
      permissions and managed by the account; each user also has one personal folder ("My files"),
      which is private to that user. The account key reaches personal folders too.
  - name: Grants
    description: |
      Shares of a team space with a member. These routes predate roles: `read` is the viewer role
      and `write` is the editor role on the folder's root. New clients use permissions.
  - name: Permissions
    description: |
      Roles on any file or folder, inherited downward. A user or a group holds a role on a node,
      and reaches the node and everything below it at that role or a higher one. Inheritance only
      adds: a permission deeper down never lowers the role above it.
  - name: Comments
    description: Comments and replies on a file or a folder, mentions, and the people list for them (decision 39).
  - name: Sharing
    description: |
      Share links. A link gives access to a file or a folder without a permission row: an organisation
      link opens for members of the account. A link is never listed as a permission, and visits are
      recorded so that the access ends the moment the link is deleted or paused.
  - name: Groups
    description: Named sets of users of one account. A permission may name a group.
  - name: Admins
    description: Installation admin users.
  - name: Accounts
    description: |
      Accounts are tenants. Installation admin keys manage them; an account key manages one
      account's contents. Account IDs a caller may not manage are reported as `not_found`.
  - name: Tokens
    description: |
      Delegated tokens. An account key mints a short-lived token for a browser, so the browser calls
      the API directly and no file bytes pass through the client's server. Revoking every token of an
      account, or of one user, is here too.
  - name: Users
    description: |
      Users belong to one account and sign in with an email and a password. A new user must
      verify the email address first. Account keys, admin keys and owner sessions manage them.
  - name: Auth
    description: |
      Sign-in, sign-out, verification and password reset. These are rate-limited per client
      address and, for sign-in and reset requests, per email address. Answers do not reveal
      whether an email address is known.
  - name: Uploads
    description: |
      Resumable uploads, following tus 1.0.0 (creation, creation-with-upload, expiration,
      checksum, termination). An upload that is not finished expires after `upload.expiry`
      without a write, and in any case `upload.max_lifetime` after its creation.
  - name: Jobs
    description: Background work started by a request that answered 202.
  - name: Files
    description: |
      The file tree of a folder: directories, files, their contents, and moving, copying and
      deleting them. A caller needs `read` on a folder to look and `write` to change it. A node a
      caller cannot reach is `not_found`; one it can reach but may not change is `forbidden`.

  - name: Trash
    description: |
      Deleted files and folders wait here until `trash.retention` purges them. A trashed item keeps its
      contents, permissions and usage. It is unreachable through every other route, as if it were
      missing, until it is restored. Only the one who trashed an item, or a manager of it, can restore it.
  - name: Versions
    description: |
      The earlier contents of a file. Each replacement of a file's content keeps the content it replaces
      as a version, which counts toward the account's usage and quota. Versions are pruned by
      `versions.max_count` and `versions.max_age`, except those kept forever.
  - name: Labels
    description: |
      Typed label fields the account owner defines, and one value per field on each node. Every reader
      of a node sees its values; a restricted field is seen and set only by a manager of the node.

paths:
  /healthz:
    get:
      tags: [System]
      operationId: getHealthz
      summary: Liveness check
      description: Answers while the process runs, including during shutdown.
      responses:
        "200":
          description: The process is alive.
          headers:
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }

  /readyz:
    get:
      tags: [System]
      operationId: getReadyz
      summary: Readiness check
      description: |
        Checks that the database answers, that the data directory is writable, and that free
        disk is at least `storage.min_free`. During shutdown it answers 503 with an `Error`
        whose code is `unavailable`.
      responses:
        "200":
          description: Ready to serve.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "503":
          description: Not ready, or shutting down.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Readiness"
                  - $ref: "#/components/schemas/Error"

  /metrics:
    get:
      tags: [System]
      operationId: getMetrics
      summary: Prometheus metrics
      description: |
        Served here only when `metrics_listen` is not set; otherwise it is served on that
        address instead.
      responses:
        "200":
          description: Metrics in the Prometheus text format.
          content:
            text/plain:
              schema: { type: string }

  /api/v1/info:
    get:
      tags: [System]
      operationId: getInfo
      summary: Server facts, limits and branding
      description: |
        Clients read the upload limits here before uploading. `brand` is the installation's name,
        accent colour and logo (installation-wide only; per-tenant branding is not built).
      responses:
        "200":
          description: Server facts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Info" }
        default: { $ref: "#/components/responses/Error" }

  /brand/logo:
    get:
      tags: [System]
      operationId: getBrandLogo
      summary: The installation's logo
      description: |
        The file named by `ui.brand.logo_file`, read at start (PNG or SVG, at most 256 KiB). Served
        whether or not the web interface is on. `brand.logo_url` in `/info` is null when there is no
        logo, and this route then answers `not_found`. An SVG is sent with a sandbox policy.
      responses:
        "200":
          description: The logo, as image/png or image/svg+xml.
          content:
            image/png:
              schema: { type: string, format: binary }
            image/svg+xml:
              schema: { type: string }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/openapi.yaml:
    get:
      tags: [System]
      operationId: getOpenAPI
      summary: This document
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/yaml:
              schema: { type: string }

  /api/v1/accounts:
    post:
      tags: [Accounts]
      operationId: createAccount
      summary: Create an account
      description: |
        Admin key only. With an `external_id`, repeating the request with the same fields
        returns the existing account with status 200 instead of creating another, so a retry
        after a timeout is safe. Different fields get `409 conflict`, with the existing
        account's ID in `details.id`.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountCreate" }
      responses:
        "201":
          description: Created. With `owner`, the owner user is made in the same transaction.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountCreated" }
        "200":
          description: An account with this external_id and these fields already existed. Its owner, if any, is not compared or returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        default: { $ref: "#/components/responses/Error" }
    get:
      tags: [Accounts]
      operationId: listAccounts
      summary: List accounts
      description: Installation admin only (an admin key or an admin session). Oldest first.
      security: [{ bearer: [] }]
      parameters:
        - name: external_id
          in: query
          description: Only the account with this external ID.
          schema: { type: string }
        - name: q
          in: query
          description: Accounts whose name contains this text, folding ASCII case, or whose external ID is exactly this. Matched literally; at most 200 characters.
          schema: { type: string, maxLength: 200 }
        - name: status
          in: query
          description: Only accounts in this status.
          schema: { type: string, enum: [active, suspended] }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: One page of accounts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountList" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/accounts/{acc}:
    parameters:
      - $ref: "#/components/parameters/acc"
    get:
      tags: [Accounts]
      operationId: getAccount
      summary: Get an account
      description: Admin key, or the account's own key.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [Accounts]
      operationId: updateAccount
      summary: Change an account
      description: |
        Admin key only. Only the fields given change. A quota below current usage is allowed:
        stored files stay, and new writes get `quota_exceeded` until usage drops. Suspending
        blocks all access to the account but keeps its data.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountUpdate" }
      responses:
        "200":
          description: The changed account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [Accounts]
      operationId: deleteAccount
      summary: Delete an account
      description: |
        Admin key only. Access ends at once; the account and everything in it are removed by a
        background job. Repeating the call returns the same job.
      security: [{ bearer: [] }]
      responses:
        "202":
          description: Deletion has started.
          headers:
            Location: { schema: { type: string }, description: The job's URL. }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/accounts/{acc}/usage:
    parameters:
      - $ref: "#/components/parameters/acc"
    get:
      tags: [Accounts]
      operationId: getUsage
      summary: Storage usage
      description: Admin key, or the account's own key.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Usage and quota.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usage" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/label-fields:
    get:
      tags: [Labels]
      operationId: listLabelFields
      summary: List the account's label fields
      description: |
        Every user of the account, the account key and a delegated token see the fields, restricted ones
        included. The `values` count is shown to the account owner and the account key only.
      security: [{ bearer: [] }, { session: [] }]
      responses:
        "200":
          description: The fields, in position order, with their choices.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LabelFieldList" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{acc}/label-fields:
    parameters:
      - $ref: "#/components/parameters/acc"
    post:
      tags: [Labels]
      operationId: createLabelField
      summary: Define a label field
      description: |
        The account owner or the account key. An installation admin is `forbidden`. A name is checked as a
        file name is, and is unique in the account. An account holds at most 50 fields and a field at most
        100 choices; past either, `conflict` with `details.reason` `limit`. A name already used is `conflict`
        with `reason` `name_taken`. Choices belong to a choice field only. Audited as `label_field.create`.
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LabelFieldInput" }
      responses:
        "201":
          description: Defined.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LabelField" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{acc}/label-fields/{lbf}:
    parameters:
      - $ref: "#/components/parameters/acc"
      - $ref: "#/components/parameters/lbf"
    patch:
      tags: [Labels]
      operationId: updateLabelField
      summary: Change a label field
      description: |
        The account owner or the account key. Absent fields stay as they are. The type can change only while
        the field holds no values: otherwise `conflict` with `reason` `type_locked`. Changing away from the
        choice type drops the choices. A choice named by `id` is renamed or archived; a choice without an
        `id` is added. Choices are never deleted, so the values that use one keep their meaning.
        Audited as `label_field.update`.
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LabelFieldPatch" }
      responses:
        "200":
          description: The field after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LabelField" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [Labels]
      operationId: deleteLabelField
      summary: Delete a label field and its values
      description: |
        The account owner or the account key. Its choices and every value of it are removed. The audit entry
        records how many values there were. The web interface states that number before it deletes.
        Audited as `label_field.delete`.
      security: [{ bearer: [] }, { session: [] }]
      responses:
        "204": { description: Deleted. }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/nodes/{nod}/labels:
    parameters:
      - $ref: "#/components/parameters/nod"
    get:
      tags: [Labels]
      operationId: listNodeLabels
      summary: The label values of a node
      description: |
        Every field the caller may see, with its value or null. A restricted field is left out unless the
        caller is a manager of the node (an account key always is). A user value carries the member's display
        name when the caller may learn names. A link visitor is refused.
      security: [{ bearer: [] }, { session: [] }]
      responses:
        "200":
          description: The node's labels.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeLabelList" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/nodes/{nod}/labels/{lbf}:
    parameters:
      - $ref: "#/components/parameters/nod"
      - $ref: "#/components/parameters/lbf"
    put:
      tags: [Labels]
      operationId: setNodeLabel
      summary: Set a node's value for one field
      description: |
        Needs the editor role on the node, and the manager role for a restricted field (`forbidden` with
        `reason` `restricted_label` otherwise). The value is `{"value": ...}` in the field's type: text (at most
        500 characters, no control or bidi control character), a finite number, a date `YYYY-MM-DD`, the ID of a
        member of the account, or the ID of one of the field's choices that is not archived. The node's own row
        is not changed. Audited as `node.label_set`.
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NodeLabelValue" }
      responses:
        "204": { description: Set. }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [Labels]
      operationId: clearNodeLabel
      summary: Clear a node's value for one field
      description: |
        The same roles as setting one. Clearing a field that holds no value changes nothing and is not audited.
        Audited as `node.label_clear` when a value goes.
      security: [{ bearer: [] }, { session: [] }]
      responses:
        "204": { description: Cleared. }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{acc}/storage-policy:
    parameters:
      - $ref: "#/components/parameters/acc"
    get:
      tags: [Accounts]
      operationId: getStoragePolicy
      summary: The default storage limit for each user
      description: Owner, account key or admin. 0 is no limit, which is the default.
      security: [{ bearer: [] }, { session: [] }]
      responses:
        "200":
          description: The policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoragePolicy" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [Accounts]
      operationId: updateStoragePolicy
      summary: Set the default storage limit for each user
      description: |
        Owner, account key or admin. A user with its own limit keeps it. Audited as `account.storage_policy`.
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StoragePolicy" }
      responses:
        "200":
          description: The policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoragePolicy" }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/accounts/{acc}/storage:
    parameters:
      - $ref: "#/components/parameters/acc"
    get:
      tags: [Accounts]
      operationId: getAccountStorage
      summary: Storage totals of the account, its folders and its users
      description: |
        Owner, account key or admin. The account key and owners also get `users`, paged by use
        (`users_limit`, `users_cursor`), and the folders with names. An owner's folders are the team spaces only, and
        its users carry totals only: no file name of a member's My files is ever sent. An admin gets the account and the
        team spaces' totals, with no names and no users.
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - { name: users_limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: users_cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: The totals.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountStorage" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/accounts/{acc}/storage/largest:
    parameters:
      - $ref: "#/components/parameters/acc"
    get:
      tags: [Accounts]
      operationId: getAccountLargestFiles
      summary: The largest files of the account
      description: |
        Owner: the largest files of the team spaces, by name; `folder` must be a team space. The account key: any folder,
        or all of them. Admin: refused. An owner never sees a file of a member's My files.
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - { name: folder, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: A page of files, largest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LargeFiles" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/accounts/{acc}/keys:
    parameters:
      - $ref: "#/components/parameters/acc"
    post:
      tags: [Accounts]
      operationId: createKey
      summary: Create an account key
      description: Admin key only. The key is in this response and nowhere else.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeyCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeyCreated" }
        default: { $ref: "#/components/responses/Error" }
    get:
      tags: [Accounts]
      operationId: listKeys
      summary: List an account's keys
      description: Admin key only. Revoked keys are listed too.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The keys, oldest first. Secrets are never shown.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeyList" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/accounts/{acc}/keys/{key}:
    parameters:
      - $ref: "#/components/parameters/acc"
      - name: key
        in: path
        required: true
        schema: { type: string, example: key_5m2k8x1v0c3d9q7r4t6w8y0z2a }
    delete:
      tags: [Accounts]
      operationId: revokeKey
      summary: Revoke an account key
      description: Admin key only. The key stops working at once.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Revoked. }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/accounts/{acc}/webhooks:
    parameters:
      - $ref: "#/components/parameters/acc"
    post:
      tags: [Webhooks]
      operationId: createWebhook
      summary: Register a webhook endpoint
      description: |
        Account key only. The secret is in this answer and nowhere else: store it at once. The URL must be
        HTTPS (HTTP only where the operator allows it), with no user name and no fragment. A refused URL
        is never echoed back. An account holds at most 100 endpoints; a create beyond that is a conflict
        with `reason: limit`. The answer is `Cache-Control: no-store`.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookCreate" }
      responses:
        "201":
          description: Created, with the secret.
          headers:
            Location: { schema: { type: string } }
            Cache-Control: { schema: { type: string, enum: [no-store] } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookShown" }
        default: { $ref: "#/components/responses/Error" }
    get:
      tags: [Webhooks]
      operationId: listWebhooks
      summary: List the webhook endpoints of the account
      description: |
        The account key and an owner of the account. No secret is ever returned. The account key sees the full
        `url`; an owner sees only its scheme, host and port, because the URL may hold a token in its path or
        query.
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: The endpoints, oldest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookList" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{acc}/webhooks/{hook}:
    parameters:
      - $ref: "#/components/parameters/acc"
      - $ref: "#/components/parameters/hook"
    get:
      tags: [Webhooks]
      operationId: getWebhook
      summary: Read one webhook endpoint
      description: |
        The account key and an owner of the account. No secret is ever returned. The account key sees the full
        `url`; an owner sees only its scheme, host and port, because the URL may hold a token in its path or
        query. The answer also holds the newest five deliveries (`recent_deliveries`), as the delivery log route gives them.
      security: [{ bearer: [] }, { session: [] }]
      responses:
        "200":
          description: The endpoint, with its newest five deliveries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookDetail" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [Webhooks]
      operationId: updateWebhook
      summary: Change a webhook endpoint
      description: |
        Account key only. A disabled endpoint changes state only with a new URL in the same request; a state
        change alone is a conflict, whatever the disabled reason. An unchanged URL keeps the state and the
        reason. A new URL clears the failure count and the disabled reason. Rotating the secret of a disabled
        endpoint pauses it.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookUpdate" }
      responses:
        "200":
          description: The endpoint.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [Webhooks]
      operationId: deleteWebhook
      summary: Delete a webhook endpoint
      description: Account key only. Its events and deliveries go with it.
      security: [{ bearer: [] }]
      responses:
        "204":
          description: Deleted.
        default: { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{acc}/webhooks/{hook}/secret:
    parameters:
      - $ref: "#/components/parameters/acc"
      - $ref: "#/components/parameters/hook"
    post:
      tags: [Webhooks]
      operationId: rotateWebhookSecret
      summary: Rotate the secret of a webhook endpoint
      description: |
        Account key only. The new secret is in this answer and nowhere else; the answer is `Cache-Control:
        no-store`. The secret it replaces still signs for 24 hours (until previous_secret_until); a second
        rotation ends it at once. Rotating a disabled endpoint pauses it.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The endpoint, with the new secret.
          headers:
            Cache-Control: { schema: { type: string, enum: [no-store] } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookShown" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{acc}/webhooks/{hook}/test:
    parameters:
      - $ref: "#/components/parameters/acc"
      - $ref: "#/components/parameters/hook"
    post:
      tags: [Webhooks]
      operationId: testWebhook
      summary: Send a test event to one endpoint
      description: |
        Account key only. Queues one `webhook.test` event for this endpoint, whatever events it subscribes to, and
        answers with its event ID. The endpoint must be active: a paused or disabled one is a conflict with
        `reason: state`, and a full queue (100,000 pending deliveries) is a conflict with `reason: limit`. The
        audit log records the test without the URL's path or query.
      security: [{ bearer: [] }]
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema:
                type: object
                required: [event_id]
                properties:
                  event_id: { type: string, example: evt_5m2k8x1v0c3d9q7r4t6w8y0z2a }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{acc}/webhooks/{hook}/deliveries:
    parameters:
      - $ref: "#/components/parameters/acc"
      - $ref: "#/components/parameters/hook"
    get:
      tags: [Webhooks]
      operationId: listWebhookDeliveries
      summary: The delivery log of an endpoint
      description: |
        The account key and an owner of the account. Newest first. Each row names the event and the state of its
        delivery; `last_error` is a fixed token (`address_refused`, `resolve`, `timeout`, `connect`, `tls`,
        `redirect`, `status <code>`, `overflow`, `disabled` (a queue a disable left behind), or a disable reason), never a URL
        or a body. A delivered row is
        kept for 7 days and a failed one for 30; then it goes.
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: The deliveries, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookDeliveryList" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{acc}/webhooks/{hook}/deliveries/{dlv}/retry:
    parameters:
      - $ref: "#/components/parameters/acc"
      - $ref: "#/components/parameters/hook"
      - $ref: "#/components/parameters/dlv"
    post:
      tags: [Webhooks]
      operationId: retryWebhookDelivery
      summary: Queue a failed delivery again
      description: |
        Account key only. Only a failed delivery is retried, and it is due at once with a fresh 24-hour window. A
        disabled endpoint is a conflict with `reason: state` until its URL is changed or its secret rotated, and a
        full queue is a conflict with `reason: limit`.
      security: [{ bearer: [] }]
      responses:
        "202":
          description: Queued again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookDelivery" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{acc}/quota-warning:
    parameters:
      - $ref: "#/components/parameters/acc"
    get:
      tags: [Webhooks]
      operationId: getQuotaWarning
      summary: Read the share of the quota at which quota.warning is sent
      description: The account key and an owner read it. A member gets 404, as every webhook route answers it.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The level now in force.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuotaWarning" }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [Webhooks]
      operationId: setQuotaWarning
      summary: Set the share of the quota at which quota.warning is sent
      description: |
        Account key only. The level applies to the account's quota and to each user's limit on its personal folder.
        quota.exceeded is always at 100 percent. Audited as `account.quota_warning`, with the number only.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuotaWarning" }
      responses:
        "200":
          description: The level now in force.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuotaWarning" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [Webhooks]
      operationId: resetQuotaWarning
      summary: Set the warning level back to the default, 80 percent
      description: Account key only. Audited as `account.quota_warning`.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The level now in force, which is the default.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuotaWarning" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{acc}/tokens:
    parameters:
      - $ref: "#/components/parameters/acc"
    post:
      tags: [Tokens]
      operationId: mintToken
      summary: Mint a delegated token
      description: |
        Only an account key of this account may mint, so an installation admin, a signed-in user
        and a delegated token cannot. The token acts as `user` when one is named (its rights are
        then the token's intersected with the user's grants), and as the key otherwise. It reaches
        only `folders`, and at most at `permissions`; it never manages the account. Its lifetime is
        `ttl`, capped by `tokens.max_ttl`. The token is in this response and nowhere else. The audit
        log records the mint without it. Rate-limited per account key.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenCreate" }
      responses:
        "201":
          description: "Created. Send the token as `Authorization: Bearer sct_...`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenCreated" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/accounts/{acc}/tokens/revoke:
    parameters:
      - $ref: "#/components/parameters/acc"
    post:
      tags: [Tokens]
      operationId: revokeTokens
      summary: Revoke every delegated token issued so far
      description: |
        Every token of the account issued at or before this moment stops working, at once. Tokens
        made afterwards work. The account key, or a person who manages the account, may call it.
        The call is audited.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Revoked. Tokens issued at or before `tokens_not_before` are void.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokensRevoked" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/accounts/{acc}/users/{usr}/tokens/revoke:
    parameters:
      - $ref: "#/components/parameters/acc"
      - $ref: "#/components/parameters/usr"
    post:
      tags: [Tokens]
      operationId: revokeUserTokens
      summary: Revoke every delegated token of one user
      description: |
        Every token that acts as this user and was issued up to now stops working, at once. The
        user's other tokens, the account's other tokens and the user's sessions are not affected,
        and tokens made afterwards work. The cut-off only moves forward. The account key, or a
        person who manages the account, may call it; a delegated token and a member's session may
        not, and an unknown user or one of another account is `not_found`. The call is audited
        under `user.tokens_revoke`, naming the user. A signed link a token made earlier is not ended:
        links are capabilities that no revocation reaches, and each lives to its own expiry.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Revoked. The user's tokens issued at or before `tokens_not_before` are void.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokensRevoked" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/accounts/{acc}/audit:
    parameters:
      - $ref: "#/components/parameters/acc"
    get:
      tags: [Accounts]
      operationId: getAuditLog
      summary: The account's audit log
      description: "Admin key, or the account's own key. Newest first. A user session sees only the entries its rules allow: an entry about a personal folder is private to its user."
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
        - name: action
          in: query
          description: Only entries with this action, such as folder.create.
          schema: { type: string, maxLength: 100 }
        - name: actor
          in: query
          description: Only entries by this actor ID (the actor's id, as the entry shows it).
          schema: { type: string, maxLength: 100 }
      responses:
        "200":
          description: One page of entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditList" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/nodes/{nod}/preview:
    parameters:
      - $ref: "#/components/parameters/nod"
    get:
      tags: [Files]
      operationId: getPreview
      summary: A preview of a document, as PDF or as the first page in PNG
      description: |
        The document converted by Collabora Online's conversion interface (decision 37). `format` is `pdf`
        (the whole document) or `png` (the first page as an image). The first request queues the conversion
        and answers `202` with `Retry-After`; later requests answer `202` until the file is ready, then `200`.
        A conversion that fails for the document (refused, or an answer of the wrong type) answers `404` for
        its key. A failure of the converter or the host answers `404` until a retry time, then the conversion
        is queued again, up to three attempts.

        Only the types the converter's discovery document lists for conversion are converted; another type
        answers `415`. A source over `derived.max_source_bytes` answers `413` before anything is sent. The
        route is off, and answers `404`, while `office.enabled` is false.

        A preview is a converted copy of the whole document, so the no-download rule refuses it: a caller
        whose downloads are restricted gets `403` with `download_restricted`.

        A HEAD request answers from the stored rows and queues nothing.
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - name: format
          in: query
          description: "`pdf` (the default) or `png`, the first page as an image."
          schema: { type: string, enum: [pdf, png] }
      responses:
        "200":
          description: The preview.
          headers:
            ETag: { schema: { type: string, description: "The SHA-256 of the file, quoted." } }
            Content-Security-Policy: { schema: { type: string } }
            Content-Disposition: { schema: { type: string, description: "inline, with the document's name and the preview's extension." } }
          content:
            application/pdf:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        "202":
          description: The preview is being made. Ask again after `Retry-After` seconds.
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: { type: string, enum: [pending] }
        "303":
          description: On a server with `content_url` set, a ready preview is at the signed link in `Location`.
        "400": { description: The format is not `pdf` or `png`. }
        "403": { description: The no-download rule refuses the preview (`download_restricted`). }
        "404": { description: Not found, the converter failed for this document, or office editing is off. }
        "413": { description: The source is over `derived.max_source_bytes` (`too_large`). }
        "415": { description: The converter does not convert this type (`unsupported_media_type`). }
        "429": { description: The conversions are busy (`rate_limited`), with `Retry-After`. }
        "503": { description: The converter is not available (`unavailable`), with `Retry-After`. }
    head:
      tags: [Files]
      operationId: headPreview
      summary: The state of a preview, without starting work
      description: |
        Answers as `GET` does, from the stored rows: `200` with the headers when the file is ready, `202` while
        it is being made, `404` otherwise. It queues nothing.
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [pdf, png] }
      responses:
        "200": { description: The preview is ready. }
        "202": { description: The preview is being made. }
        "404": { description: No preview is ready, or office editing is off. }
  /api/v1/nodes/{nod}/exports:
    parameters:
      - $ref: "#/components/parameters/nod"
    post:
      tags: [Files]
      operationId: createExport
      summary: Queue an export of a document in another format
      description: |
        Queues a conversion of the document to `format` (decision 37). The answer is `202` with the export's `id`
        and a `Location` header naming its file. An export already made is not queued again. A conversion is a
        download: the result is a derived file, never a node in the account's folders.

        The format is one of the fixed list (`docx`, `odp`, `ods`, `odt`, `pdf`, `pptx`, `xlsx`); any other value
        answers `400`. The same source rules as a preview apply. A caller under the no-download rule is refused
        with `403` and `download_restricted`, as a download is.
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [format]
              properties:
                format: { type: string, enum: [docx, odp, ods, odt, pdf, pptx, xlsx] }
      responses:
        "202":
          description: The export is queued or already made. Follow `Location` for the file.
          headers:
            Location: { schema: { type: string } }
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, description: "The export's ID (drv_...)." }
                  state: { type: string, enum: [pending, ready] }
                  format: { type: string }
        "400": { description: The format is not on the fixed list. }
        "403": { description: The no-download rule refuses the export (`download_restricted`). }
        "404": { description: Not found, or office editing is off. }
        "413": { description: The source is over `derived.max_source_bytes` (`too_large`). }
        "415": { description: The converter does not convert this type, or the export failed (`unsupported_media_type`). }
        "429": { description: The conversions are busy (`rate_limited`), with `Retry-After`. }
        "503": { description: The converter is not available (`unavailable`), with `Retry-After`. }
  /api/v1/nodes/{nod}/exports/{drv}:
    parameters:
      - $ref: "#/components/parameters/nod"
      - name: drv
        in: path
        required: true
        description: The export's ID, from the answer to `POST /exports`.
        schema: { type: string }
    get:
      tags: [Files]
      operationId: getExport
      summary: An export of a document
      description: |
        The exported file, as an attachment, with `Range` support so an interrupted download resumes. It answers
        `202` while the export is being made. Access and the no-download rule are checked on every call. An export
        made by another converter build, or under other limits, is not served as current, and answers `404`.
      security: [{ bearer: [] }, { session: [] }]
      responses:
        "200":
          description: The exported file.
          headers:
            ETag: { schema: { type: string, description: "The SHA-256 of the file, quoted." } }
            Content-Disposition: { schema: { type: string, description: "attachment, with the document's name and the export's extension." } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "202":
          description: The export is being made. Ask again after `Retry-After` seconds.
          headers:
            Retry-After: { schema: { type: integer } }
        "206": { description: The requested range. }
        "403": { description: The no-download rule refuses the download (`download_restricted`). }
        "404": { description: Not found, failed, or office editing is off. }
  /api/v1/zips:
    post:
      tags: [Files]
      operationId: createZip
      summary: Make a zip of files and folders
      description: |
        Makes one zip of the nodes named, as a job, and answers `202` with the job (its `Location` is
        `/api/v1/jobs/{job}`). Each node must be readable by the caller. A folder is zipped with everything
        in it that the caller can read. A shortcut is not zipped: it is left out and counted in
        `X-Selfcloud-Skipped`. A node the no-download rule restricts for the caller (a viewer or commenter)
        refuses the zip, as a copy does. The zip is a snapshot of the tree at the time the job reads it,
        and each file is read from the contents it had then.

        The zip is stored, and kept for `zip.ttl` after it is made. It is served with `Range`, so an
        interrupted download resumes. It does not count toward the account's quota; the stored zips are
        limited by the server's `zip.max_disk` and each account's `zip.max_disk_per_account`. A zip is for the
        caller who made it, with the credential it came in on, and no one else.
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nodes]
              properties:
                nodes:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items: { type: string }
      responses:
        "202":
          description: The zip is being made. Its job is at `Location`; when it succeeds, the zip is at `/api/v1/zips/{zip}` (the job's target).
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/zips/{zip}:
    parameters:
      - name: zip
        in: path
        required: true
        schema: { type: string, example: "zip_7k2m9q..." }
    get:
      tags: [Files]
      operationId: getZip
      summary: Download a zip made by the caller
      description: |
        Only the caller who made the zip, with the same credential (a token is read only by that token), may
        read it; for anyone else it is `404`. Each call re-checks
        that the caller can still read every node the zip was made from, and that none is in the trash:
        a revoked or trashed one refuses the download, and so does an expired zip. The no-download rule
        is not checked again: a zip stays until it expires once it is made. A zip still being made
        answers `202`. A `Range` request resumes a download, and `If-Range` is honoured.
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - name: Range
          in: header
          required: false
          schema: { type: string, example: "bytes=1048576-" }
      responses:
        "200":
          description: The zip.
          headers:
            ETag: { schema: { type: string, description: "The SHA-256 of the zip, quoted." } }
            Accept-Ranges: { schema: { type: string } }
            X-Selfcloud-Skipped: { schema: { type: integer, description: "Nodes left out: shortcuts and nodes the caller cannot read." } }
          content:
            application/zip:
              schema: { type: string, format: binary }
        "202":
          description: The zip is still being made. Ask again after `Retry-After` seconds.
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: { type: string, enum: [pending] }
        "206":
          description: The part of the zip asked for by `Range`.
        "304":
          description: "Not modified: the `If-None-Match` ETag is current."
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "416": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [Files]
      operationId: deleteZip
      summary: Delete a zip made by the caller
      description: Removes the zip now, rather than at its expiry. A zip still being made is refused with `409`.
      security: [{ bearer: [] }, { session: [] }]
      responses:
        "204": { description: The zip is deleted. }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/jobs/{job}:
    parameters:
      - name: job
        in: path
        required: true
        schema: { type: string, example: job_5m2k8x1v0c3d9q7r4t6w8y0z2a }
    get:
      tags: [Jobs]
      operationId: getJob
      summary: Get a job
      description: |
        Admin key, or a caller who manages the account the job belongs to. The caller a queued copy
        runs for may also read it: the same user (by session or delegated token) or the same key.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/folders:
    get:
      tags: [Folders]
      operationId: listMyFolders
      summary: List the folders the caller can reach
      description: |
        A user's hidden team spaces are left out unless `hidden=true`, which lists only them.
        An account key or owner session gets every folder of its account with access `write`.
        A member session gets its granted folders at the granted level. Both lists are paged the
        same way. Admins get `403 forbidden`: they manage tenants and never read their files.
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
        - name: hidden
          in: query
          required: false
          description: "false (the default) leaves hidden team spaces out; true lists only the hidden ones."
          schema: { type: string, enum: ["true", "false"] }
      responses:
        "200":
          description: The folders, with the caller's access to each.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FolderAccessList" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{acc}/folders:
    parameters:
      - $ref: "#/components/parameters/acc"
    post:
      tags: [Folders]
      operationId: createFolder
      summary: Create a folder
      description: |
        With an `external_id`, repeating the request with the same name returns the existing
        folder with status 200. A name another folder has is `409 conflict`.
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FolderCreate" }
      responses:
        "201":
          description: Created, with a root directory.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Folder" }
        "200":
          description: The folder with this external_id and name already existed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Folder" }
        default: { $ref: "#/components/responses/Error" }
    get:
      tags: [Folders]
      operationId: listFolders
      summary: List an account's folders
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - name: external_id
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: The folders, oldest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FolderList" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{acc}/folders/{fld}:
    parameters:
      - $ref: "#/components/parameters/acc"
      - $ref: "#/components/parameters/fld"
    get:
      tags: [Folders]
      operationId: getFolder
      summary: Get a folder
      security: [{ bearer: [] }, { session: [] }]
      responses:
        "200":
          description: The folder.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FolderDetail" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [Folders]
      operationId: updateFolder
      summary: Rename a folder or change its external ID
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FolderUpdate" }
      responses:
        "200":
          description: The folder.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Folder" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [Folders]
      operationId: deleteFolder
      summary: Delete a folder
      description: Removes its grants and file tree, and takes its files off the account's usage.
      security: [{ bearer: [] }, { session: [] }]
      responses:
        "204": { description: Deleted. }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{acc}/folders/{fld}/grants:
    parameters:
      - $ref: "#/components/parameters/acc"
      - $ref: "#/components/parameters/fld"
    get:
      tags: [Grants]
      operationId: listFolderGrants
      summary: List who holds a grant on a folder
      security: [{ bearer: [] }, { session: [] }]
