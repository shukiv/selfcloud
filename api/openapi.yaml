openapi: 3.1.0
info:
  title: Selfcloud API
  version: 0.1.0
  summary: The HTTP API of Selfcloud, a self-hosted drive.
  description: |
    The design behind this API is in docs/design.md.

    **Errors.** Every error is JSON with a stable `code` (see the `ErrorCode` schema). Clients
    act on the code, not on the HTTP status. `details` carries the numbers a client needs to
    word its own message.

    **Request IDs.** Every response carries an `X-Request-Id` header; error bodies repeat it
    as `request_id`.

    **Browsers on other origins.** `cors.allowed_origins` lists the origins whose pages may call
    the API. Such a page sends a delegated token in `Authorization`, never a cookie. Preflights
    from allowed origins are answered before routing and authentication. The headers a page may
    read are listed in `docs/design.md` section 7.

    This document grows with each slice of the build. Only what it lists is implemented.
servers:
  - url: /
tags:
  - name: System
    description: Health, readiness, metrics and server facts.
  - name: Folders
    description: Folders and who can reach them.
  - name: Grants
    description: Shares of a folder with a member.
  - name: Admins
    description: Installation admin users.
  - name: Accounts
    description: |
      Accounts are tenants. Installation admin keys manage them; an account key manages one
      account's contents. Account IDs a caller may not manage are reported as `not_found`.
  - name: Tokens
    description: |
      Delegated tokens. An account key mints a short-lived token for a browser, so the browser calls
      the API directly and no file bytes pass through the client's server. Revoking every token of an
      account is here too.
  - name: Users
    description: |
      Users belong to one account and sign in with an email and a password. A new user must
      verify the email address first. Account keys, admin keys and owner sessions manage them.
  - name: Auth
    description: |
      Sign-in, sign-out, verification and password reset. These are rate-limited per client
      address and, for sign-in and reset requests, per email address. Answers do not reveal
      whether an email address is known.
  - name: Uploads
    description: |
      Resumable uploads, following tus 1.0.0 (creation, creation-with-upload, expiration,
      checksum, termination). An upload that is not finished expires after `upload.expiry`
      without a write, and in any case `upload.max_lifetime` after its creation.
  - name: Jobs
    description: Background work started by a request that answered 202.
  - name: Files
    description: |
      The file tree of a folder: directories, files, their contents, and moving, copying and
      deleting them. A caller needs `read` on a folder to look and `write` to change it. A node a
      caller cannot reach is `not_found`; one it can reach but may not change is `forbidden`.

paths:
  /healthz:
    get:
      tags: [System]
      operationId: getHealthz
      summary: Liveness check
      description: Answers while the process runs, including during shutdown.
      responses:
        "200":
          description: The process is alive.
          headers:
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }

  /readyz:
    get:
      tags: [System]
      operationId: getReadyz
      summary: Readiness check
      description: |
        Checks that the database answers, that the data directory is writable, and that free
        disk is at least `storage.min_free`. During shutdown it answers 503 with an `Error`
        whose code is `unavailable`.
      responses:
        "200":
          description: Ready to serve.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "503":
          description: Not ready, or shutting down.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Readiness"
                  - $ref: "#/components/schemas/Error"

  /metrics:
    get:
      tags: [System]
      operationId: getMetrics
      summary: Prometheus metrics
      description: |
        Served here only when `metrics_listen` is not set; otherwise it is served on that
        address instead.
      responses:
        "200":
          description: Metrics in the Prometheus text format.
          content:
            text/plain:
              schema: { type: string }

  /api/v1/info:
    get:
      tags: [System]
      operationId: getInfo
      summary: Server facts and limits
      description: Clients read the upload limits here before uploading.
      responses:
        "200":
          description: Server facts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Info" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/openapi.yaml:
    get:
      tags: [System]
      operationId: getOpenAPI
      summary: This document
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/yaml:
              schema: { type: string }

  /api/v1/accounts:
    post:
      tags: [Accounts]
      operationId: createAccount
      summary: Create an account
      description: |
        Admin key only. With an `external_id`, repeating the request with the same fields
        returns the existing account with status 200 instead of creating another, so a retry
        after a timeout is safe. Different fields get `409 conflict`, with the existing
        account's ID in `details.id`.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountCreate" }
      responses:
        "201":
          description: Created. With `owner`, the owner user is made in the same transaction.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountCreated" }
        "200":
          description: An account with this external_id and these fields already existed. Its owner, if any, is not compared or returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        default: { $ref: "#/components/responses/Error" }
    get:
      tags: [Accounts]
      operationId: listAccounts
      summary: List accounts
      description: Admin key only. Oldest first.
      security: [{ bearer: [] }]
      parameters:
        - name: external_id
          in: query
          description: Only the account with this external ID.
          schema: { type: string }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: One page of accounts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountList" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/accounts/{acc}:
    parameters:
      - $ref: "#/components/parameters/acc"
    get:
      tags: [Accounts]
      operationId: getAccount
      summary: Get an account
      description: Admin key, or the account's own key.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [Accounts]
      operationId: updateAccount
      summary: Change an account
      description: |
        Admin key only. Only the fields given change. A quota below current usage is allowed:
        stored files stay, and new writes get `quota_exceeded` until usage drops. Suspending
        blocks all access to the account but keeps its data.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountUpdate" }
      responses:
        "200":
          description: The changed account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [Accounts]
      operationId: deleteAccount
      summary: Delete an account
      description: |
        Admin key only. Access ends at once; the account and everything in it are removed by a
        background job. Repeating the call returns the same job.
      security: [{ bearer: [] }]
      responses:
        "202":
          description: Deletion has started.
          headers:
            Location: { schema: { type: string }, description: The job's URL. }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/accounts/{acc}/usage:
    parameters:
      - $ref: "#/components/parameters/acc"
    get:
      tags: [Accounts]
      operationId: getUsage
      summary: Storage usage
      description: Admin key, or the account's own key.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Usage and quota.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usage" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/accounts/{acc}/keys:
    parameters:
      - $ref: "#/components/parameters/acc"
    post:
      tags: [Accounts]
      operationId: createKey
      summary: Create an account key
      description: Admin key only. The key is in this response and nowhere else.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeyCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeyCreated" }
        default: { $ref: "#/components/responses/Error" }
    get:
      tags: [Accounts]
      operationId: listKeys
      summary: List an account's keys
      description: Admin key only. Revoked keys are listed too.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The keys, oldest first. Secrets are never shown.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeyList" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/accounts/{acc}/keys/{key}:
    parameters:
      - $ref: "#/components/parameters/acc"
      - name: key
        in: path
        required: true
        schema: { type: string, example: key_5m2k8x1v0c3d9q7r4t6w8y0z2a }
    delete:
      tags: [Accounts]
      operationId: revokeKey
      summary: Revoke an account key
      description: Admin key only. The key stops working at once.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Revoked. }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/accounts/{acc}/tokens:
    parameters:
      - $ref: "#/components/parameters/acc"
    post:
      tags: [Tokens]
      operationId: mintToken
      summary: Mint a delegated token
      description: |
        Only an account key of this account may mint, so an installation admin, a signed-in user
        and a delegated token cannot. The token acts as `user` when one is named (its rights are
        then the token's intersected with the user's grants), and as the key otherwise. It reaches
        only `folders`, and at most at `permissions`; it never manages the account. Its lifetime is
        `ttl`, capped by `tokens.max_ttl`. The token is in this response and nowhere else. The audit
        log records the mint without it. Rate-limited per account key.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenCreate" }
      responses:
        "201":
          description: "Created. Send the token as `Authorization: Bearer sct_...`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenCreated" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/accounts/{acc}/tokens/revoke:
    parameters:
      - $ref: "#/components/parameters/acc"
    post:
      tags: [Tokens]
      operationId: revokeTokens
      summary: Revoke every delegated token issued so far
      description: |
        Every token of the account issued at or before this moment stops working, at once. Tokens
        made afterwards work. The account key, or a person who manages the account, may call it.
        The call is audited.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Revoked. Tokens issued at or before `tokens_not_before` are void.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokensRevoked" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/accounts/{acc}/audit:
    parameters:
      - $ref: "#/components/parameters/acc"
    get:
      tags: [Accounts]
      operationId: getAuditLog
      summary: The account's audit log
      description: Admin key, or the account's own key. Newest first.
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: One page of entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditList" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/jobs/{job}:
    parameters:
      - name: job
        in: path
        required: true
        schema: { type: string, example: job_5m2k8x1v0c3d9q7r4t6w8y0z2a }
    get:
      tags: [Jobs]
      operationId: getJob
      summary: Get a job
      description: |
        Admin key, or a caller who manages the account the job belongs to. The caller a queued copy
        runs for may also read it: the same user (by session or delegated token) or the same key.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/folders:
    get:
      tags: [Folders]
      operationId: listMyFolders
      summary: List the folders the caller can reach
      description: |
        An account key or owner session gets every folder of its account with access `write`.
        A member session gets its granted folders at the granted level. Both lists are paged the
        same way. Admins get `403 forbidden`: they manage tenants and never read their files.
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: The folders, with the caller's access to each.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FolderAccessList" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{acc}/folders:
    parameters:
      - $ref: "#/components/parameters/acc"
    post:
      tags: [Folders]
      operationId: createFolder
      summary: Create a folder
      description: |
        With an `external_id`, repeating the request with the same name returns the existing
        folder with status 200. A name another folder has is `409 conflict`.
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FolderCreate" }
      responses:
        "201":
          description: Created, with a root directory.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Folder" }
        "200":
          description: The folder with this external_id and name already existed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Folder" }
        default: { $ref: "#/components/responses/Error" }
    get:
      tags: [Folders]
      operationId: listFolders
      summary: List an account's folders
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - name: external_id
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: The folders, oldest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FolderList" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{acc}/folders/{fld}:
    parameters:
      - $ref: "#/components/parameters/acc"
      - $ref: "#/components/parameters/fld"
    get:
      tags: [Folders]
      operationId: getFolder
      summary: Get a folder
      security: [{ bearer: [] }, { session: [] }]
      responses:
        "200":
          description: The folder.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Folder" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [Folders]
      operationId: updateFolder
      summary: Rename a folder or change its external ID
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FolderUpdate" }
      responses:
        "200":
          description: The folder.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Folder" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [Folders]
      operationId: deleteFolder
      summary: Delete a folder
      description: Removes its grants and file tree, and takes its files off the account's usage.
      security: [{ bearer: [] }, { session: [] }]
      responses:
        "204": { description: Deleted. }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{acc}/folders/{fld}/grants:
    parameters:
      - $ref: "#/components/parameters/acc"
      - $ref: "#/components/parameters/fld"
    get:
      tags: [Grants]
      operationId: listFolderGrants
      summary: List who holds a grant on a folder
      security: [{ bearer: [] }, { session: [] }]
      responses:
        "200":
          description: The grants, oldest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GrantList" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{acc}/folders/{fld}/grants/{usr}:
    parameters:
      - $ref: "#/components/parameters/acc"
      - $ref: "#/components/parameters/fld"
      - $ref: "#/components/parameters/usr"
    put:
      tags: [Grants]
      operationId: setGrant
      summary: Share a folder with a member, or change the level
      description: Only a member can hold a grant. Owners and admins reach every folder without one.
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GrantSet" }
      responses:
        "200":
          description: The grant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Grant" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [Grants]
      operationId: removeGrant
      summary: Remove a grant
      security: [{ bearer: [] }, { session: [] }]
      responses:
        "204": { description: Removed. }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{acc}/users/{usr}/grants:
    parameters:
      - $ref: "#/components/parameters/acc"
      - $ref: "#/components/parameters/usr"
    get:
      tags: [Grants]
      operationId: listUserGrants
      summary: List the folders shared with a user
      security: [{ bearer: [] }, { session: [] }]
      responses:
        "200":
          description: The grants of the user, oldest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GrantList" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/admins:
    post:
      tags: [Admins]
      operationId: createAdmin
      summary: Create an installation admin
      description: |
        Admin key or admin session. Makes a pending admin user, who completes the link with
        `POST /api/v1/auth/verify`. Verification is `email`, or `link` for an admin key. An admin
        session gets email only, except for a link to a pending owner.
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCreate" }
      responses:
        "201":
          description: Created, with the verification made for it.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserWithVerification" }
        default: { $ref: "#/components/responses/Error" }
    get:
      tags: [Admins]
      operationId: listAdmins
      summary: List installation admins
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: The admins, oldest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminList" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/admins/{usr}:
    parameters:
      - $ref: "#/components/parameters/usr"
    delete:
      tags: [Admins]
      operationId: deleteAdmin
      summary: Delete an installation admin
      description: |
        Refused with `409 conflict` when this is the last active admin and no admin key without
        an expiry is active. A key with an expiry does not count.
      security: [{ bearer: [] }, { session: [] }]
      responses:
        "204": { description: Deleted. }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{acc}/users:
    parameters:
      - $ref: "#/components/parameters/acc"
    post:
      tags: [Users]
      operationId: createUser
      summary: Add a user to an account
      description: |
        Mail (`email` verification and resets) is limited to 30 messages an hour per account and
        3 an hour per address; past that the answer is `429 rate_limited`, and nothing is created.
        Account key, admin key, or an owner session. The `verification` method decides how the
        user proves the address:

        - `email`: Selfcloud mails a link. If mail is not configured, or the mail fails to send,
          the user is still created and `verification.sent` says whether the mail went out.
        - `link`: Selfcloud returns the link and token in `verification`, for the client to
          deliver.
        - `none`: the user is verified at once. Only an account or admin key may do this.

        With an `external_id`, repeating the request with the same email, display name, locale
        and role returns the existing user with status 200 and no new verification. Different
        fields get `409 conflict`, with the existing user's ID in `details.id`.
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreate" }
      responses:
        "201":
          description: Created. `verification` is present unless the method is `none`.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserWithVerification" }
        "200":
          description: A user with this external_id and these fields already existed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Error" }
    get:
      tags: [Users]
      operationId: listUsers
      summary: List an account's users
      description: Oldest first. Filter by `external_id` or `email` (case-insensitive).
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - name: external_id
          in: query
          description: Only the user with this external ID.
          schema: { type: string }
        - name: email
          in: query
          description: Only the user with this email address.
          schema: { type: string, format: email }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: One page of users.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserList" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/accounts/{acc}/users/{usr}:
    parameters:
      - $ref: "#/components/parameters/acc"
      - $ref: "#/components/parameters/usr"
    get:
      tags: [Users]
      operationId: getUser
      summary: Get a user
      security: [{ bearer: [] }, { session: [] }]
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [Users]
      operationId: updateUser
      summary: Change a user
      description: |
        Only the fields given change. The email address cannot change; sending it is refused.
        Setting `status` to `active` needs a verified user (`409 conflict` otherwise). Setting
        `disabled` ends the user's sessions at once.
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdate" }
      responses:
        "200":
          description: The changed user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [Users]
      operationId: deleteUser
      summary: Delete a user
      description: Removes the user with its sessions and tokens.
      security: [{ bearer: [] }, { session: [] }]
      responses:
        "204":
          description: Deleted.
        default: { $ref: "#/components/responses/Error" }

  /api/v1/accounts/{acc}/users/{usr}/verification:
    parameters:
      - $ref: "#/components/parameters/acc"
      - $ref: "#/components/parameters/usr"
    post:
      tags: [Users]
      operationId: sendVerification
      summary: Verify a pending user again, or verify them outright
      description: |
        Only for a pending user (`409 conflict` otherwise). Sends a fresh link, or creates one
        for the client to deliver, and voids earlier ones. Method `none` verifies the user at
        once and needs an account or admin key.
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerificationRequest" }
      responses:
        "200":
          description: The user, with the verification made for it when there was one.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserWithVerification" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/accounts/{acc}/users/{usr}/password-reset:
    parameters:
      - $ref: "#/components/parameters/acc"
      - $ref: "#/components/parameters/usr"
    post:
      tags: [Users]
      operationId: sendPasswordReset
      summary: Send or create a password-reset link for an active user
      description: The link works once and for the reset TTL (`users.reset_ttl`). Earlier reset links stop working.
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetRequest" }
      responses:
        "200":
          description: How the link was delivered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Verification" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/auth/verify:
    post:
      tags: [Auth]
      operationId: verifyUser
      summary: Complete a verification link
      description: |
        Sets the password if the user has none, makes the user active, and signs them in. The
        link works once. An unknown, used or expired link gets `invalid_request`, whatever its
        history. Rate-limited per client address.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyRequest" }
      responses:
        "200":
          description: Signed in. The session cookie is set.
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignedIn" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in
      description: |
        Checks the password against every user with this email. One match is signed in, unless
        the user is pending (`user_not_verified`), disabled (`user_disabled`) or the account is
        suspended (`account_suspended`). Several matches, all with this password, give `409
        conflict` with `details.accounts` listing them; send the same request again with
        `account` set. No match gives `unauthenticated`. Rate-limited per client address and
        per email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Signed in. The session cookie is set.
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignedIn" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Sign out
      description: Ends the session and clears the cookie. Needs the session cookie and the CSRF token.
      security: [{ session: [] }]
      responses:
        "204":
          description: Signed out.
        default: { $ref: "#/components/responses/Error" }

  /api/v1/auth/password/forgot:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Ask for a password-reset link
      description: |
        Always answers 202. If an active user has this email, a reset link is mailed in the
        background. Rate-limited per client address and per email. Past the forgot budget
        (3 an hour per address, 20 an hour per client address) no mail is sent, and the answer is
        still 202. Each address gets one reset an hour that no account cap counts. Any further
        reset for that address within the hour also counts against its account (30 an hour, where
        an installation admin counts as one account). So a caller cannot stop a user's first
        reset by using up the account's budget. Its buckets are separate from the ones invitations
        and resends use.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForgotRequest" }
      responses:
        "202":
          description: Accepted. Says nothing about whether the email is known.
        default: { $ref: "#/components/responses/Error" }

  /api/v1/auth/password/reset:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Set a new password with a reset link
      description: |
        The link works once. Every session of the user ends, and the answer starts a new
        session. Rate-limited per client address.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetRequest" }
      responses:
        "200":
          description: Signed in with the new password. The session cookie is set.
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignedIn" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: The signed-in user
      description: The user, their account and the CSRF token for unsafe requests.
      security: [{ session: [] }]
      responses:
        "200":
          description: The user and account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [Auth]
      operationId: updateMe
      summary: Change the signed-in user's display name or language
      description: |
        Session only, so the request needs the `Origin` header and the `X-CSRF-Token` header, as
        `POST /me/password` does. Only `display_name` and `locale` can change here. The answer is
        the same as `GET /me`.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MeUpdate" }
      responses:
        "200":
          description: The user, their account and the CSRF token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/me/password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Change your own password
      description: |
        Checks the current password, then ends every session of the user and starts a new one
        in the cookie. The answer has no body: call `GET /me` for the new CSRF token.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChange" }
      responses:
        "204":
          description: Changed. Sessions were replaced.
        default: { $ref: "#/components/responses/Error" }

  /api/v1/folders/{fld}/children:
    parameters:
      - $ref: "#/components/parameters/fld"
    get:
      tags: [Files]
      operationId: listChildrenByPath
      summary: List a directory of a folder by its path
      description: |
        `path` is relative to the folder's root: `/a/b`, or empty or `/` for the root. Names are
        checked as in `Node`; an empty segment, `.` or `..` is `invalid_path`. A missing
        directory is `not_found`; a file on the way is `invalid_path`. Children come in name order.
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - name: path
          in: query
          schema: { type: string, maxLength: 4096 }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: The children of the directory.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeList" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/folders/{fld}/directories:
    parameters:
      - $ref: "#/components/parameters/fld"
    post:
      tags: [Files]
      operationId: createDirectory
      summary: Make a directory, optionally with the directories above it
      description: |
        With `parents: true`, missing directories on the path are made, and a directory that
        already exists is answered `200` (like `mkdir -p`). Otherwise a missing parent is
        `not_found` and an existing name is `conflict`. A file where a directory is needed is
        `invalid_path`.
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DirectoryCreate" }
      responses:
        "201":
          description: Created.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        "200":
          description: The directory already existed (only with parents).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/folders/{fld}/files:
    parameters:
      - $ref: "#/components/parameters/fld"
    post:
      tags: [Files]
      operationId: createFile
      summary: Write a new small file in one request
      description: |
        The body is the file's contents, sent as is. `Content-Type` becomes the file's media
        type; without it, the type comes from the name's extension. `path` names the new file
        (`/a/b.txt`); `parents=true` makes missing directories. A body over
        `upload.max_small_file_size` is `too_large` with `details.limit_bytes`; larger files
        use resumable uploads. A name that exists is `conflict`, or with `If-None-Match: *`,
        `precondition_failed`.
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string, maxLength: 4096 }
        - name: parents
          in: query
          schema: { type: boolean, default: false }
        - name: If-None-Match
          in: header
          description: "Only *: the file must not exist yet."
          schema: { type: string, enum: ["*"] }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Created.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/uploads:
    parameters:
      - $ref: "#/components/parameters/tusResumable"
    options:
      tags: [Uploads]
      operationId: uploadOptions
      summary: What the upload protocol supports and the limits
      description: |
        No credential is needed. `Tus-Max-Size` is the largest file, and
        `Selfcloud-Max-Chunk-Size` the largest piece. Clients behind a proxy with a request cap
        should choose a piece size at or under that cap.
      responses:
        "204":
          description: Advertised.
          headers:
            Tus-Version: { $ref: "#/components/headers/Tus-Version" }
            Tus-Extension: { $ref: "#/components/headers/Tus-Extension" }
            Tus-Max-Size: { $ref: "#/components/headers/Tus-Max-Size" }
            Tus-Checksum-Algorithm: { $ref: "#/components/headers/Tus-Checksum-Algorithm" }
            Selfcloud-Max-Chunk-Size: { $ref: "#/components/headers/Selfcloud-Max-Chunk-Size" }
    post:
      tags: [Uploads]
      operationId: createUpload
      summary: Start a resumable upload (tus creation)
      description: |
        `Upload-Length` is required and the length must be declared. `Upload-Metadata` names the
        target: `folder` (required, a folder ID), then either `parent` (a directory's ID) or `path`
        (a directory path under the folder's root, e.g. `/a/b`), `name` (the file name; `filename`
        is accepted as well), and optionally `on_conflict` (`fail`, the default; `rename`;
        `replace`), `parents` (`true` makes missing directories), `mime_type`, and `sha256`: the
        64 hex digits (lowercase or not) of the whole file, which is checked when the last piece
        arrives. A mismatch is `checksum_mismatch` (460) and the upload is dropped. Other keys are
        ignored. Under `fail`, a name already taken is `conflict` now.

        Limits: a caller may hold `upload.max_open_per_principal` unfinished uploads (default 100),
        and an account `upload.max_open_per_account` (default 1000); above either, creation is
        `too_many_uploads` (429) with `details.scope` (`caller` or `account`). Creation is also
        rate limited per caller, at 60 a minute, and answers `rate_limited` (429).

        Quota: creation reserves the declared length against the account. The account's used
        bytes, its reserved bytes and this length must fit in `quota_bytes`, or the answer is
        `quota_exceeded` (507) with `details.scope` `quota`. An account with no quota may hold at
        most `upload.max_reserved_per_account` in reservations (`details.scope`
        `account_reservations`). The reservation is held until the upload completes, is
        terminated, or expires; completion never refuses for quota. Writes to the file tree are
        checked against the same quota: a write that grows usage past it is refused, and one
        that shrinks it always passes.

        Disk: the unwritten bytes of every open upload must fit in the free space of the server
        less `storage.min_free`, or the answer is `storage_full` (507) with `details.scope`
        `server`. When creating, one account's unwritten bytes may not exceed
        `upload.max_disk_share_percent` of that space, or the answer is `storage_full` with
        `details.scope` `account`. Both refusals carry `required_bytes` and `available_bytes`.

        Lifetime: an upload expires `upload.max_lifetime` after its creation (default 7 days),
        however often it is written to, and `upload.expiry` (default 24 h) after its last write.
        A request for an upload past either time is `upload_expired`.

        A creation whose first piece fails is removed, since the reply carries no `Location`. A
        completion that meets a name taken under `fail` answers `conflict` with
        `details.state: awaiting_commit`; the reply carries `Location` and `Selfcloud-Upload-State`,
        and the upload waits for `POST .../commit`.

        The request may carry the first piece (creation-with-upload), with
        `Content-Type: application/offset+octet-stream`. The reply's `Location` is the upload's
        URL. A file that the last piece completes is created before the reply; its ID comes back in
        `Selfcloud-Node-ID`.
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - $ref: "#/components/parameters/tusResumable"
        - $ref: "#/components/parameters/uploadLength"
        - $ref: "#/components/parameters/uploadMetadata"
        - $ref: "#/components/parameters/uploadChecksum"
      requestBody:
        required: false
        content:
          application/offset+octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Created. `Upload-Offset` says how much arrived with the request.
          headers:
            Location: { schema: { type: string, format: uri } }
            Tus-Resumable: { $ref: "#/components/headers/Tus-Resumable" }
            Upload-Offset: { $ref: "#/components/headers/Upload-Offset" }
            Upload-Expires: { $ref: "#/components/headers/Upload-Expires" }
            Selfcloud-Node-ID: { $ref: "#/components/headers/Selfcloud-Node-ID" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/uploads/{upl}/commit:
    parameters:
      - $ref: "#/components/parameters/upl"
    post:
      tags: [Uploads]
      operationId: commitUpload
      summary: Commit an upload that waits for a name
      description: |
        Only the upload's creator may commit, and only while the upload is `awaiting_commit`: all
        its bytes are in, and a completion found the name taken under `fail`. The body gives the
        new target; each field left out keeps the upload's own. The file is checked for access and
        for a free name, then created. Answers `conflict` with `details.state: awaiting_commit`
        again if the name is still taken, and `conflict` with `details.state: uploading` if the
        upload is not yet complete.
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadCommit" }
      responses:
        "201":
          description: The file, created under the new target.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/uploads/{upl}:
    parameters:
      - $ref: "#/components/parameters/upl"
      - $ref: "#/components/parameters/tusResumable"
    head:
      tags: [Uploads]
      operationId: headUpload
      summary: How far an upload got, for resuming
      description: Only the creator may ask. A deleted or completed upload is `not_found`.
      security: [{ bearer: [] }, { session: [] }]
      responses:
        "200":
          description: The durable offset and the length.
          headers:
            Tus-Resumable: { $ref: "#/components/headers/Tus-Resumable" }
            Upload-Offset: { $ref: "#/components/headers/Upload-Offset" }
            Upload-Length: { $ref: "#/components/headers/Upload-Length" }
            Upload-Expires: { $ref: "#/components/headers/Upload-Expires" }
            Selfcloud-Upload-State: { $ref: "#/components/headers/Selfcloud-Upload-State" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [Uploads]
      operationId: patchUpload
      summary: Send a piece at the durable offset (tus PATCH)
      description: |
        `Upload-Offset` must equal the server's offset, or the answer is `upload_offset_mismatch`
        with `details.offset`. The body goes at that offset and is synced before the offset moves.
        A piece over `Selfcloud-Max-Chunk-Size` is `chunk_too_large`; one that would pass the
        declared length is `too_large`. With `Upload-Checksum`, a piece that does not match is
        `checksum_mismatch` (460) and nothing is kept. When the body stops early the bytes that
        arrived are kept and the request fails, so HEAD gives the resume point.

        Each piece checks access again: a revoked grant or a disabled user stops the upload. Only
        one piece runs at a time. A new request from the same creator stops the one holding the
        slot (a half-open connection, say) and waits up to 5 seconds for it to finish; if it does
        not, the new request is `locked` (409). A piece with no bytes, sent at the full length,
        retries completing the file.

        A piece whose body is cut short with `Upload-Checksum` set cannot be verified, so it is
        dropped and the offset stays. A piece completing an upload whose name is taken under `fail`
        answers `conflict` with `details.state: awaiting_commit`, as in creation.
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - $ref: "#/components/parameters/tusResumable"
        - name: Upload-Offset
          in: header
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
        - $ref: "#/components/parameters/uploadChecksum"
      requestBody:
        required: true
        content:
          application/offset+octet-stream:
            schema: { type: string, format: binary }
      responses:
        "204":
          description: The piece is kept. `Upload-Offset` is the new offset.
          headers:
            Tus-Resumable: { $ref: "#/components/headers/Tus-Resumable" }
            Upload-Offset: { $ref: "#/components/headers/Upload-Offset" }
            Upload-Expires: { $ref: "#/components/headers/Upload-Expires" }
            Selfcloud-Node-ID: { $ref: "#/components/headers/Selfcloud-Node-ID" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [Uploads]
      operationId: deleteUpload
      summary: Terminate an upload (tus termination)
      description: Removes the upload and its bytes at once. Needs write on the folder.
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - $ref: "#/components/parameters/tusResumable"
      responses:
        "204":
          description: Terminated.
          headers:
            Tus-Resumable: { $ref: "#/components/headers/Tus-Resumable" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/nodes/{nod}:
    parameters:
      - $ref: "#/components/parameters/nod"
    get:
      tags: [Files]
      operationId: statNode
      summary: Stat a file or directory
      description: |
        For a file: its size, media type, `etag` (a strong ETag that changes with every write)
        and `sha256` of the contents. A folder's root is a directory with no `parent_id`.
      security: [{ bearer: [] }, { session: [] }]
      responses:
        "200":
          description: The node.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [Files]
      operationId: renameNode
      summary: Rename a file or directory inside its directory
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NodeRename" }
      responses:
        "200":
          description: The renamed node.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [Files]
      operationId: deleteNode
      summary: Delete a file, or a directory with everything in it
      description: |
        The contents of the files are removed from disk later, once nothing refers to them and
        the blob grace period (`blobs.delete_grace`) has passed. A folder's root cannot be
        deleted; delete the folder instead.
      security: [{ bearer: [] }, { session: [] }]
      responses:
        "204":
          description: Deleted.
        default: { $ref: "#/components/responses/Error" }

  /api/v1/nodes/{nod}/children:
    parameters:
      - $ref: "#/components/parameters/nod"
    get:
      tags: [Files]
      operationId: listChildren
      summary: List a directory by its ID
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: The children of the directory, in name order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeList" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/nodes/{nod}/move:
    parameters:
      - $ref: "#/components/parameters/nod"
    post:
      tags: [Files]
      operationId: moveNode
      summary: Move a file or directory
      description: |
        The target is `folder` (default: the node's own folder) and a directory in it, given by
        `parent` (a directory ID) or `path` (relative to the target folder's root); by default the
        node's own directory, or the target folder's root when the folder changes. `name`
        renames it on the way. A clash with a sibling is `conflict` unless `on_conflict` is
        `rename`, which picks `name (1).ext`, or `replace`, which deletes the sibling file (only
        file over file; a folder on either side is `conflict`). The replaced file's contents are
        collected later, as for any delete. A folder cannot go into itself or below itself
        (`invalid_request`). Moving needs `write` on the node's folder and on the target folder.
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Transfer" }
      responses:
        "200":
          description: The node, where it now is.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/nodes/{nod}/copy:
    parameters:
      - $ref: "#/components/parameters/nod"
    post:
      tags: [Files]
      operationId: copyNode
      summary: Copy a file or directory
      description: |
        Takes the same target as a move. A copy of a file shares its contents with the original,
        so nothing is copied on disk, but the account is charged for the copy in full. The caller
        needs `read` on the source and `write` on the target folder. A folder of up to 10,000
        nodes is copied in this request. A larger one answers `202` with a job (`node.copy`); the
        job's `target` is the new root node, and the job checks access again when it runs. A tree
        above `copy.max_nodes` is `too_large`, with `details.max_nodes` and `details.nodes`.
        Copy `on_conflict` works as for a move.
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Transfer" }
      responses:
        "201":
          description: The copy.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        "202":
          description: Queued as a job; poll GET /api/v1/jobs/{job}. The new root is the job's target.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/nodes/{nod}/content:
    parameters:
      - $ref: "#/components/parameters/nod"
    get:
      tags: [Files]
      operationId: getContent
      summary: Download a file
      description: |
        The file's contents. `Range` may name up to 16 byte ranges: one is `206` with a
        `Content-Range`, several are a `multipart/byteranges` body. A range that is malformed, lies
        outside the file, or is one of more than 16 is `range_not_satisfiable`, with
        `Content-Range: bytes */<size>`. `If-Range` decides whether a range applies: when it does not
        match the current ETag or Last-Modified, the whole file is sent. `If-None-Match` and
        `If-Modified-Since` give `304`; `If-Match` and `If-Unmodified-Since` give
        `precondition_failed` when they fail.

        `disposition=inline` is honoured only where policy allows: on the content origin for any
        type, and on the main origin, when `content_url` is not set, for images other than SVG, PDF,
        audio, video and plain text (text is sent as UTF-8). Otherwise the response is an attachment.
        Every response carries `X-Content-Type-Options: nosniff` and the sandboxing
        `Content-Security-Policy: sandbox; default-src 'none'`.
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - { name: Range, in: header, schema: { type: string, example: "bytes=0-1023" } }
        - name: If-Range
          in: header
          description: A strong ETag or an HTTP date. The range applies only when it matches.
          schema: { type: string }
        - { name: If-Match, in: header, schema: { type: string } }
        - { name: If-None-Match, in: header, schema: { type: string } }
        - { name: If-Modified-Since, in: header, schema: { type: string } }
        - { name: If-Unmodified-Since, in: header, schema: { type: string } }
        - name: disposition
          in: query
          schema: { type: string, enum: [attachment, inline], default: attachment }
      responses:
        "200":
          description: The whole file.
          headers:
            ETag: { schema: { type: string } }
            Last-Modified: { schema: { type: string } }
            Accept-Ranges: { schema: { type: string, enum: [bytes] } }
            Content-Disposition: { schema: { type: string } }
            Cross-Origin-Resource-Policy: { schema: { type: string } }
          content:
            "*/*":
              schema: { type: string, format: binary }
        "206":
          description: The requested range, or a `multipart/byteranges` body for several.
          headers:
            Content-Range: { schema: { type: string } }
            ETag: { schema: { type: string } }
          content:
            "*/*":
              schema: { type: string, format: binary }
        "304":
          description: "Not modified: the If-None-Match ETag is current, or the file is older than If-Modified-Since."
        "416":
          description: "The Range header is malformed, names more than 16 ranges, or lies outside the file. `details.size_bytes` gives the size."
          headers:
            Content-Range: { schema: { type: string, example: "bytes */1048576" } }
        default: { $ref: "#/components/responses/Error" }
    head:
      tags: [Files]
      operationId: headContent
      summary: The headers of a download, without the body
      description: The status and headers `GET` would send, with no body. Takes the same headers.
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - { name: Range, in: header, schema: { type: string } }
        - { name: If-Range, in: header, schema: { type: string } }
        - { name: If-None-Match, in: header, schema: { type: string } }
        - { name: If-Modified-Since, in: header, schema: { type: string } }
        - name: disposition
          in: query
          schema: { type: string, enum: [attachment, inline], default: attachment }
      responses:
        "200":
          description: The file's headers.
          headers:
            ETag: { schema: { type: string } }
            Content-Length: { schema: { type: integer } }
        "206":
          description: The range's headers.
        "304":
          description: Not modified.
        "416":
          description: The range is not satisfiable; see GET.
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [Files]
      operationId: replaceContent
      summary: Replace a file's contents in one request
      description: |
        `If-Match` is required and must be the ETag the editor read; a stale one is
        `precondition_failed`, and a missing one is `precondition_required` (428). The new contents are a new
        blob. The size limit is `upload.max_small_file_size`, as for a create.
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - name: If-Match
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: The file, with its new ETag.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/nodes/{nod}/links:
    parameters:
      - $ref: "#/components/parameters/nod"
    post:
      tags: [Files]
      operationId: createLink
      summary: Make a signed download link
      description: |
        A link to one file that needs no credential: `GET` on it serves the file. The link names the
        file's current contents, so it stops working when the file changes, and it expires. The
        caller needs read access to the file to ask for a link; the link itself is the grant for
        whoever holds it, so treat it as a secret. It is written to the audit log (`node.link`).
        The URL is on `content_url` when that is set, else on `public_url`. Creation is limited to
        120 a minute per caller (`rate_limited`, with `Retry-After`). A link made with a delegated
        token may not outlive the token: the default and the largest `ttl` are cut to what the token
        has left, and an expired token gets `token_expired`.
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ttl:
                  type: integer
                  minimum: 1
                  description: "Lifetime in seconds. Default `links.default_ttl`, 5 minutes. A value above `links.max_ttl` (24 hours by default) is `invalid_request`; `details.max_ttl_seconds` gives the cap."
                disposition:
                  type: string
                  enum: [attachment, inline]
                  default: attachment
      responses:
        "201":
          description: The link.
          headers:
            Cache-Control: { schema: { type: string, example: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignedLink" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/links/{token}:
    parameters:
      - name: token
        in: path
        required: true
        description: The token from `POST /nodes/{nod}/links`. It is a credential, so the access log records the route, not the path.
        schema: { type: string, maxLength: 512 }
    get:
      tags: [Files]
      operationId: getSignedLink
      summary: Download the file a signed link names
      description: |
        No credential is needed, and no cookie is read. The token must match the file's current
        ETag. A link past its time is `link_expired` (410). A link that is malformed, forged, for a
        file that has changed or been deleted, or for another node is `not_found`, so a probe learns
        nothing from the difference. A suspended account is `account_suspended`. The user's grants
        are not consulted. Requests are limited to 600 a minute per client address, charged before
        the token is read (`rate_limited`). Range, conditional headers and the safety headers work as for
        `GET /nodes/{nod}/content`. On the content origin this is the only path that is served.
      security: []
      parameters:
        - { name: Range, in: header, schema: { type: string } }
        - { name: If-Range, in: header, schema: { type: string } }
        - { name: If-None-Match, in: header, schema: { type: string } }
        - { name: If-Modified-Since, in: header, schema: { type: string } }
      responses:
        "200":
          description: The whole file.
          headers:
            ETag: { schema: { type: string } }
            Last-Modified: { schema: { type: string } }
            Accept-Ranges: { schema: { type: string, enum: [bytes] } }
            Content-Disposition: { schema: { type: string } }
            Cross-Origin-Resource-Policy: { schema: { type: string, example: cross-origin } }
          content:
            "*/*":
              schema: { type: string, format: binary }
        "206":
          description: The requested range, or a `multipart/byteranges` body.
          headers:
            Content-Range: { schema: { type: string } }
          content:
            "*/*":
              schema: { type: string, format: binary }
        "304":
          description: Not modified.
        "416":
          description: The range is not satisfiable.
          headers:
            Content-Range: { schema: { type: string, example: "bytes */1048576" } }
        default: { $ref: "#/components/responses/Error" }
    head:
      tags: [Files]
      operationId: headSignedLink
      summary: The headers of a signed link's file, without the body
      description: As `GET`, with no body.
      security: []
      parameters:
        - { name: Range, in: header, schema: { type: string } }
        - { name: If-Range, in: header, schema: { type: string } }
      responses:
        "200":
          description: The file's headers.
        "206":
          description: The range's headers.
        "416":
          description: The range is not satisfiable.
        default: { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer <credential>`. Installation admin keys start with `sc_admin_`;
        account keys start with `sc_acct_`; delegated tokens start with `sct_` and are refused
        once they expire (`token_expired`) or are revoked (`unauthenticated`). A cookie session
        is never accepted for a request from another origin.
    session:
      type: apiKey
      in: cookie
      name: __Host-selfcloud_session
      description: |
        The session cookie set by sign-in (named `selfcloud_session` when `public_url` is
        http). Requests that change state also need the `Origin` header of this site and the
        `X-CSRF-Token` header with the `csrf_token` from sign-in.

  parameters:
    acc:
      name: acc
      in: path
      required: true
      schema: { type: string, example: acc_5m2k8x1v0c3d9q7r4t6w8y0z2a }
    usr:
      name: usr
      in: path
      required: true
      schema: { type: string, example: usr_5m2k8x1v0c3d9q7r4t6w8y0z2a }
    fld:
      name: fld
      in: path
      required: true
      schema: { type: string, example: fld_5m2k8x1v0c3d9q7r4t6w8y0z2a }
    nod:
      name: nod
      in: path
      required: true
      schema: { type: string, example: nod_5m2k8x1v0c3d9q7r4t6w8y0z2a }
    upl:
      name: upl
      in: path
      required: true
      schema: { type: string, example: upl_5m2k8x1v0c3d9q7r4t6w8y0z2a }
    tusResumable:
      name: Tus-Resumable
      in: header
      required: true
      description: "Must be 1.0.0 (except on OPTIONS). Otherwise 412 precondition_failed."
      schema: { type: string, enum: ["1.0.0"] }
    uploadLength:
      name: Upload-Length
      in: header
      required: true
      description: The file's length in bytes. Deferred lengths are not supported.
      schema: { type: integer, format: int64, minimum: 0 }
    uploadMetadata:
      name: Upload-Metadata
      in: header
      required: true
      description: |
        Comma-separated `key base64value` pairs; see the operation for the keys. The value is
        base64 of the text (`folder` takes a folder ID, `path` a directory path).
      schema: { type: string, maxLength: 8192 }
    uploadChecksum:
      name: Upload-Checksum
      in: header
      description: |
        `<algorithm> <base64 digest>` of the piece, with algorithm `sha256` or `sha1`. A piece
        that does not match is refused and nothing is kept.
      schema: { type: string }
    limit:
      name: limit
      in: query
      description: Page size.
      schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
    cursor:
      name: cursor
      in: query
      description: The `next_cursor` of the previous page.
      schema: { type: string }

  headers:
    Tus-Resumable:
      description: The tus version the server speaks, 1.0.0.
      schema: { type: string, enum: ["1.0.0"] }
    Tus-Version:
      description: The tus versions the server supports, on a 412.
      schema: { type: string, example: "1.0.0" }
    Tus-Extension:
      description: The tus extensions the server has.
      schema: { type: string, example: "creation,creation-with-upload,expiration,checksum,termination" }
    Tus-Max-Size:
      description: The largest file in bytes.
      schema: { type: integer, format: int64 }
    Tus-Checksum-Algorithm:
      description: The checksum algorithms a piece may use.
      schema: { type: string, example: "sha1,sha256" }
    Upload-Offset:
      description: "The durable offset: bytes that are on disk and synced."
      schema: { type: integer, format: int64, minimum: 0 }
    Upload-Length:
      description: The declared length of the file.
      schema: { type: integer, format: int64, minimum: 0 }
    Upload-Expires:
      description: When the upload expires unless a piece refreshes it (HTTP date). Never later than upload.max_lifetime after creation.
      schema: { type: string }
    Selfcloud-Max-Chunk-Size:
      description: The largest piece in bytes (upload.max_chunk_size).
      schema: { type: integer, format: int64 }
    Selfcloud-Node-ID:
      description: The ID of the file that the request completed.
      schema: { type: string, example: nod_5m2k8x1v0c3d9q7r4t6w8y0z2a }
    Selfcloud-Upload-State:
      description: "`awaiting_commit`: all bytes are in and the upload waits for a name (see the commit route)."
      schema: { type: string, enum: [awaiting_commit] }
    X-Request-Id:
      description: The request's ID, also logged by the server.
      schema: { type: string, example: req_5m2k8x1v0c3d9q7r4t6w8y0z2a }

  responses:
    Error:
      description: An error. Act on `error.code`.
      headers:
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
        Retry-After:
          description: Seconds to wait, on `rate_limited` and `unavailable`.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Folder:
      type: object
      required: [id, external_id, name, created_at, updated_at]
      properties:
        id: { type: string, example: fld_5m2k8x1v0c3d9q7r4t6w8y0z2a }
        external_id:
          type: [string, "null"]
          description: The client's own reference; unique within the account.
        name: { type: string, description: The name in Unicode NFC. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    FolderCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        external_id: { type: string, maxLength: 255 }

    FolderUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        external_id: { type: string, maxLength: 255, description: Empty clears it. }

    UploadCommit:
      type: object
      additionalProperties: false
      description: The new target of an upload that waits for a name. Missing fields keep the upload's own.
      properties:
        parent: { type: string, description: A directory's ID, in the upload's folder. }
        path: { type: string, maxLength: 4096, description: "A directory path under the folder's root, e.g. /a/b." }
        name: { type: string, minLength: 1, maxLength: 255 }
        on_conflict: { type: string, enum: [fail, rename, replace] }

    Node:
      type: object
      description: |
        A file or a directory. A folder's root is a directory with no `parent_id`, and its name
        is empty. Names are NFC, 1 to 255 bytes, may not hold `/`, `\`, control or invisible
        characters, may not start or end with a space, and may not be `.` or `..`. Within one
        directory names are unique without regard to case.
      required: [id, folder_id, parent_id, name, kind, size, created_at, modified_at]
      properties:
        id: { type: string, example: nod_5m2k8x1v0c3d9q7r4t6w8y0z2a }
        folder_id: { type: string, example: fld_5m2k8x1v0c3d9q7r4t6w8y0z2a }
        parent_id: { type: [string, "null"] }
        name: { type: string }
        kind: { type: string, enum: [dir, file] }
        size: { type: integer, minimum: 0, description: Bytes, for a file. }
        mime_type: { type: string, description: Files only. }
        etag: { type: string, description: Files only. A strong ETag; changes with every write. }
        sha256: { type: string, description: Files only. Hex SHA-256 of the contents. }
        created_at: { type: string, format: date-time }
        modified_at: { type: string, format: date-time }

    NodeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Node" }
        next_cursor: { type: string }

    DirectoryCreate:
      type: object
      required: [path]
      additionalProperties: false
      properties:
        path: { type: string, maxLength: 4096, description: "Relative to the folder's root, e.g. /a/b." }
        parents: { type: boolean, default: false }

    NodeRename:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }

    Transfer:
      type: object
      additionalProperties: false
      properties:
        folder: { type: string, description: The target folder; default the node's own. }
        parent: { type: string, description: A directory of the target folder. Not with path. }
        path: { type: string, description: "A directory of the target folder, e.g. /a. Not with parent." }
        name: { type: string, minLength: 1, maxLength: 255, description: A new name. }
        on_conflict:
          type: string
          enum: [fail, rename, replace]
          default: fail

    FolderList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Folder" }
        next_cursor: { type: string }

    FolderAccess:
      allOf:
        - $ref: "#/components/schemas/Folder"
        - type: object
          required: [access]
          properties:
            access: { type: string, enum: [read, write] }

    FolderAccessList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FolderAccess" }
        next_cursor: { type: string }

    Grant:
      type: object
      required: [level, created_at, created_by]
      properties:
        folder_id: { type: string, description: Set in a user's grant list. }
        user_id: { type: string, description: Set in a folder's grant list. }
        level: { type: string, enum: [read, write] }
        created_at: { type: string, format: date-time }
        created_by: { type: string, description: The ID of the caller who made or last changed the grant. }

    GrantSet:
      type: object
      required: [level]
      additionalProperties: false
      properties:
        level: { type: string, enum: [read, write] }

    GrantList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Grant" }

    Status:
      type: object
      required: [status]
      properties:
        status: { type: string, example: ok }

    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          description: One entry per check (database, data_dir, disk_free).
          additionalProperties:
            type: string
            enum: [ok, failed, unknown]

    Info:
      type: object
      required: [name, version, public_url, web_interface, limits, features]
      properties:
        name: { type: string, example: Selfcloud }
        version: { type: string, example: 0.1.0 }
        public_url:
          type: string
          format: uri
          description: The address clients reach the server at.
          example: https://drive.example.com
        web_interface:
          type: boolean
          description: Whether this server also serves its web interface.
        limits: { $ref: "#/components/schemas/Limits" }
        features:
          type: array
          description: Optional features this server has enabled.
          items: { type: string }

    Limits:
      type: object
      required: [max_file_size, max_chunk_size]
      properties:
        max_file_size:
          type: integer
          format: int64
          description: Largest file accepted, in bytes.
        max_chunk_size:
          type: integer
          format: int64
          description: Largest upload request body accepted, in bytes.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message:
              type: string
              description: English text for logs and developers; clients translate by code.
            details:
              type: object
              description: |
                Numbers for the client's message: `limit_bytes` (too_large),
                `max_chunk_size` (chunk_too_large), `required_bytes` and `available_bytes`
                (quota_exceeded, storage_full). `scope` says which limit refused the write:
                for quota_exceeded `quota` or `account_reservations`; for storage_full `server`
                or `account`.
              additionalProperties: true
            request_id: { type: string }

    ErrorCode:
      type: string
      description: |
        | Code | Status | Meaning |
        |---|---|---|
        | invalid_request, invalid_path, invalid_name | 400 | Malformed request, path or name. |
        | unauthenticated | 401 | No valid credential; sign in again. |
        | token_expired | 401 | Delegated token expired; refresh it and retry. |
        | forbidden | 403 | The caller may not do this. |
        | account_suspended, user_not_verified, user_disabled | 403 | Account or user state blocks access. |
        | not_found | 404 | No such resource, or the caller may not know it exists. |
        | conflict | 409 | Name taken, duplicate external_id, or a concurrent upload. |
        | upload_offset_mismatch | 409 | Upload-Offset differs from the server's. |
        | locked | 409 | Locked by an office editor. |
        | upload_expired | 410 | The upload expired; start again. |
        | link_expired | 410 | The signed link's time has run out; ask for a new one. |
        | unsupported_media_type | 415 | A tus piece must be application/offset+octet-stream. |
        | too_many_uploads | 429 | The caller or the account holds the most unfinished uploads it may; `details.scope` says which. |
        | precondition_required | 428 | A write that needs If-Match sent none. |
        | precondition_failed | 412 | Stale ETag in If-Match. |
        | too_large | 413 | File over the size limit. |
        | chunk_too_large | 413 | Upload request over the size limit. |
        | range_not_satisfiable | 416 | Range outside the file. |
        | rate_limited | 429 | Slow down; see Retry-After. |
        | checksum_mismatch | 460 | Piece failed its Upload-Checksum. |
        | internal | 500 | Server fault; quote request_id. |
        | unavailable | 503 | Shutting down or in maintenance; see Retry-After. |
        | quota_exceeded | 507 | The write would take the account past its quota, or past its reservation cap when it has no quota. `required_bytes`, `available_bytes`, `scope` (`quota`, `account_reservations`). |
        | storage_full | 507 | The disk cannot hold the open uploads, or this account's share of them. `required_bytes`, `available_bytes`, `scope` (`server`, `account`). |
      enum:
        - invalid_request
        - invalid_path
        - invalid_name
        - unauthenticated
        - token_expired
        - forbidden
        - account_suspended
        - user_not_verified
        - user_disabled
        - not_found
        - conflict
        - upload_offset_mismatch
        - locked
        - upload_expired
        - link_expired
        - unsupported_media_type
        - too_many_uploads
        - precondition_failed
        - precondition_required
        - too_large
        - chunk_too_large
        - range_not_satisfiable
        - rate_limited
        - checksum_mismatch
        - internal
        - unavailable
        - quota_exceeded
        - storage_full

    SignedLink:
      type: object
      required: [url, disposition, expires_at]
      properties:
        url:
          type: string
          description: The absolute link. It is a credential; do not log it.
        disposition: { type: string, enum: [attachment, inline] }
        expires_at: { type: string, format: date-time }

    Account:
      type: object
      required: [id, external_id, name, status, quota_bytes, used_bytes, used_files, created_at, updated_at]
      properties:
        id: { type: string, example: acc_5m2k8x1v0c3d9q7r4t6w8y0z2a }
        external_id:
          type: [string, "null"]
          description: The client's own reference; unique among accounts.
        name: { type: string }
        status:
          type: string
          enum: [active, suspended, deleting]
        quota_bytes:
          type: integer
          format: int64
          description: Storage quota; 0 means unlimited.
        used_bytes: { type: integer, format: int64 }
        used_files: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AccountCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        external_id: { type: string, maxLength: 255 }
        quota_bytes: { type: integer, format: int64, minimum: 0, default: 0 }
        owner: { $ref: "#/components/schemas/OwnerCreate" }

    OwnerCreate:
      type: object
      required: [email, verification]
      additionalProperties: false
      description: The account's first owner, created with it. Verification is `email`, `link` or `none`. A session cannot use `none`. A session may use `link` only for an owner, and only an admin session may do that.
      properties:
        email: { type: string, format: email, maxLength: 254 }
        display_name: { type: string, maxLength: 200 }
        locale:
          type: string
          maxLength: 35
          default: en
          description: |
            A BCP 47-style tag, stored as given. Rendering resolves it: the exact tag if it is one of the
            seven languages, then its base language (`pt-BR` is `pt`), then English. The seven are `en`,
            `es`, `fr`, `pt` (European Portuguese), `ru`, `ar` and `he`.
        verification: { type: string, enum: [email, link, none] }

    AccountCreated:
      allOf:
        - $ref: "#/components/schemas/Account"
        - type: object
          properties:
            owner: { $ref: "#/components/schemas/UserWithVerification" }

    AdminCreate:
      type: object
      required: [email, verification]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        display_name: { type: string, maxLength: 200 }
        verification: { type: string, enum: [email, link], description: A session may use only email. }

    AdminList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/User" }
        next_cursor: { type: string }

    AccountUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        external_id: { type: string, maxLength: 255, description: An empty string clears it. }
        quota_bytes: { type: integer, format: int64, minimum: 0 }
        status: { type: string, enum: [active, suspended] }

    AccountList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Account" }
        next_cursor: { type: string, description: Absent on the last page. }

    Usage:
      type: object
      required: [quota_bytes, used_bytes, reserved_bytes, available_bytes, files, folders, used_files]
      properties:
        quota_bytes:
          type: [integer, "null"]
          format: int64
          description: The account's quota in bytes; null when the account is unlimited.
        used_bytes:
          type: integer
          format: int64
          description: The sizes of its files. A copy counts in full.
        reserved_bytes:
          type: integer
          format: int64
          description: The declared lengths of its unfinished uploads, held until each completes or ends.
        available_bytes:
          type: [integer, "null"]
          format: int64
          description: Quota less used and reserved bytes, never below zero; null when the quota is unlimited.
        files:
          type: integer
          format: int64
          description: How many files the account holds.
        folders:
          type: integer
          format: int64
          description: How many top-level folders it has.
        used_files:
          type: integer
          format: int64
          description: The same as files. Kept for clients that already read it.

    Key:
      type: object
      required: [id, name, prefix, created_at, expires_at, revoked_at, last_used_at]
      properties:
        id: { type: string, example: key_5m2k8x1v0c3d9q7r4t6w8y0z2a }
        name: { type: string }
        prefix:
          type: string
          description: The start of the key, to tell keys apart.
          example: sc_acct_Xq3v9T
        created_at: { type: string, format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        last_used_at:
          type: [string, "null"]
          format: date-time
          description: Updated at most once a minute.

    KeyCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        expires_at: { type: string, format: date-time, description: Must be in the future. }

    KeyCreated:
      allOf:
        - $ref: "#/components/schemas/Key"
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: The secret. Shown only in this response.

    KeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Key" }

    TokenCreate:
      type: object
      required: [folders]
      additionalProperties: false
      properties:
        user:
          type: string
          description: A user of the account to act as. Must exist and be active.
        folders:
          type: array
          minItems: 1
          maxItems: 32
          items: { type: string, example: fld_5m2k8x1v0c3d9q7r4t6w8y0z2a }
          description: Folders of the account the token reaches. Duplicates are dropped.
        permissions:
          type: string
          enum: [read, write]
          default: read
          description: Write implies read.
        ttl:
          type: integer
          minimum: 60
          default: 900
          description: Seconds. A value above `tokens.max_ttl` is refused with its limit in `details.max_ttl_seconds`.
        audience:
          type: string
          enum: [api]
          default: api
          description: Only `api` is accepted; `wopi` is not available yet.

    TokenCreated:
      type: object
      required: [token, expires_at]
      properties:
        token:
          type: string
          description: The token. Shown only in this response.
        expires_at: { type: string, format: date-time }

    TokensRevoked:
      type: object
      required: [tokens_not_before]
      properties:
        tokens_not_before:
          type: string
          format: date-time
          description: Tokens issued at or before this time no longer work.

    AuditEntry:
      type: object
      required: [id, time, actor, action, target, ip, user_agent, outcome]
      properties:
        id: { type: string }
        time: { type: string, format: date-time }
        actor:
          type: object
          required: [kind, id]
          properties:
            kind:
              type: string
              description: admin_key, account_key, user, anonymous (a failed sign-in with no known user) or system.
            id: { type: string }
        action: { type: string, example: account.create }
        target: { type: string, description: The ID acted on. }
        ip: { type: string }
        user_agent: { type: string }
        outcome: { type: string, example: ok }
        details: { type: object, additionalProperties: true }

    AuditList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEntry" }
        next_cursor: { type: string }

    Job:
      type: object
      required: [id, kind, target, status, created_at, updated_at, finished_at]
      properties:
        id: { type: string, example: job_5m2k8x1v0c3d9q7r4t6w8y0z2a }
        kind: { type: string, example: account.delete }
        target: { type: string, description: "What the job acts on: an account, or for node.copy the new root node." }
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        error: { type: string, description: Why the job failed. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }

    User:
      type: object
      required: [id, external_id, email, display_name, locale, role, status, verified_at, created_at, updated_at]
      properties:
        id: { type: string, example: usr_5m2k8x1v0c3d9q7r4t6w8y0z2a }
        external_id:
          type: [string, "null"]
          description: The client's own reference; unique within the account.
        email: { type: string, format: email }
        display_name: { type: string }
        locale: { type: string, example: en }
        role:
          type: string
          enum: [admin, owner, member]
        status:
          type: string
          enum: [pending, active, disabled]
        verified_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    UserCreate:
      type: object
      required: [email, verification]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        display_name: { type: string, maxLength: 200 }
        locale:
          type: string
          maxLength: 35
          default: en
          description: |
            A BCP 47-style tag, stored as given. Rendering resolves it: the exact tag if it is one of the
            seven languages, then its base language (`pt-BR` is `pt`), then English. The seven are `en`,
            `es`, `fr`, `pt` (European Portuguese), `ru`, `ar` and `he`.
        role: { type: string, enum: [owner, member], default: member }
        external_id: { type: string, maxLength: 255 }
        verification:
          type: string
          enum: [email, link, none]
          description: See the operation. `none` is for account and admin keys only.

    UserUpdate:
      type: object
      additionalProperties: false
      properties:
        display_name: { type: string, maxLength: 200 }
        locale:
          type: string
          maxLength: 35
          description: |
            A BCP 47-style tag, stored as given. Rendering resolves it: the exact tag if it is one of the
            seven languages, then its base language (`pt-BR` is `pt`), then English. The seven are `en`,
            `es`, `fr`, `pt` (European Portuguese), `ru`, `ar` and `he`.
        role: { type: string, enum: [owner, member] }
        external_id: { type: string, maxLength: 255, description: An empty string clears it. }
        status: { type: string, enum: [active, disabled] }

    UserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/User" }
        next_cursor: { type: string, description: Absent on the last page. }

    Verification:
      type: object
      required: [method]
      properties:
        method:
          type: string
          enum: [email, link]
        url:
          type: string
          format: uri
          description: For `link` only. The link to deliver; its token is in the fragment.
        token:
          type: string
          description: For `link` only. The token itself, shown once.
        expires_at:
          type: string
          format: date-time
          description: For `link` only.
        sent:
          type: boolean
          description: For `email` only. False when the mail could not be sent.

    UserWithVerification:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            verification: { $ref: "#/components/schemas/Verification" }

    VerificationRequest:
      type: object
      required: [method]
      additionalProperties: false
      properties:
        method: { type: string, enum: [email, link, none] }

    PasswordResetRequest:
      type: object
      required: [method]
      additionalProperties: false
      properties:
        method: { type: string, enum: [email, link] }

    VerifyRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token: { type: string, description: The token from the link's fragment. }
        password:
          type: string
          minLength: 8
          maxLength: 256
          description: Required when the user has no password yet.

    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email }
        password: { type: string }
        account:
          type: string
          description: The account to sign in to, when the email is in several.

    ForgotRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email: { type: string, format: email }
        account: { type: string, description: The account, when the email is in several. }

    ResetRequest:
      type: object
      required: [token, password]
      additionalProperties: false
      properties:
        token: { type: string }
        password: { type: string, minLength: 8, maxLength: 256 }

    PasswordChange:
      type: object
      required: [current_password, new_password]
      additionalProperties: false
      properties:
        current_password: { type: string }
        new_password: { type: string, minLength: 8, maxLength: 256 }

    SignedIn:
      type: object
      required: [user, csrf_token]
      properties:
        user: { $ref: "#/components/schemas/User" }
        csrf_token:
          type: string
          description: Send it as `X-CSRF-Token` on every request that changes state.

    MeUpdate:
      type: object
      additionalProperties: false
      properties:
        display_name: { type: string, maxLength: 200, description: Empty clears it. }
        locale:
          type: string
          maxLength: 35
          description: |
            A BCP 47-style tag, stored as given. Rendering resolves it: the exact tag if it is one of the
            seven languages, then its base language (`pt-BR` is `pt`), then English. The seven are `en`,
            `es`, `fr`, `pt` (European Portuguese), `ru`, `ar` and `he`.

    Me:
      type: object
      required: [user, account, csrf_token]
      properties:
        user: { $ref: "#/components/schemas/User" }
        account:
          description: The account of a tenant user; null for an installation admin.
          type: [object, "null"]
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        csrf_token: { type: string }
